<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tax II Past Paper Examiner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
/* Layout idea: an exam desk. Question paper on the left, answer script on the right, marker's red pen for feedback. */
:root{
  --paper:#f7f8fa;
  --sheet:#ffffff;
  --ink:#16202e;
  --muted:#5b6676;
  --rule:#dfe3ea;
  --accent:#1d4e89;      /* ink blue */
  --accent-soft:#e7eef8;
  --pen:#c0262d;         /* marker's red pen */
  --pen-soft:#fbeceb;
  --good:#1f7a4a; --good-soft:#e5f3eb;
  --warn:#9a6400; --warn-soft:#fbf1dc;
  --font-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11161d; --sheet:#171d26; --ink:#e4e8ee; --muted:#97a2b2; --rule:#2a3340;
    --accent:#7fb0ec; --accent-soft:#1c2a3c; --pen:#f0716f; --pen-soft:#3a1f22;
    --good:#5cc48c; --good-soft:#18301f; --warn:#e2b14f; --warn-soft:#352a14; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11161d; --sheet:#171d26; --ink:#e4e8ee; --muted:#97a2b2; --rule:#2a3340;
  --accent:#7fb0ec; --accent-soft:#1c2a3c; --pen:#f0716f; --pen-soft:#3a1f22;
  --good:#5cc48c; --good-soft:#18301f; --warn:#e2b14f; --warn-soft:#352a14; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--font-body)}
button,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.2}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* top bar */
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--rule);background:var(--sheet);position:sticky;top:0;z-index:5}
.bar h1{font-size:20px}
.bar .crumb{color:var(--muted);font-size:14px}
.bar .spacer{flex:1}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.pen{color:var(--pen);border-color:var(--pen)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{padding:4px 10px;font-size:13px}

/* home */
.home{max-width:1000px;margin:0 auto;padding:28px 20px 60px;display:grid;gap:22px}
.intro{max-width:68ch;color:var(--muted)}
.intro strong{color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:18px;display:grid;gap:10px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--accent)}
.card h2{font-size:19px}
.card .meta{font-size:13px;color:var(--muted)}
.card ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent)}
.status-line{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}

/* exam layout */
.exam{display:grid;grid-template-columns:minmax(0,var(--leftw,50%)) 8px minmax(0,1fr);gap:0;height:calc(100% - 58px)}
.exam.noleft{grid-template-columns:minmax(0,1fr)}
.exam.noleft .left,.exam.noleft .split{display:none}
.exam.noleft .right{max-width:920px;width:100%;justify-self:center}
.split{cursor:col-resize;background:var(--rule);position:relative;touch-action:none}
.split::after{content:"";position:absolute;top:50%;left:2px;width:4px;height:40px;margin-top:-20px;border-radius:2px;background:var(--muted);opacity:.5}
.split:hover,.split.drag{background:var(--accent)}
.toggle[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pane{overflow:auto;padding:20px 24px 60px}
.left{background:var(--sheet)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin:-4px 0 16px;position:sticky;top:-20px;background:var(--sheet);padding-top:8px;z-index:2}
.tab{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.doc{font-size:14.5px;max-width:78ch}
.doc p{margin:0 0 6px}
.doc .gap{height:10px}
.doc table{border-collapse:collapse;margin:8px 0 12px;width:100%;font-size:13.5px}
.doc td{border:1px solid var(--rule);padding:4px 8px;vertical-align:top}
.doc td.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.doc .head{font-weight:600}
.tablewrap{overflow-x:auto}
.locked{border:1px dashed var(--rule);border-radius:10px;padding:18px;color:var(--muted)}

/* right side */
.right{display:grid;align-content:start;gap:16px}
.partnav{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer;font-family:var(--font-mono)}
.chip.cur{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:500}
.chip.g{border-color:var(--good);color:var(--good)}
.chip.w{border-color:var(--warn);color:var(--warn)}
.chip.c{border-color:var(--pen);color:var(--pen)}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.qhead h2{font-size:22px}
.marks{font-family:var(--font-mono);font-size:14px;color:var(--muted)}
.required{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;white-space:pre-wrap}
.qtitle{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
textarea#answer{width:100%;min-height:340px;resize:vertical;border:1px solid var(--rule);border-radius:10px;padding:14px;background:var(--sheet);
  font-family:var(--font-mono);font-size:14px;line-height:24px;
  background-image:linear-gradient(var(--sheet),var(--sheet)),repeating-linear-gradient(transparent 0 23px,var(--rule) 23px 24px);
  background-clip:padding-box,content-box;background-origin:padding-box,content-box;background-blend-mode:normal}
textarea#answer{background-image:repeating-linear-gradient(transparent 0 23px,var(--rule) 23px 24px);background-attachment:local;background-position:0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{font-size:13px;color:var(--muted)}
dialog#keyDlg{border:1px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);max-width:520px;width:calc(100% - 32px);padding:20px 22px}
dialog#keyDlg::backdrop{background:rgba(0,0,0,.45)}
#keyDlg h3{margin:0 0 6px;font-family:var(--font-display);font-size:20px}
#keyDlg p{font-size:13px;color:var(--muted);margin:0 0 12px}
#keyDlg label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
#keyDlg .prov{display:flex;gap:16px;font-weight:400}
#keyDlg .prov label{font-weight:400;margin:0;display:flex;gap:6px;align-items:center}
#keyDlg input[type=password],#keyDlg input[type=text]{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit}
#keyDlg .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
#keyStatus{font-size:13px;margin-top:10px;min-height:1.2em}
#keyStatus.ok{color:var(--good)} #keyStatus.bad{color:var(--pen)}
.timer{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.timer.over{color:var(--pen)}

/* feedback */
.fb{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:18px;display:grid;gap:14px}
.score{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.score .big{font-family:var(--font-display);font-size:34px;font-weight:700;color:var(--pen);line-height:1}
.score .big small{font-size:18px;color:var(--muted);font-weight:600}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px}
.pill.g{background:var(--good-soft);color:var(--good)}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.pill.c{background:var(--pen-soft);color:var(--pen)}
.fb h3{font-family:var(--font-body);font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.err{border-left:3px solid var(--pen);background:var(--pen-soft);border-radius:0 8px 8px 0;padding:10px 12px;display:grid;gap:4px}
.err b{color:var(--pen)}
.err .fix::before{content:"Correct: ";font-weight:600;color:var(--good)}
.err .why{font-size:13.5px;color:var(--muted)}
.list{display:grid;gap:8px}
.miss{display:flex;gap:10px;align-items:baseline}
.miss .m{font-family:var(--font-mono);font-size:12px;color:var(--pen);border:1px solid var(--pen);border-radius:4px;padding:0 5px;white-space:nowrap}
.ok{display:flex;gap:8px}
.ok::before{content:"✓";color:var(--good);font-weight:700}
.revise{display:flex;flex-wrap:wrap;gap:6px}
.revise span{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:3px 9px;font-size:13.5px}
.tip{border-top:1px solid var(--rule);padding-top:10px;font-size:14px}
.history{font-size:13px;color:var(--muted)}
.chat{display:grid;gap:10px}
.msg{padding:10px 12px;border-radius:10px;white-space:pre-wrap;font-size:14px}
.msg.u{background:var(--accent-soft);justify-self:end;max-width:85%}
.msg.a{background:var(--paper);border:1px solid var(--rule)}
.chat textarea{width:100%;min-height:60px;border:1px solid var(--rule);border-radius:8px;padding:8px;background:var(--sheet)}
.busy{display:flex;align-items:center;gap:10px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pen);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}
.notice{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.selfmark{display:flex;gap:8px;align-items:center}
.selfmark input{width:70px;padding:5px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet)}

@media (max-width: 900px){
  .exam{grid-template-columns:1fr !important;height:auto}
  .split{display:none}
  .left{border-right:0;border-bottom:1px solid var(--rule);max-height:55vh}
  .pane{padding:16px}
}
</style>
</head>
<body>
<header class="bar">
  <h1>Tax II Examiner</h1>
  <span class="crumb" id="crumb">ACC3004W past papers</span>
  <span class="spacer"></span>
  <button class="btn small toggle" id="paperBtn" hidden aria-pressed="true">Scenario panel</button>
  <button class="btn small toggle" id="timerBtn" hidden aria-pressed="false">Timer</button>
  <button class="btn small toggle" id="layoutBtn" hidden aria-pressed="false" title="When off, only the tax content is marked: any format is fine and communication marks are given automatically.">Mark layout</button>
  <button class="btn small" id="keyBtn" hidden>AI key</button>
  <button class="btn small" id="homeBtn" hidden>All papers</button>
</header>
<dialog id="keyDlg" aria-labelledby="keyTitle">
  <h3 id="keyTitle">Use your own AI key</h3>
  <p>Your key is saved only in this browser and sent straight to Google or Anthropic, never to this site. Without one, the site uses its shared Gemini key if that is working.</p>
  <label>Provider</label>
  <div class="prov"><label><input type="radio" name="prov" value="gemini" checked> Gemini (free key)</label><label><input type="radio" name="prov" value="claude"> Claude (paid key)</label></div>
  <div class="hint" id="provHint" style="margin-top:6px"></div>
  <label for="keyIn">API key</label><input id="keyIn" type="password" autocomplete="off" spellcheck="false">
  <label for="modelIn">Model <span class="hint">(leave blank to pick automatically)</span></label><input id="modelIn" type="text" spellcheck="false">
  <div class="row"><button class="btn primary" id="keySave">Save and test</button><button class="btn" id="keyRemove">Remove my key</button><span style="flex:1"></span><button class="btn" id="keyClose">Close</button></div>
  <div id="keyStatus" role="status"></div>
</dialog>
<main id="app"></main>

<script>
const PAPERS = /*__DATA__*/null;
const MIN_PER_MARK = 180/113;
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- storage ---------- */
const KEY = "tax2-examiner-v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch { store = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch {} }
const prefs = store._prefs || (store._prefs = { timer: false, showPaper: true, leftw: 50 });
if (prefs.markLayout === undefined) prefs.markLayout = false;
const pkey = (paper, part) => paper.id + ":" + part.id;
function st(paper, part){ const k = pkey(paper, part); return store[k] || (store[k] = {answer:"", attempts:[]}); }
function best(paper, part){ const a = st(paper, part).attempts; return a.length ? Math.max(...a.map(x => +x.score || 0)) : null; }
function band(score, out){ const r = score / out; return r >= .75 ? "g" : r >= .5 ? "w" : "c"; }

/* ---------- Claude ---------- */
const view = { paper:null, q:0, p:0, tab:"scenario" };
/* Marker backends, in order: Claude (inside a Claude artifact) > the user's own key (Gemini or Claude, called
   straight from the browser) > this site's shared Gemini key via /api (on Vercel) > self-mark. */
let sample = null, sampleReady = false, api = null; // api = {model, codeRequired}
const CODE_KEY = "tax2-examiner-code", BYOK_KEY = "tax2-examiner-byok";
function getCode(){ try { return localStorage.getItem(CODE_KEY) || ""; } catch { return ""; } }
function setCode(v){ try { localStorage.setItem(CODE_KEY, v); } catch {} }
function getByok(){ try { const b = JSON.parse(localStorage.getItem(BYOK_KEY) || "null"); return b && b.key ? b : null; } catch { return null; } }
function setByok(b){ try { b ? localStorage.setItem(BYOK_KEY, JSON.stringify(b)) : localStorage.removeItem(BYOK_KEY); } catch {} }
let byok = getByok();
const onWeb = /^https?:$/.test(location.protocol) && !window.claude;
(async () => {
  if (onWeb) {
    try { const r = await fetch("api/health"); if (r.ok){ const h = await r.json(); if (h.ok && h.keySet) api = h; } } catch {}
  }
  if (!onWeb) { try { if (window.claude?.use) sample = await window.claude.use("sample"); } catch { sample = null; } }
  sampleReady = true; $("#keyBtn").hidden = !!sample;
  if (view.paper && document.getElementById("right")) renderRight();
})();
const backend = () => sample ? "claude-artifact" : byok ? "byok" : api ? "api" : null;
const canMark = () => !!backend();
function markerLabel(){
  const b = backend();
  if (b === "byok") return `Marked with your own ${byok.provider === "claude" ? "Claude" : "Gemini"} key (${esc(byok.model || "auto")}).`;
  if (b === "api") return `Marked by the site's shared Gemini key (${esc(api.model)}).`;
  return "";
}
async function apiPost(path, body, signal){
  const r = await fetch(path, { method:"POST", signal, headers:{ "Content-Type":"application/json", "x-access-code": getCode() }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) throw { code: "access_code" };
  if (r.status === 429) throw { code: "rate_limited" };
  if (!r.ok) throw { code: data.error === "invalid_json" ? "invalid_json" : "upstream_error", message: data.error };
  return data;
}
/* --- direct (bring-your-own-key) calls --- */
async function pickGeminiModel(key){
  const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200", { headers: { "x-goog-api-key": key } });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw { code: r.status === 400 || r.status === 401 || r.status === 403 ? "bad_key" : "upstream_error", message: d?.error?.message };
  const names = (d.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
    .map(m => m.name.replace(/^models\//, ""))
    .filter(n => /^gemini-[\d.]+-flash$/.test(n) || /^gemini-flash-latest$/.test(n));
  const ver = n => parseFloat((n.match(/gemini-([\d.]+)/) || [])[1] || "0");
  names.sort((a, b) => ver(b) - ver(a));
  if (!names.length) throw { code: "upstream_error", message: "No Gemini Flash model is available to this key." };
  // Some listed models hang or are overloaded for a given key: ping the newest few and use the newest that answers.
  const ping = m => { const c = new AbortController(); const tm = setTimeout(() => c.abort(), 12000);
    return fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`, { method: "POST", signal: c.signal,
      headers: { "Content-Type": "application/json", "x-goog-api-key": key },
      body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: "Reply OK" }] }] }) })
      .then(r => r.ok).catch(() => false).finally(() => clearTimeout(tm)); };
  const cand = names.slice(0, 5), okv = await Promise.all(cand.map(ping));
  const m = cand.find((x, i) => okv[i]);
  if (!m) throw { code: "upstream_error", message: "Gemini didn't answer on any model just now (busy). Try again in a minute." };
  return m;
}
async function byokCall(turns, { json = false, signal } = {}){
  const b = byok;
  if (b.provider === "claude") {
    const sys = json ? "Reply with a single valid JSON object and nothing else." : undefined;
    const r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", signal,
      headers: { "content-type": "application/json", "x-api-key": b.key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: b.model || "claude-sonnet-5-5", max_tokens: 8000, ...(sys ? { system: sys } : {}),
        messages: turns.map(x => ({ role: x.role === "assistant" ? "assistant" : "user", content: String(x.content) })) }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw { code: r.status === 401 || r.status === 403 ? "bad_key" : r.status === 429 ? "rate_limited" : "upstream_error", message: d?.error?.message };
    return (d.content || []).filter(c => c.type === "text").map(c => c.text).join("");
  }
  if (!b.model) { b.model = await pickGeminiModel(b.key); setByok(b); }
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(b.model)}:generateContent`, { method: "POST", signal,
    headers: { "Content-Type": "application/json", "x-goog-api-key": b.key },
    body: JSON.stringify({ contents: turns.map(x => ({ role: x.role === "assistant" ? "model" : "user", parts: [{ text: String(x.content) }] })),
      generationConfig: { temperature: json ? 0.2 : 0.4, ...(json ? { responseMimeType: "application/json" } : {}) } }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw { code: r.status === 400 && /api key/i.test(d?.error?.message || "") || r.status === 401 || r.status === 403 ? "bad_key" : r.status === 429 ? "rate_limited" : "upstream_error", message: d?.error?.message };
  const text = (d?.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("");
  if (!text) throw { code: "upstream_error", message: "The model returned no text." };
  return text;
}
function parseJSON(text){
  try { return JSON.parse(text); } catch {}
  const m = String(text).match(/\{[\s\S]*\}/); if (m) { try { return JSON.parse(m[0]); } catch {} }
  throw { code: "invalid_json" };
}
async function markJSON(prompt, signal){
  const b = backend();
  if (b === "byok") return parseJSON(await byokCall([{ role: "user", content: prompt }], { json: true, signal }));
  if (b === "api") return apiPost("api/mark", { prompt }, signal);
  return sample.json(prompt, { modelTier: "complex", signal });
}
async function chatText(turns, onText){
  const b = backend();
  if (b === "byok") { const text = await byokCall(turns); onText(text); return text; }
  if (b === "api") { const { text } = await apiPost("api/chat", { turns }); onText(text); return text; }
  const { text } = await sample(turns, { cache:false, onText: ({text}) => onText(text) });
  return text;
}
/* --- key dialog --- */
const PROV_HINT = {
  gemini: 'Free: go to <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>, click Create API key, and paste it here (starts with AIza).',
  claude: 'Paid per use: create a key at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a> (starts with sk-ant-). Default model: claude-sonnet-5-5.',
};
function openKeyDlg(){
  const d = $("#keyDlg"), b = byok || { provider: "gemini", key: "", model: "" };

/* ---------- document renderer (rows with "  |  " become tables) ---------- */
const NUM = /^[-–(]?\s*R?\s*[\d][\d\s.,]*\)?\s*%?$/;
function renderDoc(text){
  const lines = String(text).split("\n");
  let html = "", rows = [];
  const flush = () => {
    if (!rows.length) return;
    const n = Math.max(...rows.map(r => r.length));
    html += '<div class="tablewrap"><table>' + rows.map(r => "<tr>" + r.map((c, i) => {
      const span = (i === r.length - 1 && r.length < n) ? ` colspan="${n - r.length + 1}"` : "";
      return `<td${span}${NUM.test(c.trim()) && c.trim() ? ' class="num"' : ""}>${esc(c)}</td>`;
    }).join("") + "</tr>").join("") + "</table></div>";
    rows = [];
  };
  for (const raw of lines){
    let l = raw.trimEnd();
    if (/^(QUESTION \d|STACKED)/.test(l)) l = l.split("  |  ").join(" ");
    if (l.includes("  |  ")) { rows.push(l.split("  |  ").map(s => s.trim())); continue; }
    flush();
    if (!l.trim()) { html += '<div class="gap"></div>'; continue; }
    const head = /^(QUESTION|Question|Part [AB]|REQUIRED|Notes?$|Additional [Ii]nformation|[A-Z][A-Za-z &'’\-]{2,40}$)/.test(l.trim()) && l.trim().length < 60 && !/[.,;]$/.test(l.trim());
    html += `<p${head ? ' class="head"' : ""}>${esc(l)}</p>`;
  }
  flush();
  return html;
}

/* ---------- routing / views ---------- */
function go(hash){ if (location.hash !== "#" + hash) location.hash = hash; else route(); }
function route(){
  const id = location.hash.slice(1);
  const paper = PAPERS.find(p => p.id === id);
  if (!paper){ view.paper = null; renderHome(); return; }
  if (view.paper !== paper){
    view.paper = paper; view.tab = "scenario";
    // resume at first part without an attempt
    let found = false;
    paper.questions.forEach((q, qi) => q.parts.forEach((pt, pi) => {
      if (!found && !st(paper, pt).attempts.length){ view.q = qi; view.p = pi; found = true; }
    }));
    if (!found){ view.q = 0; view.p = 0; }
  }
  renderExam();
}
window.addEventListener("hashchange", route);
$("#homeBtn").onclick = () => go("");
$("#paperBtn").onclick = () => { prefs.showPaper = !prefs.showPaper; save(); applyLayout(); };
$("#layoutBtn").onclick = () => { prefs.markLayout = !prefs.markLayout; save(); applyLayout(); if (view.paper) renderRight(); };
$("#timerBtn").onclick = () => { prefs.timer = !prefs.timer; save(); if (!prefs.timer) resetTimer(); applyLayout(); if (view.paper) tickTimer(Math.round(cur().pt.marks * MIN_PER_MARK)); };
function applyLayout(){
  const app = $("#app"); const inExam = !!view.paper;
  $("#paperBtn").hidden = !inExam; $("#timerBtn").hidden = !inExam; $("#layoutBtn").hidden = !inExam;
  $("#layoutBtn").setAttribute("aria-pressed", String(!!prefs.markLayout));
  $("#paperBtn").setAttribute("aria-pressed", String(prefs.showPaper));
  $("#timerBtn").setAttribute("aria-pressed", String(prefs.timer));
  if (!inExam) return;
  app.classList.toggle("noleft", !prefs.showPaper);
  app.style.setProperty("--leftw", prefs.leftw + "%");
  const tm = $("#timer"); if (tm) tm.hidden = !prefs.timer;
}
function wireSplit(){
  const sp = $("#split"); if (!sp) return;
  sp.onpointerdown = e => {
    sp.setPointerCapture(e.pointerId); sp.classList.add("drag");
    const box = $("#app").getBoundingClientRect();
    sp.onpointermove = ev => { prefs.leftw = Math.min(75, Math.max(20, (ev.clientX - box.left) / box.width * 100)); $("#app").style.setProperty("--leftw", prefs.leftw + "%"); };
    sp.onpointerup = () => { sp.onpointermove = null; sp.classList.remove("drag"); save(); };
  };
  sp.onkeydown = e => { if (e.key === "ArrowLeft" || e.key === "ArrowRight"){ prefs.leftw = Math.min(75, Math.max(20, prefs.leftw + (e.key === "ArrowLeft" ? -5 : 5))); save(); applyLayout(); } };
}

function paperProgress(paper){
  let got = 0, done = 0, n = 0;
  for (const q of paper.questions) for (const pt of q.parts){ n++; const b = best(paper, pt); if (b !== null){ done++; got += b; } }
  return {got, done, n};
}

function move(i, all){ const x = all[i]; if (!x) return; view.q = x.qi; view.p = x.pi; view.tab = "scenario"; resetTimer(); renderLeft(); renderRight(); $("#right").scrollTop = 0; $("#left").scrollTop = 0; }
function startTimer(mins){ if (timerStart) return; timerStart = Date.now(); timerInt = setInterval(() => tickTimer(mins), 1000); }
function resetTimer(){ clearInterval(timerInt); timerInt = null; timerStart = null; }
function tickTimer(mins){
  const el = $("#timer"); if (!el || !prefs.timer) return;

  el.textContent = `${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")} of ${mins}:00`;
  el.classList.toggle("over", sec > mins*60);
}

/* ---------- marking ---------- */
function markingPrompt(paper, q, pt, answer){
  return `You are an experienced examiner marking a UCT ACC3004W Taxation II (South African tax) exam script. Mark the student's answer to ONE required against the suggested solution, the way a real UCT marker would, then give feedback that teaches.

MARKING RULES
- Total for this required: ${pt.marks} marks. Never award more than ${pt.marks}.
- Where the memo shows mark allocations (numbers like "| 1" or "0,5" at the end of a line, and "Available"/"Maximum"/"Limited" totals), follow them. "Available" can exceed the maximum: the student can reach the maximum without hitting every point.
- Where the memo shows no allocations, award about 1 mark per distinct correct point (a correct amount with its reason/section, or a correct conclusion with its reason), ½ for partly correct workings, and scale so the available marks are a little above ${pt.marks}, like UCT memos.
- Award marks for valid alternative treatments and reasonable stated assumptions, even if the memo took another route.
- Apply carry-forward (method) marks: if the student used an earlier wrong figure correctly later on, give the later mark and penalise the error only once.
- No marks for vague statements, a section number with no application to the facts, or a correct number with no reason when the required says "with reasons".
${prefs.markLayout ? `- Communication/critical thinking marks (X1, Y1, etc.) are awarded only if the answer is well structured and argued as the required asks (e.g. memo format, a table layout).` : `- CONTENT-ONLY MARKING (the student chose this): mark only the tax substance: the correct treatment, amounts, workings, sections and the reason for each item, and conclusions. Accept ANY format: plain lines, bullet points, shorthand, abbreviations, no tables, no columns, no headings, no letter/memo/report format. A short reason in any form counts as the reason. Never deduct for layout, presentation, structure or format, even if the required asks for a specific layout.\n- Award communication/critical thinking/presentation marks (X1, Y1, etc.) in full automatically, as long as the answer makes a genuine attempt at the content.\n- Do not mention layout, format or presentation anywhere in the feedback or the exam tip.`}
- This memo is a suggested solution${paper.unofficial ? " from an unofficial source and may contain errors" : ""}. If the memo is clearly wrong in law or arithmetic, mark according to the correct law and say so in your feedback.
- Be strict but fair. Half marks are allowed.

FEEDBACK RULES
- "errors": things the student did that are WRONG. Quote or paraphrase what they did, give the correct treatment with the correct figure, and say why (section/paragraph of the Income Tax Act, VAT Act, Estate Duty Act or Seventh/Eighth Schedule).
- "missed": memo points the student did not address, each with the marks it carried.
- "correct": short list of points that earned marks.
- "revise": 2–5 specific topics to revise from their notes, phrased like "Seventh Schedule para 7(7)/(8): not applied for employees' tax".
- "examTip": one practical exam-technique tip based on this script.
- If the answer is blank or irrelevant, score 0 and explain what the required wanted.
- Plain language, South African tax terminology, Rands written like R12 345.

=== ${paper.title} — ${q.title} ===
SCENARIO:
${q.scenario}

TAX TABLES PROVIDED IN THE EXAM:
${paper.tables}

REQUIRED ${pt.id} (${pt.marks} marks):
${pt.required}

SUGGESTED SOLUTION (memo) FOR ${pt.id}:
${pt.memo}

STUDENT'S ANSWER:
<<<
${answer}
>>>

Reply with only one JSON object in exactly this shape:
{"score": number, "overall": "2-3 sentence verdict", "errors": [{"what": "...", "fix": "...", "why": "..."}], "missed": [{"point": "...", "marks": number}], "correct": ["..."], "revise": ["..."], "examTip": "..."}`;
}

let markCtl = null;
async function submit(){
  const paper = view.paper, {q, pt} = cur(), s = st(paper, pt);
  const answer = $("#answer").value.trim();
  s.answer = $("#answer").value; save();
  if (!answer){ $("#fbSlot").innerHTML = `<div class="notice">Write an answer first. Even a partial attempt gets useful feedback.</div>`; return; }
  if (!canMark()){ selfMark(paper, pt, s); return; }
  if (backend() === "api" && api.codeRequired && !getCode()){ askCode(); return; }
  const btn = $("#submit"); btn.disabled = true;
  const t0 = Date.now();
  $("#fbSlot").innerHTML = `<div class="fb"><div class="busy"><span class="dot"></span><span id="busyTxt">Marking against the memo… this usually takes 30–90 seconds.</span></div><div class="row"><button class="btn small" id="stop">Stop</button></div></div>`;
  const iv = setInterval(() => { const el = $("#busyTxt"); if (el) el.textContent = `Marking against the memo… ${Math.floor((Date.now()-t0)/1000)}s`; }, 1000);
  markCtl = new AbortController();
  $("#stop").onclick = () => markCtl.abort();
  try {
    const f = await markJSON(markingPrompt(paper, q, pt, answer), markCtl.signal);
    let score = Math.max(0, Math.min(pt.marks, Number(f?.score) || 0));
    score = Math.round(score * 2) / 2;
    s.attempts.push({ score, feedback: f, answer, at: Date.now() });
    s.memoUnlocked = true; save();
    renderRight(); renderLeft();
    $("#fbSlot")?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"});
  } catch (e) {
    const msg = {
      cancelled: "Marking stopped.",
      not_granted: "Claude wasn't allowed to mark on this page. You can still self-mark against the memo.",
      rate_limited: "You've hit a usage limit. Wait a bit, then press Submit again.",
      invalid_json: "The marker's reply came back garbled. Press Submit again.",
      prompt_too_large: "The answer is too long to send. Trim it and try again.",
      access_code: "That access code was wrong. Enter it again, then press Submit.",
      bad_key: "Your AI key was rejected. Open AI key (top right) and check it.",
    }[e?.code] || `Marking failed${e?.message ? ": " + e.message : " (connection or service problem)"}. Press Submit to try again.`;
    $("#fbSlot").innerHTML = `<div class="notice">${esc(msg)}</div>`;
    if (e?.name === "AbortError") $("#fbSlot").innerHTML = `<div class="notice">Marking stopped.</div>`;
    if (e?.code === "not_granted"){ sample = null; }
    if (e?.code === "access_code"){ setCode(""); askCode(); }
  } finally { clearInterval(iv); const b = $("#submit"); if (b) b.disabled = false; }
}

function askCode(){
  const slot = $("#fbSlot");
  slot.innerHTML = `<div class="fb"><div>This site's marking is protected by an access code (the ACCESS_CODE you set in Vercel).</div>
    <div class="selfmark"><label for="codeIn">Access code</label><input id="codeIn" type="password" style="width:180px" value=""><button class="btn small primary" id="codeSave">Save</button></div></div>`;
  $("#codeSave").onclick = () => { setCode($("#codeIn").value.trim()); renderRight(); };
}

function selfMark(paper, pt, s){
  s.memoUnlocked = true; prefs.showPaper = true; save(); applyLayout(); view.tab = "memo"; renderLeft();
  $("#fbSlot").innerHTML = `<div class="fb"><div>Compare your answer with the memo on the left, then record your mark.</div>
    <div class="selfmark"><label for="selfScore">My mark</label><input id="selfScore" type="number" min="0" max="${pt.marks}" step="0.5"><span>/ ${pt.marks}</span><button class="btn small primary" id="saveSelf">Save</button></div></div>`;
  $("#saveSelf").onclick = () => {
    const v = Math.max(0, Math.min(pt.marks, +$("#selfScore").value || 0));
    s.attempts.push({score: v, self: true, answer: s.answer, at: Date.now()}); save(); renderRight();
  };
}

/* ---------- follow-up chat ---------- */
const chats = {};
function openChat(){
  const paper = view.paper, {q, pt} = cur(), s = st(paper, pt), a = s.attempts[s.attempts.length-1];
  const k = pkey(paper, pt);
  const ch = chats[k] || (chats[k] = []);
  const box = $("#chat"); box.hidden = false;
  const draw = () => {
    box.innerHTML = ch.map(m => `<div class="msg ${m.role === "user" ? "u" : "a"}">${esc(m.content)}</div>`).join("") +
      `<label class="hint" for="askIn">Ask about your mark, a section, or why the memo treats something a certain way.</label>
       <textarea id="askIn" placeholder="e.g. Why is para 7(7) not applied for employees' tax?"></textarea>
       <div class="row"><button class="btn primary small" id="askSend">Ask</button></div>`;
    $("#askSend").onclick = send;
  };
  const rules = `You are the UCT ACC3004W Taxation II examiner who just marked this student's answer. Answer their follow-up questions about the marking and the tax law involved: concise, specific to this scenario, cite the relevant section/paragraph, and use worked figures where helpful. If they argue for a mark, judge it fairly against the memo and law.

SCENARIO:\n${q.scenario}\n\nREQUIRED ${pt.id} (${pt.marks} marks):\n${pt.required}\n\nMEMO:\n${pt.memo}\n\nSTUDENT'S ANSWER:\n${a?.answer || s.answer}\n\nYOUR MARKING (score ${a?.score}/${pt.marks}):\n${JSON.stringify(a?.feedback || {})}`;
  async function send(){
    const t = $("#askIn").value.trim(); if (!t || !canMark()) return;
    ch.push({role:"user", content:t}); draw();
    const bubble = document.createElement("div"); bubble.className = "msg a"; bubble.textContent = "Thinking…";
    box.insertBefore(bubble, $("label.hint", box));
    $("#askSend").disabled = true;
    try {
      const turns = [{role:"user", content: rules}, {role:"assistant", content:"Understood. What would you like to know about your marking?"}, ...ch.slice(-12)];
      const text = await chatText(turns, t => { bubble.textContent = t; });
      ch.push({role:"assistant", content:text});
    } catch (e) {
      ch.push({role:"assistant", content: e?.code === "rate_limited" ? "Usage limit reached. Try again shortly." : "That didn't go through. Ask again."});
    }
    draw();
  }
  draw(); $("#askIn").focus();
}

route();
</script>
</body>
</html>
