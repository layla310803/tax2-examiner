5,22; Cr VAT input R65,22  |  1\nAvailable  |  8\nMaximum  |  8"}]}]}, {"id": "gino", "title": "Gino Todd — Individuals Scenario", "short": "Gino Todd", "marks": 34, "yoa": "2025", "unofficial": true, "memoNote": "Memo generated with NotebookLM from your Tax 2 notebook. It is not an official solution, so check anything that looks off.", "tables": "MONETARY CHANGES - 2025\nApplicable in respect of years of assessment commencing on or after 1 March 2024 (i.e.\n2025 year of assessment) – unless specifically stated otherwise\nREBATES (section 6)\nPrimary rebate increases from R16 425 to R17 235;\nSecondary rebate increases from R9 000 to R9 444;\nTertiary rebate increases from R2 997 to R3 145\nMEDICAL REBATES (section 6A)\nBenefits to the taxpayer: R364;\nBenefits to the taxpayer and one dependant: R728;\nBenefits to each additional dependant: R246\nRESIDENTIAL ACCOMMODATION (paragraph 9 of the Seventh Schedule)\nSymbol B of R91 250 increases to R95 750.\nRATES OF NORMAL TAX\n•  |  In respect of the taxable income (excluding any retirement fund lump sum\nbenefit, retirement fund lump sum withdrawal benefit or severance benefit) of natural\npersons, estates and special trusts\nTaxable Income (R)  |  Rate of Tax\n0 – 237 100  |  18% of taxable income\n237 101 – 370 500  |  42 678 + 26% of taxable income above 237 100\n370 501 – 512 800  |  77 362 + 31% of taxable income above 370 500\n512 801 – 673 000  |  121 475 + 36% of taxable income above 512 800\n673 001 – 857 900  |  179 147 + 39% of taxable income above 673 000\n857 901 – 1 817 000  |  251 258 + 41% of taxable income above 857 900\n1 817 001 and above  |  644 489 + 45% of taxable income above 1 817 000\n•  |  In respect of the taxable income of any company which qualifies as a small\nbusiness corporation as defined in section 12E of the Income Tax Act, in respect of\nany year of assessment ending any date between 1 April 2025 and 31 March 2026.\nTaxable Income (R)  |  Rate of Tax\n0 – 95 750  |  0% of taxable income\n95 751 – 365 000  |  7% of the amount above R95 750\n365 001 – 550 000  |  R18 848 + 21% of the amount above R365 000\n550 001 and above  |  R57 698 + 27% of the amount above R550 000\nTRAVEL ALLOWANCE\nWhere the value of the vehicle (R) -  |  Fixed  |  Fuel  |  Mainte\ncost  |  cost  |  nance\ncost\n(R p.a.)  |  (c/km  |  (c/km)\n)\ndoes not exceed R100 000  |  34 480  |  151.7  |  46.0\nexceeds R100 000 but does not exceed R200 000  |  61 770  |  169.4  |  57.6\nexceeds R200 000 but does not exceed R300 000  |  89 119  |  184.0  |  63.5\nexceeds R300 000 but does not exceed R400 000  |  113 436  |  197.9  |  69.3\nexceeds R400 000 but does not exceed R500 000  |  137 752  |  211.8  |  81.5\nexceeds R500 000 but does not exceed R600 000  |  163 178  |  243.0  |  95.6\nexceeds R600 000 but does not exceed R700 000  |  188 653  |  247.1  |  107.3\nexceeds R700 000 but does not exceed R800 000  |  215 447  |  251.2  |  118.9\nexceeds R800 000  |  215 447  |  251.2  |  118.9\nAlternative fixed rate for certain reimbursive travel allowances: 484 cents per kilometer\n(previously 464 cents)\nSUBSISTENCE ALLOWANCE\n• Local travel:\no  |  Allowance for incidental costs only – R169 (previously R161) for each day.\no  |  Allowance for meals and incidental costs – R548 (previously R522) for each day.\n• Overseas travel:\nActual accommodation plus a prescribed amount based on the relevant country (which\namount will be provided in the IAC if it differs from the amount listed in the Regulation in\nthe SAICA Student Handbook).\nTRANSFER DUTY (Section 2(1)(b) of the Transfer Duty Act)\nIn respect of acquisition of property on or after 1 March 2020:\nValue of property (R)  |  Rate\n0 – 1 100 000  |  0%\n1 100 001 – 1 512 500  |  3% of the value above R1 100 000\n1 512 501 – 2 117 500  |  R12 375 + 6% of the value above R1 512 500\n2 117 501 – 2 722 500  |  R48 675 + 8% of the value above R2 117 500\n2 722 501 – 12 100 000  |  R97 075 + 11% of the value above R2 722 500\n12 100 001 and above  |  R1 128 600 + 13% of the value above R12 100 000", "questions": [{"id": "Q1", "title": "Gino Todd / Market-It Ltd", "marks": 34, "scenario": "Gino Todd  |  (34 marks; 51 minutes)\nGino Todd, a South African resident, works as a marketing executive for Market–It Ltd (Market-\nIt). Market-It is a brand intelligence company, which works with some of South Africa’s biggest\ncompanies on brand campaigns and awareness. Market-It has a year of assessment ending\n30 June and the company is a registered VAT vendor.\nGino is 54 years old and married in community of property to Melissa Todd, who is 56 years\nold. Gino and Melissa have no children.\nGino has provided you with the following extract of his remuneration package and asked for\nyour assistance in determining his normal tax for the year of assessment ended 28 February\n2025:\nDescription  |  Amount  |  Note\nSalary  |  Gino received a fixed monthly salary.  |  R32 000/month\nCommission  |  Gino earns commission based on the 0.5% of selected  |  1\ncompany’s fee income generated from fee income\nclients that were signed by him.\nCanal Walk gift voucher  |  Gino received an annual clothing gift R10 000/year  |  2\nvoucher.\nEntertainment allowance Market–It does not require employees to R3 500/month  |  3\naccount for the expenditure incurred on the\nentertainment allowance.\nRight of use of motor  |  Gino has been allowed to use the  |  4\nvehicle  |  company’s VW Polo.\nRight of use of  |  Market–It owns 5 apartments in an  |  5\nresidential  |  apartment block situated opposite its\naccommodation  |  offices. Senior employees are allowed to\nuse these apartments at certain times\nduring the year.\n1. Commission income is earned evenly over the year of assessment. Commission\nincome, which accrues to individual employees, is calculated at the end of the\ncompany’s year of assessment and paid on the first day of the following financial year.\nGino received commission income of R550 000 and R585 000 on 1 July 2024 and 1\nJuly 2025 respectively.\n2. Market-It has a strict dress code and employees are required to look smart at all times.\nAs these clothes can be expensive, the company provides key employees with a\nR10 000 (incl. VAT) Canal Walk Shopping Centre gift voucher on an annual basis.\nEmployees can use the gift vouchers to purchase clothing as they see fit at the\nnumerous stores in Canal Walk.\n3. Despite the fact that Gino is not required to account for expenditure, Gino has kept\naccurate records and receipts of his expenditure. During the 2025 year of assessment,\nGino spent R58 000 entertaining existing and prospective clients.\n4. In February 2024, Melissa Todd won a VW Polo in a competition that she had entered.\nAt that time, Melissa and Gino each owned their own motor vehicles and had no\nalternative use for the VW Polo. Therefore, Melissa immediately entered into a 5-year\noperating lease agreement with Market–It. It is company policy to provide all senior\nexecutives with the right of use of a company car. Gino was given the right to use this\nVW Polo on 1 March 2024. At the time that the lease was entered into, the Polo had a\nmarket value of R255 000. Market–It is liable for monthly lease payments of R2 000.\nThe lease payments have remained consistent since the lease was entered into.\nGino’s logbook reflected that he travelled a total of 36 000km during the 2025 year of\nassessment in the VW Polo, of which 22 000km were for business. Gino incurred all\nfuel and maintenance costs, however he did not keep an accurate record of this\nexpenditure.\n5. Gino, as a senior executive of the company, is entitled to use one of the apartments\nowned by Market–It. On 1 April 2024 Gino took up this right and he and Melissa moved\ninto one of the company apartments, where they continued to live for the remainder of\nthe year of assessment. All the apartments owned by Market–It are two-bedroom,\nfurnished apartments. Market–It incurs all incidental costs such as water and electricity\ncosts for the occupied apartments.\nOther:\n• Gino contributes to a medical aid fund in his personal capacity. Melissa is a dependent\nof his in terms of this policy. During the 2025 year of assessment, he made\ncontributions of R2 600 per month. Gino incurred medical costs of R46 000 which\nwere not recoverable from the medical aid during the 2025 year of assessment. Half\nof this amount had been settled and paid by 28 February 2025.\n• Gino’s remuneration proxy for the 2025 year of assessment equaled R986 000.", "parts": [{"id": "A", "marks": 25, "required": "Calculate, providing reasons where appropriate, Gino's normal tax for the year of assessment ended 28 February 2025.", "memo": "PART A: Gino Todd's normal tax for the year ended 28 February 2025\nItem  |  Reason/Working  |  Amount (R)  |  Mark\nFixed cash salary  |  Para (c) of gross income: R32 000 × 12. Not split between spouses married in community of property as it is remuneration for his own services (s7(2)).  |  384 000  |  1\nCommission (Note 1)  |  Variable remuneration in terms of s7B(1).  |    |  1\n|  s7B(2): deemed to accrue to the employee on the date it is actually paid.  |    |  1\n|  Commission paid on 1 July 2024 (R550 000) falls in the 2025 year and is included in full.  |  550 000  |  1\n|  Commission paid on 1 July 2025 (R585 000) accrues in the 2026 year and is excluded.  |  0  |  0,5\nCanal Walk gift voucher (Note 2)  |  A voucher is a taxable fringe benefit (para (i) of gross income read with para 2(a)/para 5 of the Seventh Schedule).  |    |  1\n|  Valued at cost to the employer including VAT.  |  10 000  |  1\n|  The s10(1)(nA) uniform exemption does not apply: not a distinctive uniform, employees choose any clothes.  |    |  1\nEntertainment allowance (Note 3)  |  Allowance where the employee is not required to account: included under s8(1)(a)(i). R3 500 × 12  |  42 000  |  1\n|  No reduction for amounts spent: s23(m) prohibits deductions for an employee earning mainly remuneration; s8(1)(a)(ii) does not apply as he did not have to account.  |    |  1\n|  Net inclusion R42 000.  |    |  0,5\nMotor vehicle leased to employer (Note 4)  |  Anti-avoidance rule s8(1)(b)(iv): vehicle owned by the employee/spouse leased to the employer and provided back for his use.  |    |  1\n|  The rental received and the lease are ignored for gross income.  |  0  |  0,5\n|  The right of use is ignored for para 7 of the Seventh Schedule.  |  0  |  0,5\n|  The rental paid by the employer (R2 000 × 12) is deemed a travel allowance under s8(1)(b).  |  24 000  |  1\n|  Logbook kept: total 36 000 km, business 22 000 km.  |    |  0,5\n|  No actual cost records, so use the deemed cost method.  |    |  0,5\n|  Vehicle value R255 000: bracket R200 001 to R300 000.  |    |  0,5\n|  Fixed cost: R89 119 / 36 000 km × 100 = 247,55 c/km  |    |  1\n|  Fuel cost 184,0 c/km (he bears all fuel)  |    |  0,5\n|  Maintenance cost 63,5 c/km (he bears all maintenance)  |    |  0,5\n|  Total deemed rate 495,05 c/km  |    |  0,5\n|  Deemed business deduction: 22 000 km × R4,9505 = R108 911  |    |  1\n|  Limited to the allowance received; net inclusion R0  |  (24 000)  |  1\nResidential accommodation (Note 5)  |  Taxable benefit under para 2(d) of the Seventh Schedule.  |    |  0,5\n|  Owned by the employer, so use the para 9(3) formula (A − B) × C/100 × D/12.  |    |  1\n|  A: remuneration proxy R986 000  |    |  0,5\n|  B: R95 750  |    |  0,5\n|  C: two-bedroom apartment (fewer than 4 rooms), therefore C = 17  |    |  1\n|  D: 11 months (1 April 2024 to 28 February 2025)  |    |  0,5\n|  (R986 000 − R95 750) × 17/100 × 11/12  |  138 724  |  1\n|  Less consideration paid by employee: nil  |    |  0,5\nTaxable income  |    |  1 124 724  |  1\nNormal tax per tables  |  R251 258 + 41% × (R1 124 724 − R857 900)  |  360 656  |  1\nPrimary rebate s6  |  Under 65  |  (17 235)  |  1\nMedical scheme fees tax credit s6A  |  (R364 + R364) × 12 for himself and Melissa  |  (8 736)  |  1\nAdditional medical expenses tax credit s6B  |  Under 65, no disability: s6B(3)(c)  |    |  0,5\n|  Contributions R2 600 × 12 = R31 200  |    |  0,5\n|  Less 4 × s6A credit (R34 944): excess nil  |  0  |  1\n|  Qualifying medical expenses actually paid by 28 Feb 2025: R23 000  |  23 000  |  1\n|  Less 7,5% × taxable income R1 124 724 = R84 354  |  (84 354)  |  1\n|  Negative, so s6B credit = R0  |  0  |  0,5\nNormal tax liability  |  R360 656 − R17 235 − R8 736  |  334 685  |  1\nAvailable  |  28\nMaximum  |  25"}, {"id": "B", "marks": 9, "required": "Gino has been considering whether he should start up his own company, Gino's Consultancy (Pty) Ltd, and provide his services to Market-It through this company in order to minimize the amount of employee's tax he is paying.\nDiscuss whether the establishment of this company will in fact reduce his employee's tax.\n(8 marks + 1 communication mark: logic and expression)", "memo": "PART B: Would providing his services through Gino's Consultancy (Pty) Ltd reduce employees' tax?\nMarking Point / Principle  |  Marks\nPara 1 of the Fourth Schedule: a personal service provider (PSP) is a company where a connected person personally renders services to a client on behalf of the company.  |  1\nGino would be a shareholder (connected person) personally rendering the marketing services to Market-It.  |  1\nAt least one of these must also apply: Gino would have been an employee of the client if he rendered the services directly; OR  |  1\nthe duties are performed mainly at the client's premises and he is subject to the client's control or supervision; OR  |  1\nmore than 80% of the company's income is from one client (or its associated institutions).  |  1\nSince he would serve his existing employer Market-It, these conditions will be met.  |  0,5\nThe company is excluded only if it employs three or more full-time employees (not shareholders or connected persons) throughout the year; Gino's company will not meet this.  |  1\nA PSP is included in the definition of \"employee\" in para 1 of the Fourth Schedule.  |  0,5\nMarket-It must withhold employees' tax from amounts paid to the company at a flat 27%.  |  1\nSection 23K limits the deductions of a PSP (essentially remuneration to employees, legal costs, bad debts, premises/assets used wholly for trade).  |  1\nConclusion: setting up the company will not escape or reduce employees' tax; further tax (normal tax or dividends tax at 20%) arises when he extracts the profits.  |  1\nIt also adds compliance costs, so it will not achieve his objective.  |  0,5\nCommunication — logic and expression  |  1\nAvailable  |  11,5\nMaximum  |  9"}]}]}, {"id": "uhuru", "title": "Uhuru (Pty) Ltd — Employees' Tax Scenario", "short": "Uhuru", "marks": 37, "yoa": "2025", "unofficial": true, "memoNote": "Memo generated with NotebookLM from your Tax 2 notebook. It is not an official solution, so check anything that looks off.", "tables": "MONETARY CHANGES - 2025\nApplicable in respect of years of assessment commencing on or after 1 March 2024 (i.e.\n2025 year of assessment) – unless specifically stated otherwise\nREBATES (section 6)\nPrimary rebate increases from R16 425 to R17 235;\nSecondary rebate increases from R9 000 to R9 444;\nTertiary rebate increases from R2 997 to R3 145\nMEDICAL REBATES (section 6A)\nBenefits to the taxpayer: R364;\nBenefits to the taxpayer and one dependant: R728;\nBenefits to each additional dependant: R246\nRESIDENTIAL ACCOMMODATION (paragraph 9 of the Seventh Schedule)\nSymbol B of R91 250 increases to R95 750.\nRATES OF NORMAL TAX\n•  |  In respect of the taxable income (excluding any retirement fund lump sum\nbenefit, retirement fund lump sum withdrawal benefit or severance benefit) of natural\npersons, estates and special trusts\nTaxable Income (R)  |  Rate of Tax\n0 – 237 100  |  18% of taxable income\n237 101 – 370 500  |  42 678 + 26% of taxable income above 237 100\n370 501 – 512 800  |  77 362 + 31% of taxable income above 370 500\n512 801 – 673 000  |  121 475 + 36% of taxable income above 512 800\n673 001 – 857 900  |  179 147 + 39% of taxable income above 673 000\n857 901 – 1 817 000  |  251 258 + 41% of taxable income above 857 900\n1 817 001 and above  |  644 489 + 45% of taxable income above 1 817 000\n•  |  In respect of the taxable income of any company which qualifies as a small\nbusiness corporation as defined in section 12E of the Income Tax Act, in respect of\nany year of assessment ending any date between 1 April 2025 and 31 March 2026.\nTaxable Income (R)  |  Rate of Tax\n0 – 95 750  |  0% of taxable income\n95 751 – 365 000  |  7% of the amount above R95 750\n365 001 – 550 000  |  R18 848 + 21% of the amount above R365 000\n550 001 and above  |  R57 698 + 27% of the amount above R550 000\nTRAVEL ALLOWANCE\nWhere the value of the vehicle (R) -  |  Fixed  |  Fuel  |  Mainte\ncost  |  cost  |  nance\ncost\n(R p.a.)  |  (c/km  |  (c/km)\n)\ndoes not exceed R100 000  |  34 480  |  151.7  |  46.0\nexceeds R100 000 but does not exceed R200 000  |  61 770  |  169.4  |  57.6\nexceeds R200 000 but does not exceed R300 000  |  89 119  |  184.0  |  63.5\nexceeds R300 000 but does not exceed R400 000  |  113 436  |  197.9  |  69.3\nexceeds R400 000 but does not exceed R500 000  |  137 752  |  211.8  |  81.5\nexceeds R500 000 but does not exceed R600 000  |  163 178  |  243.0  |  95.6\nexceeds R600 000 but does not exceed R700 000  |  188 653  |  247.1  |  107.3\nexceeds R700 000 but does not exceed R800 000  |  215 447  |  251.2  |  118.9\nexceeds R800 000  |  215 447  |  251.2  |  118.9\nAlternative fixed rate for certain reimbursive travel allowances: 484 cents per kilometer\n(previously 464 cents)\nSUBSISTENCE ALLOWANCE\n• Local travel:\no  |  Allowance for incidental costs only – R169 (previously R161) for each day.\no  |  Allowance for meals and incidental costs – R548 (previously R522) for each day.\n• Overseas travel:\nActual accommodation plus a prescribed amount based on the relevant country (which\namount will be provided in the IAC if it differs from the amount listed in the Regulation in\nthe SAICA Student Handbook).\nTRANSFER DUTY (Section 2(1)(b) of the Transfer Duty Act)\nIn respect of acquisition of property on or after 1 March 2020:\nValue of property (R)  |  Rate\n0 – 1 100 000  |  0%\n1 100 001 – 1 512 500  |  3% of the value above R1 100 000\n1 512 501 – 2 117 500  |  R12 375 + 6% of the value above R1 512 500\n2 117 501 – 2 722 500  |  R48 675 + 8% of the value above R2 117 500\n2 722 501 – 12 100 000  |  R97 075 + 11% of the value above R2 722 500\n12 100 001 and above  |  R1 128 600 + 13% of the value above R12 100 000", "questions": [{"id": "Q1", "title": "Uhuru (Pty) Ltd / Nomveliso Zungu", "marks": 37, "scenario": "Uhuru  |  (37 MARKS, 56 MINUTES)\nUhuru (Pty) Ltd (‘Uhuru’) is a company resident in South Africa for income tax purposes and\na registered value-added tax (VAT) vendor. Uhuru is a South African law firm based in\nJohannesburg and Durban. The company’s financial year ends on 31 December.\nAll amounts are exclusive of VAT unless otherwise stated or shown by the context.\nNomveliso Zungu\nNomveliso Zungu (‘Nomveliso’) is a South African lawyer at Uhuru, aged 55 years old.\nNomveliso joined Uhuru on 1 March 2023 and has since 1 November 2024 been based at the\nDurban office of Uhuru.\nNomveliso holds a Masters in Law in Constitutional Law (LLM) from the University of Cape\nTown and has recently been appointed by Uhuru as its Business Leader on matters regarding\nsection 25 of the South African Constitution which deals with property rights.\nNomveliso’s remuneration package with Uhuru entitles her to the following benefits, which\nhave remained consistent from the 2024 year of assessment:\n• She receives a monthly salary of R230 000.\n• Uhuru contributes R5 000 per month towards the company’s pension fund on Nomveliso’s\nbehalf. Nomveliso makes no other contributions.\n• Uhuru makes medical aid contributions in respect of Nomveliso and her minor son, who\nis a dependant on her medical aid. During the year of assessment Uhuru made\ncontributions of R69 000 on behalf of Nomveliso and her son. Nomveliso incurred\nR90 000 of qualifying medical expenses that was not recovered from the medical aid\nscheme.\n• Uhuru pays for Nomveliso’s son’s school fees. Nomveliso’s son attends Hilton College, a\nhigh school in the Midlands in KwaZulu Natal. The school is registered in terms of the\nSouth African Schools Act 1996. The school fees are R20 000 per month.\n• Nomveliso receives a travel allowance of R6 000 per month. During the year of\nassessment, she travelled a total of 20 000km, 16 000km of which related to business\ntravel. She kept an accurate logbook for her travels in her BMW 1 series which cost her\nR327 000 (including VAT). The BMW 1 series was purchased in 2023 and the purchase\nprice included a 5-year maintenance plan. Nomveliso provided her logbook to her\nemployer on a monthly basis. The employer was satisfied based on the previous year that\nthe kms travelled each month were reflective of business travel and the km were travelled\nevenly over the period. During the year of assessment Nomveliso incurred fuel costs of\nR10 000 relating to the BMW 1 series.\n• Uhuru allows all employees to use the company gym in its building all year round. The\nmarket value of this benefit at an equivalent gym would have cost Nomveliso R699 per\nmonth. The construction costs of the gym incurred by Uhuru was R890 000.\nIn addition to the above, during the 2025 year of assessment Nomveliso received the following\nextra-ordinary benefits from Uhuru:\nOn 1 November 2024 Nomveliso was transferred from the Johannesburg offices of Uhuru to\nthe Durban offices. As a result, Uhuru incurred relocation costs of R90 000 (including VAT),\npaid to Stuttafords Van Liners (Pty) Ltd, for the transportation of Nomveliso’s household goods\nfrom Johannesburg to Durban. Nomveliso’s goods were transported by road.\nStuttafords Van Liners (Pty) Ltd invoiced Nomveliso for these costs but the amount was settled\nby Uhuru. Stuttafords Van Liners (Pty) Ltd is a resident in South Africa for income tax\npurposes and a registered value-added tax (VAT) vendor.\nNomveliso has also received the following additional income:\n• She holds a purchased annuity from the South African investment firm, Corporation Ltd,\nwhich she acquired for R200 000 in 2021. The annuity pays R3 000 per month for the next\n25 years.\n• From 1 February 2024 she received an annuity of R10 000 per month from her ex-husband\nfor the maintenance of their son.\nRestructuring of Nomveliso’s Remuneration Package\nUhuru noticed that Nomveliso’s car was experiencing many functional issues. In February\n2025 it offered her the choice of either using the company’s Toyota Corolla or of increasing\nher travel allowance received to R9 000 per month from 1 March 2025. The Toyota Corolla\nwas acquired by Uhuru on 1 March 2023 with no maintenance plan for R322 900 (including\nVAT). Nomveliso would be granted the use of the car from 1 March 2025 until 28 February\n2026. She is not sure which option is the most tax beneficial for her.\nIt would be expected that with the new Toyota Corolla she would travel 25 000km from 1 March\n2025 to 28 February 2026, 18 000km of which will relate to business travel. With the travel\nallowance she would continue to use her BMW 1 series and would travel the same distances\nas in the company car. It is expected that she will spend R12 000 on fuel for either vehicle,\nand that she will keep a record of her fuel expenditure.\nTakunda Bhezuzi\nOn 1 September 2024 Uhuru employed Takunda Bhezuzi (‘Takunda’), a lawyer from\nZimbabwe. Takunda is a legal expert on farming rights in Zimbabwe and was employed by\nUhuru to assist with various South African farming matters for the next nine months. Whilst\nTakunda was in South Africa, Uhuru paid the rental costs per month of a Westville property it\nleased, the rental value correctly calculated is R20 000. Takunda is not a South African\nresident and has never previously travelled to South Africa.\nAdditional Information:\n• Nomveliso Zungu’s remuneration proxy for the 2025 year of assessment is\nR2 750 000.", "parts": [{"id": "1.1", "marks": 16, "required": "Calculate, with reasons, the employees' tax that would have been withheld by Uhuru (Pty) Ltd from Nomveliso Zungu for the 2025 year of assessment.", "memo": "Required 1.1: Employees' tax withheld from Nomveliso Zungu (2025 year of assessment)\nItem  |  Reason/Working  |  Amount (R)  |  Mark\nBasic cash salary  |  Para (a) of \"remuneration\" (Fourth Schedule): R230 000 × 12  |  2 760 000  |  1\nPension fund contributions  |  Employer contribution: taxable benefit (para 2(l)/para 12D Seventh Schedule), included in remuneration. R5 000 × 12  |  60 000  |  1\n|  Deemed paid by the employee for s11F (s11F(4)).  |    |  0,5\nMedical scheme contributions  |  Employer contribution for her and her son: para 2(i)/para 12A, included in remuneration  |  69 000  |  1\nUnrecovered medical expenses  |  The employer may not take s6B into account for employees' tax unless the employee is 65+ or disabled (para 9(6) Fourth Schedule); Nomveliso is 55  |  0  |  1\nSon's school fees (Hilton College)  |  Payment of the employee's debt / free service: taxable benefit (para 2(h)).  |    |  0,5\n|  s10(1)(q) bursary exemption for a relative is not available: remuneration proxy R2 750 000 exceeds R600 000.  |    |  1\n|  R20 000 × 12  |  240 000  |  1\nTravel allowance  |  R6 000 × 12 = R72 000  |    |  0,5\n|  Para (cA) of remuneration: 80% included unless the employer is satisfied that at least 80% of use is for business, then 20%.  |    |  1\n|  16 000 / 20 000 km = 80% business, logbook checked monthly by employer.  |    |  0,5\n|  R72 000 × 20%  |  14 400  |  1\nCompany gym  |  Recreational facility at the employer's premises for employees in general: no value (para 10(2)(d))  |  0  |  1\nRelocation costs (Stuttafords Van Liners)  |  Transfer of the employee: transport of household goods paid by employer is exempt (s10(1)(nB))  |  0  |  1\nPurchased annuity and maintenance  |  Not paid by Uhuru; Uhuru does not withhold employees' tax on them  |  0  |  0,5\nRemuneration  |    |  3 143 400  |  0,5\nLess s11F  |  Lesser of R350 000, 27,5% of remuneration or actual contribution: R60 000  |  (60 000)  |  1\nBalance of remuneration  |    |  3 083 400  |  0,5\nTax per tables  |  R644 489 + 45% × (R3 083 400 − R1 817 000)  |  1 214 369  |  1\nPrimary rebate  |  Under 65  |  (17 235)  |  0,5\nMedical scheme fees tax credit s6A  |  (R364 + R364) × 12, taken into account by employer (para 9(6))  |  (8 736)  |  1\nEmployees' tax withheld for the year  |  R1 214 369 − R17 235 − R8 736  |  1 188 398  |  1\nAvailable  |  18\nMaximum  |  16"}, {"id": "1.2", "marks": 12, "required": "Advise Nomveliso Zungu which of the two options relating to the restructuring of her remuneration package would be the most tax beneficial to her in the 2026 year of assessment.\n• Assume that the tax legislation applicable to the 2025 year of assessment will remain unchanged for the 2026 year of assessment.\n• Assume that each option will be in effect from 1 March 2025 for the whole year of assessment.", "memo": "Required 1.2: Which restructuring option is more tax-beneficial in 2026\nMarking Point / Principle  |  Marks\nOPTION 1: right of use of the Toyota Corolla\nRight of use of a motor vehicle is a taxable benefit (para 2(b) Seventh Schedule).  |  0,5\nDetermined value: cost to employer incl. VAT R322 900.  |  0,5\nAcquired 1 March 2023, granted 1 March 2025: two completed 12-month periods before the right of use.  |  0,5\nReduced by 15% per completed year on the reducing balance: R322 900 × 0,85² = R233 295.  |  1\nNo maintenance plan, so 3,5% per month (para 7(4)).  |  1\nAnnual value: R233 295 × 3,5% × 12 = R97 984.  |  1\nPara 7(7) business reduction (logbook: 25 000 km total, 18 000 business): R97 984 × 18 000/25 000 = R70 548; private portion R27 436.  |  1\nPara 7(8) private fuel borne by employee: reduce further for private fuel (7 000 km); net taxable benefit roughly R14 556 to R24 076, taxed at 45%.  |  1\nOPTION 2: travel allowance increased to R9 000 per month\nAllowance R9 000 × 12 = R108 000 (s8(1)(b)).  |  0,5\nDeemed cost method; BMW cost R327 000: bracket R300 001 to R400 000.  |  0,5\nFixed cost: R113 436 / 25 000 km × 100 = 453,74 c/km.  |  1\nFuel cost 197,9 c/km (she bears fuel).  |  0,5\nMaintenance 0 c/km (vehicle has a maintenance plan).  |  1\nTotal 651,64 c/km.  |  0,5\nBusiness deduction: 18 000 km × R6,5164 = R117 295.  |  1\nLimited to the allowance received; net taxable inclusion R0.  |  1\nConclusion: Option 1 leaves a taxable benefit (at least R14 556, extra tax of about R6 550 at 45%); Option 2 gives a nil inclusion and R36 000 more cash a year. Advise Option 2.  |  1\nAvailable  |  13\nMaximum  |  12"}, {"id": "1.3", "marks": 5, "required": "Discuss the VAT consequences for Uhuru (Pty) Ltd:\n• On the amounts paid to Stuttafords Van Liners (Pty) Ltd relating to Nomveliso Zungu's move to Durban in November 2024; and\n• On the possible right of use of the Toyota Corolla granted to Nomveliso Zungu on 1 March 2025.", "memo": "Required 1.3: VAT consequences for Uhuru (Pty) Ltd\nMarking Point / Principle  |  Marks\nStuttafords Van Liners (R90 000 incl. VAT): transport of goods by road is a standard-rated supply (passenger transport is exempt, goods transport is not).  |  1\nThe relocation is incurred in the course of Uhuru's enterprise (moving an employee to the Durban office), s17(1).  |  0,5\nInput tax may only be claimed with a valid tax invoice issued to the vendor (s16(2) read with s20(4)).  |  1\nStuttafords invoiced Nomveliso personally, so Uhuru cannot claim input tax of R11 739 (R90 000 × 15/115) unless a tax invoice in Uhuru's name is obtained.  |  0,5\nToyota Corolla: granting the right of use to an employee is a deemed supply under s18(3).  |  0,5\nTime of supply: end of each month in which the benefit is included in remuneration.  |  0,5\nThe Corolla is a motor car as defined; input tax was denied on acquisition (s17(2)(c)).  |  0,5\nDeemed consideration: 0,3% per month of the determined value excl. VAT: R322 900 × 100/115 × 0,85² = R202 865; × 0,3% = R608,60 per month.  |  0,5\nOutput tax: R608,60 × 15/115 = R79,38 per month (R952,56 a year). Uhuru may deduct the output tax under s11(a).  |  0,5\nAvailable  |  5\nMaximum  |  5"}, {"id": "1.4", "marks": 4, "required": "Advise Takunda Bhezuzi on the South African normal tax consequences relating to the Westville property lease payments made by Uhuru (Pty) Ltd.", "memo": "Required 1.4: Normal tax consequences for Takunda Bhezuzi of the Westville lease payments\nMarking Point / Principle  |  Marks\nA non-resident is taxed only on amounts from a South African source; employment income is sourced where the services are rendered (originating cause: Lever Brothers).  |  1\nTakunda renders his services in South Africa, so the benefits are from a South African source.  |  0,5\nAccommodation leased by the employer is a taxable benefit: para (i) of gross income read with para 2(d) of the Seventh Schedule.  |  0,5\nRented from a third party: value is the lower of the formula and the cost to the employer (R20 000 per month), para 9(3C).  |  0,5\nPara 9(7A): accommodation provided to an expatriate employee away from home for work has no value for the first two years if he was not in South Africa for more than 90 days in the prior year.  |  1\nPara 9(7B): the no-value rule applies only up to R25 000 per month.  |  0,5\nThe rental of R20 000 per month is below R25 000, so the benefit has no value.  |  0,5\nConclusion: nothing is included in Takunda's South African taxable income for the Westville lease.  |  0,5\nAvailable  |  5\nMaximum  |  4"}]}]}, {"id": "stirology", "title": "Stirology (Pty) Ltd — Company Scenario", "short": "Stirology", "marks": 56, "yoa": "2025", "unofficial": true, "memoNote": "Memo generated with NotebookLM from your Tax 2 notebook. It is not an official solution, so check anything that looks off.", "tables": "MONETARY CHANGES - 2025\nApplicable in respect of years of assessment commencing on or after 1 March 2024 (i.e.\n2025 year of assessment) – unless specifically stated otherwise\nREBATES (section 6)\nPrimary rebate increases from R16 425 to R17 235;\nSecondary rebate increases from R9 000 to R9 444;\nTertiary rebate increases from R2 997 to R3 145\nMEDICAL REBATES (section 6A)\nBenefits to the taxpayer: R364;\nBenefits to the taxpayer and one dependant: R728;\nBenefits to each additional dependant: R246\nRESIDENTIAL ACCOMMODATION (paragraph 9 of the Seventh Schedule)\nSymbol B of R91 250 increases to R95 750.\nRATES OF NORMAL TAX\n•  |  In respect of the taxable income (excluding any retirement fund lump sum\nbenefit, retirement fund lump sum withdrawal benefit or severance benefit) of natural\npersons, estates and special trusts\nTaxable Income (R)  |  Rate of Tax\n0 – 237 100  |  18% of taxable income\n237 101 – 370 500  |  42 678 + 26% of taxable income above 237 100\n370 501 – 512 800  |  77 362 + 31% of taxable income above 370 500\n512 801 – 673 000  |  121 475 + 36% of taxable income above 512 800\n673 001 – 857 900  |  179 147 + 39% of taxable income above 673 000\n857 901 – 1 817 000  |  251 258 + 41% of taxable income above 857 900\n1 817 001 and above  |  644 489 + 45% of taxable income above 1 817 000\n•  |  In respect of the taxable income of any company which qualifies as a small\nbusiness corporation as defined in section 12E of the Income Tax Act, in respect of\nany year of assessment ending any date between 1 April 2025 and 31 March 2026.\nTaxable Income (R)  |  Rate of Tax\n0 – 95 750  |  0% of taxable income\n95 751 – 365 000  |  7% of the amount above R95 750\n365 001 – 550 000  |  R18 848 + 21% of the amount above R365 000\n550 001 and above  |  R57 698 + 27% of the amount above R550 000\nTRAVEL ALLOWANCE\nWhere the value of the vehicle (R) -  |  Fixed  |  Fuel  |  Mainte\ncost  |  cost  |  nance\ncost\n(R p.a.)  |  (c/km  |  (c/km)\n)\ndoes not exceed R100 000  |  34 480  |  151.7  |  46.0\nexceeds R100 000 but does not exceed R200 000  |  61 770  |  169.4  |  57.6\nexceeds R200 000 but does not exceed R300 000  |  89 119  |  184.0  |  63.5\nexceeds R300 000 but does not exceed R400 000  |  113 436  |  197.9  |  69.3\nexceeds R400 000 but does not exceed R500 000  |  137 752  |  211.8  |  81.5\nexceeds R500 000 but does not exceed R600 000  |  163 178  |  243.0  |  95.6\nexceeds R600 000 but does not exceed R700 000  |  188 653  |  247.1  |  107.3\nexceeds R700 000 but does not exceed R800 000  |  215 447  |  251.2  |  118.9\nexceeds R800 000  |  215 447  |  251.2  |  118.9\nAlternative fixed rate for certain reimbursive travel allowances: 484 cents per kilometer\n(previously 464 cents)\nSUBSISTENCE ALLOWANCE\n• Local travel:\no  |  Allowance for incidental costs only – R169 (previously R161) for each day.\no  |  Allowance for meals and incidental costs – R548 (previously R522) for each day.\n• Overseas travel:\nActual accommodation plus a prescribed amount based on the relevant country (which\namount will be provided in the IAC if it differs from the amount listed in the Regulation in\nthe SAICA Student Handbook).\nTRANSFER DUTY (Section 2(1)(b) of the Transfer Duty Act)\nIn respect of acquisition of property on or after 1 March 2020:\nValue of property (R)  |  Rate\n0 – 1 100 000  |  0%\n1 100 001 – 1 512 500  |  3% of the value above R1 100 000\n1 512 501 – 2 117 500  |  R12 375 + 6% of the value above R1 512 500\n2 117 501 – 2 722 500  |  R48 675 + 8% of the value above R2 117 500\n2 722 501 – 12 100 000  |  R97 075 + 11% of the value above R2 722 500\n12 100 001 and above  |  R1 128 600 + 13% of the value above R12 100 000", "questions": [{"id": "Q1", "title": "Stirology (Pty) Ltd (Jan 2022 supp Q1)", "marks": 56, "scenario": "QUESTION 1  |  (56 MARKS; 84 MINUTES)\nStirology (Pty) Ltd (‘Stirology’ or ‘the company’) is a family-owned South African company that offers\nhands-on, interactive, and fun cooking classes with a bit of a difference. Participants are put into\nteams, and each team member is given a portion of the meal to prepare. The menu is revealed and\nissued to participants on the day and is largely determined by the availability of fresh, locally\nproduced ingredients. Recipes, tools and guidance are also provided as needed but participants are\nalways encouraged to improvise. Once the meal has been cooked, all participants then gather around\nthe table to enjoy the meal they have prepared together.\nJade Quin and her parents, John and Jenny Quin are the trio that founded Stirology in October 2008.\nJade has remained very involved in the company’s operations since its incorporation; however, her\nparents have recently taken more of a backseat. On incorporation of the company, 10 000 equity\nshares were issued to Jade, John and Jenny for R5 each. There have been no transfers of these shares\nor issues of new shares since incorporation of the company. Jade does not hold any other equity\nshares. However, John and Jenny Quin have invested most of their pension in South African\ncompanies that are listed on the JSE.\nStirology has a 31 October financial year-end and is a registered category A VAT vendor. The company\nhas requested your assistance regarding various matters concerning its tax affairs in its current year of\nassessment.\nStirology had correctly calculated gross income of R4 500 000 and tax-deductible expenditure of\nR850 000 before taking into account the below information:\nAll amounts are inclusive of VAT where appropriate unless stated otherwise or shown by the\ncontext.\n1. Consumables\nIngredients that are used and consumed in cooking classes are recognized as consumables. A\nreview of Stirology's general ledger shows the following balances as it relates to consumables:\nAccount  |  R\nOpening Balance  |  4 200\nConsumables purchased  |  800 000\nClosing Balance  |  2 100\nThe following transaction has not been taken into account in the accounting records:\n• In order to limit Stirology’s waste, perishable ingredients are generally purchased as needed.\nFurther to this, Jade generally cleans the fridge on a weekly basis and identifies any perishable\ningredients that are not likely to be used in a cooking class before expiry. These ingredients\nare then donated to Food Secure, a registered public benefit organisation. Stirology donated\ningredients that had been purchased for a total cost of R13 000 (excluding VAT) in 2025 to\nthis organisation during the company’s 2025 financial year.\n2. Customer Settlement\nJade generally requires that all customers who book with Stirology, provide her with a complete list\nof all dietary requirements and allergies of all participants that are included in the booking. On receipt\nof this list, she generally adapts existing recipe’s and ingredients purchased to suit the customers’\nrequirements. Jade also makes sure to check the ingredient lists on the packaging of all items to be\nused and consumed by each group of participants to confirm that there are not traces of any specified\nallergens.\nOn 20 March 2025, Jade received an email from a Riley Boysen, a customer that had attended a\ncooking class earlier that week, to notify her that she had had a very bad allergic reaction that\nrequired her to seek medical attention, soon after attending class. While Riley was unsure of the\nexact dish or ingredient that had caused her allergic reaction, she was of the belief that she had\nconsumed some type of shellfish while at Stirology.\nAfter referring back to her emails, Jade was able to confirm that Riley had in fact specified this allergy\nwhen booking for the class, and although the menu issued to participants on the day that Jade\nattended the class did not seem to include any shellfish, on further investigation of the individual\ningredients, Jade noted that the green curry paste that was used and consumed by participants\ncontained traces of dried shrimp. Jade had unfortunately forgotten to check the ingredients listed on the\npackaging of all items used as Stirology happened to be short staffed on that particular day and Jade\nhad been rushing to get things ready in time for the class.\nAfter realizing that she had made such a careless error, Jade replied to Riley’s email with a sincere\napology on 24 March 2025. In her email, she also stated that Stirology had just paid an amount of\nR3 000 into Riley’s bank account to cover her medical costs. She also offered to allow Riley and ten\nfriends to attend a Stirology cooking class at a future date of their choosing, provided that the\nbooking is made within a period of 12 months. Riley graciously accepted Jades offer on the same day,\nbut had not made a booking to attend the class by 31 October 2025.\nCustomers are generally charged a fee of R500 per person when attending a Stirology class, however,\nthe actual costs incurred by Stirology in providing the class amounts to a mere R100 per person.\n3. Employee Benefits\nIn addition to Jade, Stirology employs four other full-time employees who are not connected persons to\neach other or the company. The company pays all of its employees a basic salary in addition to the\nadditional benefits outlined below:\n• The latest cooking class that is offered by Stirology begins at 6pm and is expected to end well\nbefore 10pm. However, on some occasions, participants take longer than expected to cook\nthe meal which can cause the event to run overtime. All Stirology employees that are on duty\nare then required to stay even later and clean up the premises after the event.\nIn these instances, employees that are reliant on public transport or lift clubs are generally\nunable to get home. As a result, the company pays for these employees to stay in backpacking\naccommodation1 in Cape Town when cooking classes run past 10pm. During the 2025 year of\nassessment, the company incurred accommodation costs of R2 500 (excluding VAT) each for\ntwo of its employees. Neither of these two employees have stayed in the backpacking\naccommodation for more than one night at a time.\n• Jona Lee, the company booking and operations manager, was awarded an iPad Pro as a long\nservice award on 31 October 2025. Jona has been employed in this position since Stirology\nwas first incorporated. The iPad was purchased new for R15 000 at a ‘Christmas in July Special’\non 31 July 2025. This was at a 10% discount to the usual selling price.\n4. Fixed Assets, Other Income and Expenditure\nThe company owns the following assets:\nBusiness Premises\nStirology operates from its business premises, a free-standing house located in Woodstock, Cape\nTown.\nIn June 2024, the company purchased this two-bedroom house for R1 800 000 when the market value\nthereof amounted to R1 500 000. The premises was purchased from Thabo Tinto, who had previously\n1 Backpacking accommodation is inexpensive board and lodging that often consists of small furnished dorm rooms with\n4-8 beds shared by unrelated parties.\nlived in the house as his primary residence. Payment of the purchase price was made in two equal\ninstallments on 1 September 2024 and 1 November 2024, respectively. The property was registered in\nthe deed’s office on 30 September 2024 and was brought into use immediately. Prior to this,\nStirology operated out of the kitchen and dining area of the Quin family home.\nStirology received a statement at the end of each month from the Cape Town Municipality detailing\nits monthly rates, water and electricity separately. The amount due is then paid immediately on\nreceipt of the monthly statement. During the company’s 2025 year of assessment, R30 000 (excluding\nVAT) was paid to the municipality in settlement of these monthly statements, 50% of which were\nattributable to the property rates.\nCooking Equipment\nPrior to the move to the new business premises, the company did not own its own cooking equipment\nand merely used what was available in the Quin family home. On 1 October 2024, a small business\nloan amounting to R100 000 was taken out to cover the costs of equipping the new premises with\nthe necessary cooking equipment and utensils, some of which have been outlined below (e.g. The Ice\nCream Machine). The loan attracted interest at a rate of 7% per annum. No capital repayments had\nbeen made in respect of this loan by the end of the 2025 year of assessment, while all interest\npayments had been made on a monthly basis as and when due.\nR20 000 of the loan amount had not been used by 31 March 2025. This excess amount was used to\npurchase more equity shares in Orange Inc, a company resident in the United States of America, after\nwhich, Stirology held 0.5% of the equity shares in the company. The company received dividends\namounting to a rand equivalent of R588 000 into its bank account, after dividends withholdings tax\nwas withheld at a rate of 30% in the USA.\nIce Cream Machine\nOn 15 October 2024, the company imported a new SnoMaster ice cream machine from a UK supplier\nand non-VAT vendor for a rand equivalent purchase price of R8 200. The machine arrived in Cape\nTown on 30 October 2024. Import duties of R600 were paid by Stirology, as well as VAT, and the\nmachine was released by SARS customs and excise on 20 November 2024.\nImmediately after the machine had been delivered, Jade attended a short online training session that\nwas offered by the UK supplier at an additional cost of R500. The machine was brought into use\nimmediately thereafter on 30 November 2024.\nPortable Pizza Oven\nMr Quin donated a portable Pizza oven to Stirology on 1 October 2025. He had initially purchased\nthe pizza oven new for an amount of R5 500 (which was equivalent to its market value) in June\n2024 for home use but had not yet taken it out of the packaging. The pizza oven had a market value\nof R5 000 on the date of donation.\nAdditional Information\n• Interpretation Note 47, read together with BGR 7, allows for a five-year write off period for\nall qualifying assets.\n• SARS does not consider Stirology (Pty) Ltd to be carrying on a process of manufacture.\n• Stirology (Pty) Ltd wishes to minimize its taxation position by taking advantage of any and all\nelective taxation provisions in any relevant Acts.", "parts": [{"id": "1.1", "marks": 9, "required": "Discuss whether Stirology (Pty) Ltd meets the requirements to be considered a 'small business corporation' as defined in the Income Tax Act (Act 58 of 1962).\n(8 marks + 1 communication mark: logical argument)\n\nIn answering the following questions, you may assume that Stirology (Pty) Ltd is and has always been a small business corporation.", "memo": "Required 1.1: Small business corporation status (s12E)\nMarking Point / Principle  |  Marks\nSection 12E(4)(a): all the requirements must be met throughout the year of assessment.\nShareholders: all shareholders must be natural persons throughout the year. Jade, John and Jenny Quin are natural persons holding all the shares.  |  1\nNo shareholder may hold shares in any other company during the year (s12E(4)(a)(ii)).  |  1\nJade holds no other shares.  |  0,5\nJohn and Jenny hold shares in JSE-listed companies, which is a specific exclusion (s12E(4)(a)(ii)(aa)), so this requirement is met.  |  1\nGross income may not exceed R20 million.  |  1\nGross income of R4 500 000 plus foreign dividends (R840 000 gross) is well below R20 million.  |  0,5\nNot more than 20% of receipts and accruals (other than capital) and capital gains may consist of investment income and income from personal services.  |  1\nInvestment income (gross dividends R840 000) / total receipts (R4 500 000 + R840 000 = R5 340 000) = 15,73%, below 20%.  |  1\nThe company must not be a personal service provider; it employs four full-time unconnected employees in its cooking class business.  |  1\nConclusion: Stirology qualifies as a small business corporation.  |  1\nCommunication — logical argument  |  1\nAvailable  |  10\nMaximum  |  9"}, {"id": "1.2", "marks": 12, "required": "Discuss, with reference to case law and the Income Tax Act (Act 58 of 1962), whether the customer settlement outlined in Note 2 may be claimed as a deduction by Stirology (Pty) Ltd.\n(11 marks + 1 communication mark: logical argument)", "memo": "Required 1.2: Deductibility of the customer settlement (Note 2)\nMarking Point / Principle  |  Marks\ns11(a) read with s23(g): expenditure and losses, actually incurred, in the year of assessment, in the production of income, not of a capital nature, for purposes of trade.  |  1\nA. Cash settlement of R3 000\nActually incurred: paid into Riley's account on 24 March 2025, an unconditional liability in the year (Edgars Stores).  |  1\nProduction of income: expenditure closely connected to the income-earning operations (Port Elizabeth Electric Tramway).  |  1\nJoffe & Co: compensation for negligence is deductible if the risk is an inevitable concomitant of the trade.  |  1\nMissing an allergen when preparing food for paying participants is an inherent risk of running cooking classes.  |  1\nPaid to settle the claim, avoid litigation and protect the business's goodwill and reputation (Pick 'n Pay Wholesalers).  |  1\nNot capital: an ongoing operating cost that creates no enduring asset (New State Areas). Revenue in nature.  |  1\nLaid out for purposes of trade (s23(g)).  |  0,5\nConclusion: R3 000 deductible under s11(a).  |  0,5\nB. Free class for Riley and ten friends\nExpenditure is only actually incurred when there is an unconditional liability (Edgars Stores; Golden Dumps).  |  1\nRiley had not booked by 31 October 2025.  |  0,5\nNo costs (R100 per person) have been incurred; the obligation is contingent on a booking. /* --- direct (bring-your-own-key) calls --- */
async function pickGeminiModel(key){
  const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200", { headers: { "x-goog-api-key": key } });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw { code: r.status === 400 || r.status === 401 || r.status === 403 ? "bad_key" : "upstream_error", message: d?.error?.message };
  const names = (d.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
    .map(m => m.name.replace(/^models\//, ""))
    .filter(n => /^gemini-[\d.]+-flash$/.test(n) || /^gemini-flash-latest$/.test(n));
  const ver = n => parseFloat((n.match(/gemini-([\d.]+)/) || [])[1] || "0");
  names.sort((a, b) => ver(b) - ver(a));
  if (!names.length) throw { code: "upstream_error", message: "No Gemini Flash model is available to this key." };
  // Some listed models hang or are overloaded for a given key: ping the newest few and use the newest that answers.
  const ping = m => { const c = new AbortController(); const tm = setTimeout(() => c.abort(), 12000);
    return fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`, { method: "POST", signal: c.signal,
      headers: { "Content-Type": "application/json", "x-goog-api-key": key },
      body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: "Reply OK" }] }] }) })
      .then(r => r.ok).catch(() => false).finally(() => clearTimeout(tm)); };
  const cand = names.slice(0, 5), okv = await Promise.all(cand.map(ping));
  const m = cand.find((x, i) => okv[i]);
  if (!m) throw { code: "upstream_error", message: "Gemini didn't answer on any model just now (busy). Try again in a minute." };
  return m;
}
async function byokCall(turns, { json = false, signal } = {}){
  const b = byok;
  if (b.provider === "claude") {
    const sys = json ? "Reply with a single valid JSON object and nothing else." : undefined;
    const r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", signal,
      headers: { "content-type": "application/json", "x-api-key": b.key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: b.model || "claude-sonnet-5-5", max_tokens: 8000, ...(sys ? { system: sys } : {}),
        messages: turns.map(x => ({ role: x.role === "assistant" ? "assistant" : "user", content: String(x.content) })) }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw { code: r.status === 401 || r.status === 403 ? "bad_key" : r.status === 429 ? "rate_limited" : "upstream_error", message: d?.error?.message };
    return (d.content || []).filter(c => c.type === "text").map(c => c.text).join("");
  }
  if (!b.model) { b.model = await pickGeminiModel(b.key); setByok(b); }
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(b.model)}:generateContent`, { method: "POST", signal,
    headers: { "Content-Type": "application/json", "x-goog-api-key": b.key },
    body: JSON.stringify({ contents: turns.map(x => ({ role: x.role === "assistant" ? "model" : "user", parts: [{ text: String(x.content) }] })),
      generationConfig: { temperature: json ? 0.2 : 0.4, ...(json ? { responseMimeType: "application/json" } : {}) } }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw { code: r.status === 400 && /api key/i.test(d?.error?.message || "") || r.status === 401 || r.status === 403 ? "bad_key" : r.status === 429 ? "rate_limited" : "upstream_error", message: d?.error?.message };
  const text = (d?.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("");
  if (!text) throw { code: "upstream_error", message: "The model returned no text." };
  return text;
}
function parseJSON(text){

}

/* ---------- document renderer (rows with "  |  " become tables) ---------- */
const NUM = /^[-–(]?\s*R?\s*[\d][\d\s.,]*\)?\s*%?$/;
function renderDoc(text){
  const lines = String(text).split("\n");
  let html = "", rows = [];
  const flush = () => {
    if (!rows.length) return;
    const n = Math.max(...rows.map(r => r.length));
    html += '<div class="tablewrap"><table>' + rows.map(r => "<tr>" + r.map((c, i) => {
      const span = (i === r.length - 1 && r.length < n) ? ` colspan="${n - r.length + 1}"` : "";
      return `<td${span}${NUM.test(c.trim()) && c.trim() ? ' class="num"' : ""}>${esc(c)}</td>`;
    }).join("") + "</tr>").join("") + "</table></div>";
    rows = [];
  };
  for (const raw of lines){
    let l = raw.trimEnd();
    if (/^(QUESTION \d|STACKED)/.test(l)) l = l.split("  |  ").join(" ");
    if (l.includes("  |  ")) { rows.push(l.split("  |  ").map(s => s.trim())); continue; }
    flush();
    if (!l.trim()) { html += '<div class="gap"></div>'; continue; }
    const head = /^(QUESTION|Question|Part [AB]|REQUIRED|Notes?$|Additional [Ii]nformation|[A-Z][A-Za-z &'’\-]{2,40}$)/.test(l.trim()) && l.trim().length < 60 && !/[.,;]$/.test(l.trim());
    html += `<p${head ? ' class="head"' : ""}>${esc(l)}</p>`;
  }
  flush();
  return html;
}

function route(){
  const id = location.hash.slice(1);

  if (!paper){ view.paper = null; renderHome(); return; }
  if (view.paper !== paper){
    view.paper = paper; view.tab = "scenario";
    // resume at first part without an attempt
    let found = false;
    paper.questions.forEach((q, qi) => q.parts.forEach((pt, pi) => {
      if (!found && !st(paper, pt).attempts.length){ view.q = qi; view.p = pi; found = true; }
    }));
    if (!found){ view.q = 0; view.p = 0; }
  }
  renderExam();
}

  app.classList.toggle("noleft", !prefs.showPaper);
  app.style.setProperty("--leftw", prefs.leftw + "%");
  const tm = $("#timer"); if (tm) tm.hidden = !prefs.timer;
}
function wireSplit(){
  const sp = $("#split"); if (!sp) return;
  sp.onpointerdown = e => {
    sp.setPointerCapture(e.pointerId); sp.classList.add("drag");
    const box = $("#app").getBoundingClientRect();
    sp.onpointermove = ev => { prefs.leftw = Math.min(75, Math.max(20, (ev.clientX - box.left) / box.width * 100)); $("#app").style.setProperty("--leftw", prefs.leftw + "%"); };
    sp.onpointerup = () => { sp.onpointermove = null; sp.classList.remove("drag"); save(); };
  };
  sp.onkeydown = e => { if (e.key === "ArrowLeft" || e.key === "ArrowRight"){ prefs.leftw = Math.min(75, Math.max(20, prefs.leftw + (e.key === "ArrowLeft" ? -5 : 5))); save(); applyLayout(); } };
}

function paperProgress(paper){
  let got = 0, done = 0, n = 0;
  for (const q of paper.questions) for (const pt of q.parts){ n++; const b = best(paper, pt); if (b !== null){ done++; got += b; } }
  return {got, done, n};
}

function renderHome(){
  $("#homeBtn").hidden = true; $("#crumb").textContent = "ACC3004W past papers"; applyLayout();
  $("#app").className = "";
  $("#app").innerHTML = `<div class="home">
    <div class="intro">
      <p>Pick a paper. You get <strong>one required at a time</strong>, with the full scenario beside it. Type your answer the way you would in the exam script, then submit it. The examiner marks it against the official memo, shows <strong>where you lost marks and why</strong>, and tells you which section to revise. You can then fix your answer and resubmit, or ask follow-up questions about the feedback.</p>
      <p>Your answers and scores are saved in this browser.</p>
    </div>
    <div class="cards">${PAPERS.map(p => {
      const pr = paperProgress(p);
      return `<button class="card" data-id="${p.id}">
        <div class="status-line"><span>${esc(p.marks)} marks · ${Math.round(p.marks*MIN_PER_MARK)} min</span><span>${pr.done}/${pr.n} answered</span></div>
        <h2>${esc(p.title)}</h2>
        <ul>${p.questions.map(q => `<li>${esc(q.title)} (${q.marks})</li>`).join("")}</ul>
        <div class="meter" aria-hidden="true"><i style="width:${(pr.got/p.marks*100).toFixed(1)}%"></i></div>
        <div class="status-line"><span>Best marks so far</span><span class="mono">${fmt(pr.got)} / ${p.marks}</span></div>
      </button>`;}).join("")}</div>
  </div>`;
  document.querySelectorAll(".card").forEach(c => c.onclick = () => go(c.dataset.id));
}

function fmt(n){ return (Math.round(n*10)/10).toString().replace(/\.0$/, ""); }
function cur(){ const q = view.paper.questions[view.q]; return {q, pt: q.parts[view.p]}; }

function renderExam(){
  const paper = view.paper;
  $("#homeBtn").hidden = false; $("#crumb").textContent = paper.title;
  $("#app").className = "exam";
  $("#app").innerHTML = `<section class="pane left" id="left" aria-label="Question paper"></section><div class="split" id="split" role="separator" aria-orientation="vertical" aria-label="Resize scenario panel" tabindex="0"></div><section class="pane right" id="right" aria-label="Answer"></section>`;
  renderLeft(); renderRight(); applyLayout(); wireSplit();
}

function renderLeft(){
  const paper = view.paper, {q, pt} = cur();
  const s = st(paper, pt);
  const memoOpen = s.attempts.length > 0 || s.memoUnlocked;
  const tabs = [["scenario","Scenario"],["tables","Tax tables"],["memo","Memo " + pt.id]];
  let body = "";
  if (view.tab === "scenario") body = `<div class="qtitle">${esc(q.title)} · ${q.marks} marks</div>` + renderDoc(q.scenario);
  else if (view.tab === "tables") body = renderDoc(paper.tables);
  else body = memoOpen
    ? `<p class="hint">${esc(paper.memoNote)}</p>` + renderDoc(pt.memo)
    : `<div class="locked"><p>The memo for ${esc(pt.id)} opens after your first attempt, so you aren't tempted to peek.</p><button class="btn small" id="peek">Open it anyway</button></div>`;
  $("#left").innerHTML = `<div class="tabs" role="tablist">${tabs.map(([k,l]) => `<button class="tab" role="tab" aria-selected="${view.tab===k}" data-k="${k}">${l}</button>`).join("")}</div><div class="doc">${body}</div>`;
  document.querySelectorAll(".tab").forEach(t => t.onclick = () => { view.tab = t.dataset.k; renderLeft(); });
  const pk = $("#peek"); if (pk) pk.onclick = () => { s.memoUnlocked = true; save(); renderLeft(); };
}

let timerInt = null, timerStart = null;
function renderRight(){
  const paper = view.paper; if (!paper || !$("#right")) return;
  const {q, pt} = cur(); const s = st(paper, pt);
  const all = []; paper.questions.forEach((qq, qi) => qq.parts.forEach((pp, pi) => all.push({qi, pi, pp})));
  const idx = all.findIndex(x => x.qi === view.q && x.pi === view.p);
  const mins = Math.round(pt.marks * MIN_PER_MARK);
  const last = s.attempts[s.attempts.length - 1];

  $("#right").innerHTML = `
    <nav class="partnav" aria-label="Requireds">${all.map(x => {
      const b = best(paper, x.pp); const cls = (x.qi===view.q && x.pi===view.p) ? "cur" : b===null ? "" : band(b, x.pp.marks);
      return `<button class="chip ${cls}" data-qi="${x.qi}" data-pi="${x.pi}" title="${b===null ? "Not attempted" : "Best: " + fmt(b) + "/" + x.pp.marks}">${esc(x.pp.id)}</button>`;}).join("")}</nav>
    <div class="qhead"><h2>Required ${esc(pt.id)}</h2><span class="marks">${pt.marks} marks · ${mins} min</span></div>
    <div class="required">${esc(pt.required)}</div>
    <label for="answer" class="hint">Your answer. Set calculations out like the exam: <span class="mono">Item | Reason/working | Amount</span>, one line each.</label>
    ${prefs.markLayout ? "" : `<div class="hint" style="margin-bottom:6px">Content-only marking: write it any way you like (lines, bullets, shorthand). Layout isn't marked.</div>`}
    <textarea id="answer" spellcheck="true" placeholder="Start writing…">${esc(s.answer)}</textarea>
    <div class="row">
      <button class="btn primary" id="submit">${s.attempts.length ? "Re-mark my revised answer" : "Submit for marking"}</button>
      <button class="btn" id="prev" ${idx<=0?"disabled":""}>← Previous</button>
      <button class="btn" id="next" ${idx>=all.length-1?"disabled":""}>Next required →</button>
      <span class="spacer" style="flex:1"></span>
      <span class="timer" id="timer" ${prefs.timer ? "" : "hidden"}></span>
    </div>
    ${s.attempts.length > 1 ? `<div class="history">Attempts: ${s.attempts.map((a,i) => `#${i+1} ${fmt(a.score)}/${pt.marks}`).join(" · ")}</div>` : ""}
    <div id="fbSlot">${last ? renderFeedback(last, pt) : ""}</div>
    ${sampleReady && !canMark() ? `<div class="notice">Automatic marking isn't set up in this browser. <button class="btn small" id="keyBtn2">Add your own AI key</button> (free Gemini key) or submit and self-mark against the memo.</div>` : ""}
    ${backend() === "byok" || backend() === "api" ? `<div class="hint">${markerLabel()} <button class="btn small" id="keyBtn2">${byok ? "Change" : "Use my own"} key</button>${backend() === "api" && api.codeRequired ? ` <button class="btn small" id="codeBtn">${getCode() ? "Change" : "Enter"} access code</button>` : ""}</div>` : ""}
  `;
  const ta = $("#answer");
  ta.oninput = () => { s.answer = ta.value; save(); if (prefs.timer) startTimer(mins); };
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => { view.q = +c.dataset.qi; view.p = +c.dataset.pi; view.tab = "scenario"; resetTimer(); renderLeft(); renderRight(); $("#right").scrollTop = 0; });
  $("#prev").onclick = () => move(idx - 1, all);
  $("#next").onclick = () => move(idx + 1, all);
  $("#submit").onclick = () => submit();
  wireFeedback();
  const cb = $("#codeBtn"); if (cb) cb.onclick = askCode;
  const kb = $("#keyBtn2"); if (kb) kb.onclick = openKeyDlg;
  tickTimer(mins);
}
function move(i, all){ const x = all[i]; if (!x) return; view.q = x.qi; view.p = x.pi; view.tab = "scenario"; resetTimer(); renderLeft(); renderRight(); $("#right").scrollTop = 0; $("#left").scrollTop = 0; }
function startTimer(mins){ if (timerStart) return; timerStart = Date.now(); timerInt = setInterval(() => tickTimer(mins), 1000); }
function resetTimer(){ clearInterval(timerInt); timerInt = null; timerStart = null; }
function tickTimer(mins){
  const el = $("#timer"); if (!el || !prefs.timer) return;
  if (!timerStart){ el.textContent = "Timer starts when you type"; el.classList.remove("over"); return; }
  const sec = Math.floor((Date.now() - timerStart)/1000);
  el.textContent = `${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")} of ${mins}:00`;
  el.classList.toggle("over", sec > mins*60);
}

function renderFeedback(a, pt){
  if (a.self) return `<div class="fb"><div class="score"><span class="big">${fmt(a.score)}<small> / ${pt.marks}</small></span><span class="pill ${band(a.score, pt.marks)}">Self-marked</span></div></div>`;
  const f = a.feedback || {};
  const L = x => Array.isArray(x) ? x : [];
  return `<div class="fb">
    <div class="score"><span class="big">${fmt(a.score)}<small> / ${pt.marks}</small></span>
      <span class="pill ${band(a.score, pt.marks)}">${a.score/pt.marks >= .75 ? "Strong" : a.score/pt.marks >= .5 ? "Pass, with gaps" : "Below pass"}</span></div>
    ${f.overall ? `<div>${esc(f.overall)}</div>` : ""}
    ${L(f.errors).length ? `<div><h3>Where you went wrong</h3><div class="list">${L(f.errors).map(e => `<div class="err"><div><b>✗</b> ${esc(e.what)}</div><div class="fix">${esc(e.fix)}</div>${e.why ? `<div class="why">${esc(e.why)}</div>` : ""}</div>`).join("")}</div></div>` : ""}
    ${L(f.missed).length ? `<div><h3>Marks you left on the table</h3><div class="list">${L(f.missed).map(m => `<div class="miss"><span class="m">${esc(fmt(+m.marks || 0))}</span><span>${esc(m.point)}</span></div>`).join("")}</div></div>` : ""}
    ${L(f.revise).length ? `<div><h3>Revise this</h3><div class="revise">${L(f.revise).map(r => `<span>${esc(r)}</span>`).join("")}</div></div>` : ""}
    ${L(f.correct).length ? `<details><summary><h3 style="display:inline">What earned marks (${L(f.correct).length})</h3></summary><div class="list" style="margin-top:8px">${L(f.correct).map(c => `<div class="ok">${esc(c)}</div>`).join("")}</div></details>` : ""}
    ${f.examTip ? `<div class="tip"><strong>Exam technique:</strong> ${esc(f.examTip)}</div>` : ""}
    <div class="row"><button class="btn" id="toMemo">Open the memo</button><button class="btn pen" id="askBtn">Ask the examiner about this</button></div>
    <div class="chat" id="chat" hidden></div>
  </div>`;
}

function wireFeedback(){
  const tm = $("#toMemo"); if (tm) tm.onclick = () => { view.tab = "memo"; prefs.showPaper = true; save(); applyLayout(); renderLeft(); };
  const ab = $("#askBtn"); if (ab) ab.onclick = () => openChat();
}

/* ---------- marking ---------- */
function markingPrompt(paper, q, pt, answer){
  return `You are an experienced examiner marking a UCT ACC3004W Taxation II (South African tax) exam script. Mark the student's answer to ONE required against the suggested solution, the way a real UCT marker would, then give feedback that teaches.

MARKING RULES
- Total for this required: ${pt.marks} marks. Never award more than ${pt.marks}.
- Where the memo shows mark allocations (numbers like "| 1" or "0,5" at the end of a line, and "Available"/"Maximum"/"Limited" totals), follow them. "Available" can exceed the maximum: the student can reach the maximum without hitting every point.
- Where the memo shows no allocations, award about 1 mark per distinct correct point (a correct amount with its reason/section, or a correct conclusion with its reason), ½ for partly correct workings, and scale so the available marks are a little above ${pt.marks}, like UCT memos.
- Award marks for valid alternative treatments and reasonable stated assumptions, even if the memo took another route.
- Apply carry-forward (method) marks: if the student used an earlier wrong figure correctly later on, give the later mark and penalise the error only once.
- No marks for vague statements, a section number with no application to the facts, or a correct number with no reason when the required says "with reasons".
${prefs.markLayout ? `- Communication/critical thinking marks (X1, Y1, etc.) are awarded only if the answer is well structured and argued as the required asks (e.g. memo format, a table layout).` : `- CONTENT-ONLY MARKING (the student chose this): mark only the tax substance: the correct treatment, amounts, workings, sections and the reason for each item, and conclusions. Accept ANY format: plain lines, bullet points, shorthand, abbreviations, no tables, no columns, no headings, no letter/memo/report format. A short reason in any form counts as the reason. Never deduct for layout, presentation, structure or format, even if the required asks for a specific layout.\n- Award communication/critical thinking/presentation marks (X1, Y1, etc.) in full automatically, as long as the answer makes a genuine attempt at the content.\n- Do not mention layout, format or presentation anywhere in the feedback or the exam tip.`}
- This memo is a suggested solution${paper.unofficial ? " from an unofficial source and may contain errors" : ""}. If the memo is clearly wrong in law or arithmetic, mark according to the correct law and say so in your feedback.
- Be strict but fair. Half marks are allowed.

FEEDBACK RULES
- "errors": things the student did that are WRONG. Quote or paraphrase what they did, give the correct treatment with the correct figure, and say why (section/paragraph of the Income Tax Act, VAT Act, Estate Duty Act or Seventh/Eighth Schedule).
- "missed": memo points the student did not address, each with the marks it carried.
- "correct": short list of points that earned marks.
- "revise": 2–5 specific topics to revise from their notes, phrased like "Seventh Schedule para 7(7)/(8): not applied for employees' tax".
- "examTip": one practical exam-technique tip based on this script.
- If the answer is blank or irrelevant, score 0 and explain what the required wanted.
- Plain language, South African tax terminology, Rands written like R12 345.

=== ${paper.title} — ${q.title} ===
SCENARIO:
${q.scenario}

TAX TABLES PROVIDED IN THE EXAM:
${paper.tables}

REQUIRED ${pt.id} (${pt.marks} marks):
${pt.required}

SUGGESTED SOLUTION (memo) FOR ${pt.id}:
${pt.memo}

STUDENT'S ANSWER:
<<<
${answer}
>>>

Reply with only one JSON object in exactly this shape:
{"score": number, "overall": "2-3 sentence verdict", "errors": [{"what": "...", "fix": "...", "why": "..."}], "missed": [{"point": "...", "marks": number}], "correct": ["..."], "revise": ["..."], "examTip": "..."}`;
}

let markCtl = null;
async function submit(){
  const paper = view.paper, {q, pt} = cur(), s = st(paper, pt);
  const answer = $("#answer").value.trim();
  s.answer = $("#answer").value; save();
  if (!answer){ $("#fbSlot").innerHTML = `<div class="notice">Write an answer first. Even a partial attempt gets useful feedback.</div>`; return; }
  if (!canMark()){ selfMark(paper, pt, s); return; }
  if (backend() === "api" && api.codeRequired && !getCode()){ askCode(); return; }
  const btn = $("#submit"); btn.disabled = true;
  const t0 = Date.now();
  $("#fbSlot").innerHTML = `<div class="fb"><div class="busy"><span class="dot"></span><span id="busyTxt">Marking against the memo… this usually takes 30–90 seconds.</span></div><div class="row"><button class="btn small" id="stop">Stop</button></div></div>`;
  const iv = setInterval(() => { const el = $("#busyTxt"); if (el) el.textContent = `Marking against the memo… ${Math.floor((Date.now()-t0)/1000)}s`; }, 1000);
  markCtl = new AbortController();
  $("#stop").onclick = () => markCtl.abort();
  try {
    const f = await markJSON(markingPrompt(paper, q, pt, answer), markCtl.signal);
    let score = Math.max(0, Math.min(pt.marks, Number(f?.score) || 0));
    score = Math.round(score * 2) / 2;
    s.attempts.push({ score, feedback: f, answer, at: Date.now() });
    s.memoUnlocked = true; save();
    renderRight(); renderLeft();
    $("#fbSlot")?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"});
  } catch (e) {
    const msg = {
      cancelled: "Marking stopped.",
      not_granted: "Claude wasn't allowed to mark on this page. You can still self-mark against the memo.",
      rate_limited: "You've hit a usage limit. Wait a bit, then press Submit again.",
      invalid_json: "The marker's reply came back garbled. Press Submit again.",
      prompt_too_large: "The answer is too long to send. Trim it and try again.",
      access_code: "That access code was wrong. Enter it again, then press Submit.",
      bad_key: "Your AI key was rejected. Open AI key (top right) and check it.",
    }[e?.code] || `Marking failed${e?.message ? ": " + e.message : " (connection or service problem)"}. Press Submit to try again.`;
    $("#fbSlot").innerHTML = `<div class="notice">${esc(msg)}</div>`;
    if (e?.name === "AbortError") $("#fbSlot").innerHTML = `<div class="notice">Marking stopped.</div>`;
    if (e?.code === "not_granted"){ sample = null; }
    if (e?.code === "access_code"){ setCode(""); askCode(); }
  } finally { clearInterval(iv); const b = $("#submit"); if (b) b.disabled = false; }
}

function askCode(){
  const slot = $("#fbSlot");
  slot.innerHTML = `<div class="fb"><div>This site's marking is protected by an access code (the ACCESS_CODE you set in Vercel).</div>
    <div class="selfmark"><label for="codeIn">Access code</label><input id="codeIn" type="password" style="width:180px" value=""><button class="btn small primary" id="codeSave">Save</button></div></div>`;
  $("#codeSave").onclick = () => { setCode($("#codeIn").value.trim()); renderRight(); };
}

function selfMark(paper, pt, s){
  s.memoUnlocked = true; prefs.showPaper = true; save(); applyLayout(); view.tab = "memo"; renderLeft();
  $("#fbSlot").innerHTML = `<div class="fb"><div>Compare your answer with the memo on the left, then record your mark.</div>
    <div class="selfmark"><label for="selfScore">My mark</label><input id="selfScore" type="number" min="0" max="${pt.marks}" step="0.5"><span>/ ${pt.marks}</span><button class="btn small primary" id="saveSelf">Save</button></div></div>`;
  $("#saveSelf").onclick = () => {
    const v = Math.max(0, Math.min(pt.marks, +$("#selfScore").value || 0));
    s.attempts.push({score: v, self: true, answer: s.answer, at: Date.now()}); save(); renderRight();
  };
}

/* ---------- follow-up chat ---------- */
const chats = {};
function openChat(){
  const paper = view.paper, {q, pt} = cur(), s = st(paper, pt), a = s.attempts[s.attempts.length-1];
  const k = pkey(paper, pt);
  const ch = chats[k] || (chats[k] = []);
  const box = $("#chat"); box.hidden = false;
  const draw = () => {
    box.innerHTML = ch.map(m => `<div class="msg ${m.role === "user" ? "u" : "a"}">${esc(m.content)}</div>`).join("") +
      `<label class="hint" for="askIn">Ask about your mark, a section, or why the memo treats something a certain way.</label>
       <textarea id="askIn" placeholder="e.g. Why is para 7(7) not applied for employees' tax?"></textarea>
       <div class="row"><button class="btn primary small" id="askSend">Ask</button></div>`;
    $("#askSend").onclick = send;
  };
  const rules = `You are the UCT ACC3004W Taxation II examiner who just marked this student's answer. Answer their follow-up questions about the marking and the tax law involved: concise, specific to this scenario, cite the relevant section/paragraph, and use worked figures where helpful. If they argue for a mark, judge it fairly against the memo and law.

SCENARIO:\n${q.scenario}\n\nREQUIRED ${pt.id} (${pt.marks} marks):\n${pt.required}\n\nMEMO:\n${pt.memo}\n\nSTUDENT'S ANSWER:\n${a?.answer || s.answer}\n\nYOUR MARKING (score ${a?.score}/${pt.marks}):\n${JSON.stringify(a?.feedback || {})}`;
  async function send(){
    const t = $("#askIn").value.trim(); if (!t || !canMark()) return;
    ch.push({role:"user", content:t}); draw();
    const bubble = document.createElement("div"); bubble.className = "msg a"; bubble.textContent = "Thinking…";
    box.insertBefore(bubble, $("label.hint", box));
    $("#askSend").disabled = true;
    try {
      const turns = [{role:"user", content: rules}, {role:"assistant", content:"Understood. What would you like to know about your marking?"}, ...ch.slice(-12)];
      const text = await chatText(turns, t => { bubble.textContent = t; });
      ch.push({role:"assistant", content:text});
    } catch (e) {
      ch.push({role:"assistant", content: e?.code === "rate_limited" ? "Usage limit reached. Try again shortly." : "That didn't go through. Ask again."});
    }
    draw();
  }
  draw(); $("#askIn").focus();
}

route();
</script>
