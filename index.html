<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tax II Past Paper Examiner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
/* Layout idea: an exam desk. Question paper on the left, answer script on the right, marker's red pen for feedback. */
:root{
  --paper:#f7f8fa;
  --sheet:#ffffff;
  --ink:#16202e;
  --muted:#5b6676;
  --rule:#dfe3ea;
  --accent:#1d4e89;      /* ink blue */
  --accent-soft:#e7eef8;
  --pen:#c0262d;         /* marker's red pen */
  --pen-soft:#fbeceb;
  --good:#1f7a4a; --good-soft:#e5f3eb;
  --warn:#9a6400; --warn-soft:#fbf1dc;
  --font-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11161d; --sheet:#171d26; --ink:#e4e8ee; --muted:#97a2b2; --rule:#2a3340;
    --accent:#7fb0ec; --accent-soft:#1c2a3c; --pen:#f0716f; --pen-soft:#3a1f22;
    --good:#5cc48c; --good-soft:#18301f; --warn:#e2b14f; --warn-soft:#352a14; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11161d; --sheet:#171d26; --ink:#e4e8ee; --muted:#97a2b2; --rule:#2a3340;
  --accent:#7fb0ec; --accent-soft:#1c2a3c; --pen:#f0716f; --pen-soft:#3a1f22;
  --good:#5cc48c; --good-soft:#18301f; --warn:#e2b14f; --warn-soft:#352a14; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--font-body)}
button,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.2}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* top bar */
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--rule);background:var(--sheet);position:sticky;top:0;z-index:5}
.bar h1{font-size:20px}
.bar .crumb{color:var(--muted);font-size:14px}
.bar .spacer{flex:1}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.pen{color:var(--pen);border-color:var(--pen)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{padding:4px 10px;font-size:13px}

/* home */
.home{max-width:1000px;margin:0 auto;padding:28px 20px 60px;display:grid;gap:22px}
.intro{max-width:68ch;color:var(--muted)}
.intro strong{color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:18px;display:grid;gap:10px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--accent)}
.card h2{font-size:19px}
.card .meta{font-size:13px;color:var(--muted)}
.card ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent)}
.status-line{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}

/* exam layout */
.exam{display:grid;grid-template-columns:minmax(0,var(--leftw,50%)) 8px minmax(0,1fr);gap:0;height:calc(100% - 58px)}
.exam.noleft{grid-template-columns:minmax(0,1fr)}
.exam.noleft .left,.exam.noleft .split{display:none}
.exam.noleft .right{max-width:920px;width:100%;justify-self:center}
.split{cursor:col-resize;background:var(--rule);position:relative;touch-action:none}
.split::after{content:"";position:absolute;top:50%;left:2px;width:4px;height:40px;margin-top:-20px;border-radius:2px;background:var(--muted);opacity:.5}
.split:hover,.split.drag{background:var(--accent)}
.toggle[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pane{overflow:auto;padding:20px 24px 60px}
.left{background:var(--sheet)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin:-4px 0 16px;position:sticky;top:-20px;background:var(--sheet);padding-top:8px;z-index:2}
.tab{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.doc{font-size:14.5px;max-width:78ch}
.doc p{margin:0 0 6px}
.doc .gap{height:10px}
.doc table{border-collapse:collapse;margin:8px 0 12px;width:100%;font-size:13.5px}
.doc td{border:1px solid var(--rule);padding:4px 8px;vertical-align:top}
.doc td.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.doc .head{font-weight:600}
.tablewrap{overflow-x:auto}
.locked{border:1px dashed var(--rule);border-radius:10px;padding:18px;color:var(--muted)}

/* right side */
.right{display:grid;align-content:start;gap:16px}
.partnav{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer;font-family:var(--font-mono)}
.chip.cur{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:500}
.chip.g{border-color:var(--good);color:var(--good)}
.chip.w{border-color:var(--warn);color:var(--warn)}
.chip.c{border-color:var(--pen);color:var(--pen)}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.qhead h2{font-size:22px}
.marks{font-family:var(--font-mono);font-size:14px;color:var(--muted)}
.required{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;white-space:pre-wrap}
.qtitle{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
textarea#answer{width:100%;min-height:340px;resize:vertical;border:1px solid var(--rule);border-radius:10px;padding:14px;background:var(--sheet);
  font-family:var(--font-mono);font-size:14px;line-height:24px;
  background-image:linear-gradient(var(--sheet),var(--sheet)),repeating-linear-gradient(transparent 0 23px,var(--rule) 23px 24px);
  background-clip:padding-box,content-box;background-origin:padding-box,content-box;background-blend-mode:normal}
textarea#answer{background-image:repeating-linear-gradient(transparent 0 23px,var(--rule) 23px 24px);background-attachment:local;background-position:0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{font-size:13px;color:var(--muted)}
dialog#keyDlg{border:1px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);max-width:520px;width:calc(100% - 32px);padding:20px 22px}
dialog#keyDlg::backdrop{background:rgba(0,0,0,.45)}
#keyDlg h3{margin:0 0 6px;font-family:var(--font-display);font-size:20px}
#keyDlg p{font-size:13px;color:var(--muted);margin:0 0 12px}
#keyDlg label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
#keyDlg .prov{display:flex;gap:16px;font-weight:400}
#keyDlg .prov label{font-weight:400;margin:0;display:flex;gap:6px;align-items:center}
#keyDlg input[type=password],#keyDlg input[type=text]{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit}
#keyDlg .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
#keyStatus{font-size:13px;margin-top:10px;min-height:1.2em}
#keyStatus.ok{color:var(--good)} #keyStatus.bad{color:var(--pen)}
.timer{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.timer.over{color:var(--pen)}

/* feedback */
.fb{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:18px;display:grid;gap:14px}
.score{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.score .big{font-family:var(--font-display);font-size:34px;font-weight:700;color:var(--pen);line-height:1}
.score .big small{font-size:18px;color:var(--muted);font-weight:600}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px}
.pill.g{background:var(--good-soft);color:var(--good)}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.pill.c{background:var(--pen-soft);color:var(--pen)}
.fb h3{font-family:var(--font-body);font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.err{border-left:3px solid var(--pen);background:var(--pen-soft);border-radius:0 8px 8px 0;padding:10px 12px;display:grid;gap:4px}
.err b{color:var(--pen)}
.err .fix::before{content:"Correct: ";font-weight:600;color:var(--good)}
.err .why{font-size:13.5px;color:var(--muted)}
.list{display:grid;gap:8px}
.miss{display:flex;gap:10px;align-items:baseline}
.miss .m{font-family:var(--font-mono);font-size:12px;color:var(--pen);border:1px solid var(--pen);border-radius:4px;padding:0 5px;white-space:nowrap}
.ok{display:flex;gap:8px}
.ok::before{content:"✓";color:var(--good);font-weight:700}
.revise{display:flex;flex-wrap:wrap;gap:6px}
.revise span{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:3px 9px;font-size:13.5px}
.tip{border-top:1px solid var(--rule);padding-top:10px;font-size:14px}
.history{font-size:13px;color:var(--muted)}
.chat{display:grid;gap:10px}
.msg{padding:10px 12px;border-radius:10px;white-space:pre-wrap;font-size:14px}
.msg.u{background:var(--accent-soft);justify-self:end;max-width:85%}
.msg.a{background:var(--paper);border:1px solid var(--rule)}
.chat textarea{width:100%;min-height:60px;border:1px solid var(--rule);border-radius:8px;padding:8px;background:var(--sheet)}
.busy{display:flex;align-items:center;gap:10px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pen);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}
.notice{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.selfmark{display:flex;gap:8px;align-items:center}
.selfmark input{width:70px;padding:5px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet)}

@media (max-width: 900px){
  .exam{grid-template-columns:1fr !important;height:auto}
  .split{display:none}
  .left{border-right:0;border-bottom:1px solid var(--rule);max-height:55vh}
  .pane{padding:16px}
}
</style>
</head>
<body>
<header class="bar">
  <h1>Tax II Examiner</h1>
  <span class="crumb" id="crumb">ACC3004W past papers</span>
  <span class="spacer"></span>
  <button class="btn small toggle" id="paperBtn" hidden aria-pressed="true">Scenario panel</button>
  <button class="btn small toggle" id="timerBtn" hidden aria-pressed="false">Timer</button>
  <button class="btn small toggle" id="layoutBtn" hidden aria-pressed="false" title="When off, only the tax content is marked: any format is fine and communication marks are given automatically.">Mark layout</button>
  <button class="btn small" id="keyBtn" hidden>AI key</button>
  <button class="btn small" id="homeBtn" hidden>All papers</button>
</header>
<dialog id="keyDlg" aria-labelledby="keyTitle">
  <h3 id="keyTitle">Use your own AI key</h3>
  <p>Your key is saved only in this browser and sent straight to Google or Anthropic, never to this site. Without one, the site uses its shared Gemini key if that is working.</p>
  <label>Provider</label>
  <div class="prov"><label><input type="radio" name="prov" value="gemini" checked> Gemini (free key)</label><label><input type="radio" name="prov" value="claude"> Claude (paid key)</label></div>
  <div class="hint" id="provHint" style="margin-top:6px"></div>
  <label for="keyIn">API key</label><input id="keyIn" type="password" autocomplete="off" spellcheck="false">
  <label for="modelIn">Model <span class="hint">(leave blank to pick automatically)</span></label><input id="modelIn" type="text" spellcheck="false">
  <div class="row"><button class="btn primary" id="keySave">Save and test</button><button class="btn" id="keyRemove">Remove my key</button><span style="flex:1"></span><button class="btn" id="keyClose">Close</button></div>
  <div id="keyStatus" role="status"></div>
</dialog>
<main id="app"></main>

<script>
const PAPERS = [{"id": "nov2025", "title": "November 2025 Final Exam", "short": "Nov 2025", "marks": 113, "yoa": "2025", "memoNote": "Official UCT suggested solution (no per-line mark allocation shown).", "tables": "MONETARY CHANGES - 2025\nApplicable in respect of years of assessment commencing on or after 1 March 2024 (i.e.\n2025 year of assessment) – unless specifically stated otherwise\nREBATES (section 6)\nPrimary rebate increases from R16 425 to R17 235;\nSecondary rebate increases from R9 000 to R9 444;\nTertiary rebate increases from R2 997 to R3 145\nMEDICAL REBATES (section 6A)\nBenefits to the taxpayer: R364;\nBenefits to the taxpayer and one dependant: R728;\nBenefits to each additional dependant: R246\nRESIDENTIAL ACCOMMODATION (paragraph 9 of the Seventh Schedule)\nSymbol B of R91 250 increases to R95 750.\nRATES OF NORMAL TAX\n•  |  In respect of the taxable income (excluding any retirement fund lump sum\nbenefit, retirement fund lump sum withdrawal benefit or severance benefit) of natural\npersons, estates and special trusts\nTaxable Income (R)  |  Rate of Tax\n0 – 237 100  |  18% of taxable income\n237 101 – 370 500  |  42 678 + 26% of taxable income above 237 100\n370 501 – 512 800  |  77 362 + 31% of taxable income above 370 500\n512 801 – 673 000  |  121 475 + 36% of taxable income above 512 800\n673 001 – 857 900  |  179 147 + 39% of taxable income above 673 000\n857 901 – 1 817 000  |  251 258 + 41% of taxable income above 857 900\n1 817 001 and above  |  644 489 + 45% of taxable income above 1 817 000\n•  |  In respect of the taxable income of any company which qualifies as a small\nbusiness corporation as defined in section 12E of the Income Tax Act, in respect of\nany year of assessment ending any date between 1 April 2025 and 31 March 2026.\nTaxable Income (R)  |  Rate of Tax\n0 – 95 750  |  0% of taxable income\n95 751 – 365 000  |  7% of the amount above R95 750\n365 001 – 550 000  |  R18 848 + 21% of the amount above R365 000\n550 001 and above  |  R57 698 + 27% of the amount above R550 000\nTRAVEL ALLOWANCE\nWhere the value of the vehicle (R) -  |  Fixed  |  Fuel  |  Mainte\ncost  |  cost  |  nance\ncost\n(R p.a.)  |  (c/km  |  (c/km)\n)\ndoes not exceed R100 000  |  34 480  |  151.7  |  46.0\nexceeds R100 000 but does not exceed R200 000  |  61 770  |  169.4  |  57.6\nexceeds R200 000 but does not exceed R300 000  |  89 119  |  184.0  |  63.5\nexceeds R300 000 but does not exceed R400 000  |  113 436  |  197.9  |  69.3\nexceeds R400 000 but does not exceed R500 000  |  137 752  |  211.8  |  81.5\nexceeds R500 000 but does not exceed R600 000  |  163 178  |  243.0  |  95.6\nexceeds R600 000 but does not exceed R700 000  |  188 653  |  247.1  |  107.3\nexceeds R700 000 but does not exceed R800 000  |  215 447  |  251.2  |  118.9\nexceeds R800 000  |  215 447  |  251.2  |  118.9\nAlternative fixed rate for certain reimbursive travel allowances: 484 cents per kilometer\n(previously 464 cents)\nSUBSISTENCE ALLOWANCE\n• Local travel:\no  |  Allowance for incidental costs only – R169 (previously R161) for each day.\no  |  Allowance for meals and incidental costs – R548 (previously R522) for each day.\n• Overseas travel:\nActual accommodation plus a prescribed amount based on the relevant country (which\namount will be provided in the IAC if it differs from the amount listed in the Regulation in\nthe SAICA Student Handbook).\nTRANSFER DUTY (Section 2(1)(b) of the Transfer Duty Act)\nIn respect of acquisition of property on or after 1 March 2020:\nValue of property (R)  |  Rate\n0 – 1 100 000  |  0%\n1 100 001 – 1 512 500  |  3% of the value above R1 100 000\n1 512 501 – 2 117 500  |  R12 375 + 6% of the value above R1 512 500\n2 117 501 – 2 722 500  |  R48 675 + 8% of the value above R2 117 500\n2 722 501 – 12 100 000  |  R97 075 + 11% of the value above R2 722 500\n12 100 001 and above  |  R1 128 600 + 13% of the value above R12 100 000", "questions": [{"id": "Q1", "title": "Question 1 — Sheldon & Amy Cooper", "marks": 56, "scenario": "QUESTION 1  |  (56 marks: 89 minutes)\nSheldon Cooper is a 48-year-old South African resident, married out of community of\nproperty to Amy Cooper (45 years old) and they have 2 children, Howard (15 years old)\nand Leonard (18 years old). Sheldon is employed full-time as a physicist at Big Bang (Pty)\nLtd (“Big Bang” or “the company”), a private research lab in Cape Town. Amy is a resident\nfor South African tax purposes.\nSheldon has been working for Big Bang since 2015. Big Bang specialises in applied\nquantum mechanics, advanced materials testing, and energy systems research. The\ncompany undertakes many projects during the year and focuses on sustainable energy\nand technology. Big Bang is a category C VAT vendor with a 30 June year-end.\n1. Sheldon Cooper\nThe following information relates to Sheldon’s 2025 year of assessment:\na. Sheldon earns a cash salary of R70 000 per month, and he contributes 5% of this to\nhis employer’s provident fund. Sheldon is also a member of the SaveMe Medical Aid\nFund with his wife and two children as dependants and his contributions amount to\nR3 000 per month. Big Bang matches every employee’s contribution to both the\nprovident fund and the medical aid fund.\nSheldon further makes contributions to a retirement annuity fund (RAF) of R3 000 per\nmonth and keeps proof of the contributions. Big Bang elects not to deduct the RAF\ncontributions of employees for employees’ tax purposes.\nb. Sheldon was granted the right to use a Macbook Pro owned by the company. The\nlaptop was purchased by Big Bang for a cost of R20 000 on 1 March 2024 and was\ngiven to Sheldon to use on the same date. Sheldon used the laptop for the entire\n2025 year of assessment before returning it to the company on 1 March 2025. The\nopen market value of the laptop on 1 March 2024 was R21 000. Sheldon owns a Dell\nlaptop which he has been using for work purposes for the past three years. He\ncontinued using his Dell laptop for work even after receiving the right of use of the\nMacbook Pro from the company. He only used the company laptop when he wanted\nto watch movies. The Macbook Pro had an open market value of R17 500 on 28\nFebruary 2025. Big Bang’s computer equipment have a useful life of five years.\nc. Sheldon always travelled to work using an uber as he had never learnt how to drive.\nHowever, he recently got his driver’s licence. From 1 March 2024, Big Bang granted\nSheldon the right of use of a BMW M3. This vehicle was purchased by Big Bang from\na second-hand car dealership on 31 December 2022 for R800 000. The vehicle was\npurchased with a maintenance plan. The fuel costs were covered by Big Bang.\nSheldon kept an accurate logbook of his kilometres travelled during the 2025 year of\nassessment:\nFrom home to the Big Bang offices and 2 000 kms\nback\nVisits to Big Bang clients  |  13 000 kms\nSundry private travel  |  1 000 kms\nd. On 1 December 2024, Big Bang awarded Sheldon a limited-edition Batman action\nfigure signed by Christian Bale. The Batman action figure was awarded to Sheldon\ndue to his long service to the company. The company purchased the action figure for\nR3 000, for the purpose of gifting it to Sheldon. The open market value on the same\nday amounted to R3 500.\ne. Sheldon’s son Leonard commenced his studies at the University of Cape Town in\n2024 but was unable to secure accommodation within the university residences. Big\nBang owns a fully furnished one-bedroom apartment in Rondebosch, Cape Town,\nwhich is typically leased to UCT students or young professionals at a monthly rental\nof R8 950, with tenants responsible for their own electricity costs. Big Bang granted\nLeonard the right to occupy and use the apartment at a reduced rental of R4 500 from\n1 January 2024 until he completes his studies at the end of 2027.\nf. In December 2024, Sheldon prevented a fire from breaking out in one of the labs\ncontaining very expensive machinery. Sheldon was awarded a leather briefcase due\nto his bravery. The briefcase had cost the company R2 800 and had an open market\nvalue of R3 700 when it was acquired on 1 June 2023. The open market value of the\nbriefcase was R3 200 in December 2024 when it was awarded to Sheldon.\ng. In December 2024, Sheldon’s new manager had complained to HR that the clothing\nSheldon wears for work was not suitable for the position he holds in the company.\nSheldon often wears Superman and Flash superhero t-shirts to the office and avoids\nwearing lab coats. Big Bang provided Sheldon with three lab coats that he is required\nto wear to work. The lab coats were purchased from a local retailer and were further\nbranded with the Big Bang logo. The total cost of the coats amounted to R2 500.\nh. In November 2024, Sheldon was awarded a Nobel Prize in physics for his latest paper\non his string theory study. Big Bang rewards all winners of this prize with a cash\nreward of R100 000. Sheldon became eligible for the cash reward in November, and\nBig Bang paid the amount in December 2024.\ni. Big Bang encourages all employees to contribute to Feeding Young Scientists, a\nSouth African charity which sponsors meals to school children in the Cape Town\ntownships. Feeding Young Scientists is a registered Public Benefit Organisation.\nSheldon has been contributing R500 per month since joining Big Bang and has\nreceived a s18A certificate for all the donations he has made over the years. The\ncontributed amount is withheld from his salary and paid over to the charity.\nOn 28 February 2025, Sheldon was working late at the office when he forgot to turn off\na gas switch, resulting in the release of harmful chemicals into the air. He subsequently\ntook a nap and, as a result, was unable to smell the harmful chemicals. Approximately\nan hour later, the gas tank exploded, leading to Sheldon’s untimely death.\nThe reading of Sheldon’s last will and testament revealed the following information:\n• Sheldon owned a house in Cape Town which he considered to be his family home.\nHe purchased the house in 2015 for R4 000 000, and they have lived there as a family\never since. The market value of the house on the date of his death was R4 900 000.\nThe house was to be sold, and the proceeds split equally between his children.\n• Sheldon owned an apartment in Johannesburg. He purchased the apartment in 2005\nafter receiving a cash lump sum from the passing of his grandfather. Sheldon\npurchased the apartment for R1 200 000, when its market value was R1 900 000. In\n2016, he made renovations to the apartment at a cost of R220 000. These were the\nonly renovations Sheldon made during the time that he owned the apartment. The\nmarket value on 28 February 2025 was R2 300 000. This property was bequeathed\nto Amy.\n• The life insurance policy from Penny Life Ltd, taken out by Amy over Sheldon’s life,\nwill be paid to Amy. All premiums relating to this policy were paid by Amy and\namounted to R70 000. Interest calculated on the premiums at 6% per annum\namounted to R10 280. The policy will pay out an amount of R600 000.\nIn addition to the above, Sheldon held the following assets on the date of death:\n• Unlisted shares, which had cost R85 000. An independent valuation of these shares\non 28 February indicated that they had a market value of R100 000. These shares\nwere sold by the executor in the course of winding up the estate for R120 000. The\nproceeds from this sale were to be given to Sheldon’s children.\n• Cash in bank accounts amounting to R150 000.\nThe executor of Sheldon’s estate paid the following expenses out of the cash in the estate:\nSouth African debts due (Including taxes)  |  R250 000\nDeathbed and Funeral expenses  |  R60 000\nExecutor and Valuator fees  |  R85 000\n2. Amy Cooper\nAmy’s primary source of income is her gross salary of R170 000 per month. Amy works as\na microbiologist. She also earns rental income from an apartment block that she purchased\nfor R8 million on 1 December 2021. She purchased the apartment block from Stuart Bloom\nwho was also renting the apartments out but became tired of the stress of collecting the\nrental payments from tenants. The apartment block is located in Newlands, Cape Town, and\nconsists of six one-bedroom apartments. The apartment block was transferred into Amy’s\nname on 28 February 2022.\nOn 1 March 2022, Amy entered into separate rental agreements with 6 students, all of whom\nwere not related to her. From 1 March 2024, 2 tenants had moved out, and Amy’s younger\nsister and her grandfather began renting from her. In terms of the lease agreements, a\nmonthly rental of R12 000 per apartment was payable. The purchase of the apartment block\nwas financed by a mortgage bond. During the 2025 year of assessment, a pipe burst\nunderground, which resulted in Amy having to repave the entire ground floor. She had to\npay for all the expenses relating to the damage as she had not yet finalized documents with\nher new insurance company at the time of the damage. The total cost amounted to\nR330 000. A week after the damage had occurred, Amy took out an insurance policy to\nprotect her from events like these in the future. The insurance costs for the 2025 year of\nassessment amounted to R14 500.\nDuring the year of assessment ended 28 February 2025, interest paid on the bond amounted\nto R500 000. Rates and levies payable on this property amounted to R150 000 for the same\nperiod. There has not yet been a change in these annual costs or rental income received\nsince the date the property was transferred into Amy’s name.\nAmy recorded the following gains and losses relating to the renting of the apartment block.\nYear of assessment  |  Gain/(Loss)\n2023  |  R 200 000\n2024  |  R 180 000\n2025  |  ?\nAdditional Information:\n• You may assume that all amounts are inclusive of VAT unless otherwise stated\nor the context indicates otherwise.\n• Big Bang (Pty) Ltd only transacts with VAT vendors, unless otherwise stated\nor the context indicates otherwise, and is in possession of all valid tax\ninvoices.\n• Amy Cooper is a registered VAT vendor.\n• Sheldon’s remuneration proxy for the 2025 year of assessment equals R1 100 000.", "parts": [{"id": "1.1", "marks": 30, "required": "Calculate, with brief reasons, the employees' tax that would have been withheld by Big Bang (Pty) Ltd from Sheldon Cooper's salary for the month of December 2024.", "memo": "1.1 Item  |  Reason/Working  |  Amount\nRemuneration excluding annual amounts\nSalary  |  Para (c ) of GI : 70 000 x 12  |  840 000\nProvident fund contribution  |  Para 12D (5% x 70 000 x 12)  |  42 000\nMedical aid contribution  |  Para 12A (3 000 x 12)  |  36 000\nMacBook right of use  |  Para 6 : Lower of cost (R20 000) or Market value (R21 000)\n15% x R20 000  |  3 000\nRight of use of Motor car  |  Para 7\nBusiness kms= 13 000/16 000 = 81.25%, therefore use 20% inclusion\nDetermined value = R800 000 x 85%= R680 000\nAmount included= R680 000 x 3.25% x 12 x 20%  |  53 040\nNo para 7(7) or 7(8) for employees tax\nRight of use of Residential accommodation  |  Para 16 - Benefit received by relative deemed to be that of employee\nPara 9- Rental value equal to formula as apartment is owned by employer\nA= 1 100 000\nB = R95 750\nC= 18\nD= 12\nInclusion ((R1 100 000 - R95 750) x 18/100 x 12/12)\nLess rent paid by Sheldon R4 500 x 12  |  126 765\nRemuneration  |  1 100 805\nAllowable deductions\ns11F: Retirement fund contributions  |  (5% x R840 000 x 2 ) = R84 000\nRAF not taken into account by employer\nLimited to lesser of:\n1. 350 000\n2. 27.5% of remuneration (R1 100 805) = R302 378\ntherefore full deduction  |  -  |  84 000\n1 016 805\ns18A  |  Total contribution= R6 000\nLimited to 5% x R1 016 805 = R50 840  |  -  |  6 000\nBalance of Remuneration excluding annual amounts  |  1 010 805\nTax on annual equivalent excluding annual amounts  |   R251 258 + (41%)(R1 010 805 - R857 900)  |  313 949\nPrimary rebate - s6  |  -  |  17 235\nMedical aid rebate - s6A  |  (R728 + R246 + R246) x 12  |  -  |  14 640\ns6B  |  Not applicable as Sheldon is not 65 years or older\nTax liability  |  282 074\nTax on normal amounts in December  |  R282 074/12  |  23 506\nAnnual amounts\nAcquisition of asset - Batman  |  Para 5\nBought specifically for Sheldon therefore cost to employer  |  3 000\nNo long service reduction due to only being employed for 10 years (no initial unbroken period of 15\nyears)\nAcquisition of asset- Briefcase  |  Value of benefit is the open market value = R3 200\nBravery reduction - lesser of R5000 and cost of bravery award (R2 800)  |  400\nCost= R2500\nAcquisition of asset- Work clothing  |  However, uniform exemption as coats have company branding and Sheldon is required to wear this to\nwork\nBonus  |  Variable remuneration- Paid in December  |  100 000\nBalance of Remuneration including annual amounts  |  1 114 205\nTax on annual equivalent including annual amounts  |   R251 258 + (41%)(R1 114 205 -R 857 900)  |  356 343\nPrimary rebate - s6  |  -  |  17 235\nMedical aid rebate - s6A  |  (R728 + R246 + R246) x 12  |  -  |  14 640\nTax liability  |  324 468\nTax on Annual amounts  |  R324 468 - R282 074  |  42 394\nEmployees tax for December 2024 = R23 506 + R42 394  |  65 900\nAvailable\nMaximum"}, {"id": "1.2", "marks": 7, "required": "Discuss, with supporting calculations, the income tax consequences for Sheldon Cooper on the date of his death in relation to:\n• His family home in Cape Town and\n• His apartment in Johannesburg\n(6 marks + 1 communication mark: clarity of expression)", "memo": "1.2 On the date of death\nSheldon will be deemed to have disposed of all his assets at the market value on the date of his death.\nFamily home:\nThe family home is deemed to be disposed of at its market value on the date of Sheldon's death, R4 900 000.\nThe base cost of the property was the purchase price equal to 4 000 000.\nThis results in a capital gain of R900 000\nThis family home was Sheldon's primary residence, therefore he will be allowed a primary residence exclusion of R2 million, limited to the capital gain of R900 000. As a result, there will be no capital gain.\nApartment in Johannesburg\nThe apartment is bequeathed to his wife and is deemed to be disposed of for its base cost, therefore no capital gain or loss\nThe base cost of the apartment is R1 200 000 plus the cost of the renovations (R220 000) = R1 420 000\nThe annual exclusion is increased to R300 000 upon death.\nIf Sheldon had any net capital gain, this would be included at 40%\nX1: Communication skills - clarity of expression\nAvailable\nMaximum"}, {"id": "1.3", "marks": 12, "required": "Advise Amy Cooper, with supporting calculations, on the tax consequences relating to the apartments purchased and rented out and related costs for her year of assessment ended 28 February 2025.\n(11 marks + 1 communication mark: critical thinking)", "memo": "1.3 Amy Cooper\nVAT\nThere will be no VAT consequences as the supply of residential accommodation is an exempt supply.\nNormal Tax\nAmy will include R864 000 (R12 000 x 12 x 6) rental income into her gross income for 2025\nAmy will get a s24J interest deduction of R500 000 as these were incurred for trade and in the production of income\nAmy will get a s11(a) deduction relating to the levies and rates amounting to 150 000 as these were incurred for trade and in the production of income\nAmy will get a s11(d) deduction for the damage to the ground floor of the apartment. As there was damage\nwhich was then repaired equal to R330 000\nThere will be no s13 sex allowance as the apartments were not new and unused\nAmy will be allowed a s11(a) deduction for the insurance premiums paid in the 2025 YOA, R14 500\nAmy will therefore have an assessed loss of R864 000 - R650 000 - R330 000 - R14 500 = - R130 500 with respects to rental trade in the 2025 YOA\nTherefore the requirements of s20A need to be considered to determine if the assessed loss should be ringfenced.\nAmy is in the maximum marginal tax bracket: R2 040 000 (R170 000 x 12) salary exceeds R1 817 000\n4/6= 67% of the tenants are not relatives, which means that Amy does not meet the requirement stating that at least 80% of the tenants must not be relatives. Therefore rental of residential accommodation\nis considered to be a suspect trade and the assessed loss from this trade will be ringfenced.\nThe next step is to consider the facts and circumstances test. Amy only incurred the assessed loss due to the damage of the burst pipe and not having insurance.\nAmy has since taken out insurance policies and therefore in future, the costs incurred to repair the property would not be deducted as they\nwould be insured losses and therefore prohibited. Resulting in possible taxable income arising in future\nThe assessed loss for 2025 would therefore not be ringfenced and may be set off against other taxable income from her employment.\nAlternatively, Amy is not able to prove that there will be taxable income derived from the rental trade in the following year of assessment, therefore the assessed loss will be ringfenced.\nX1: Communication skills - critical thinking\nAvailable\nMaximum"}, {"id": "1.4", "marks": 7, "required": "Calculate the Estate Duty that would be payable on Sheldon Cooper's death.", "memo": "1.4 Item  |  Reason/Working  |  Amount\nFamily home  |  4 900 000\nApartment  |  2 300 000\nInsurance policy  |  600 000 - 70 000- 10 280  |  519 720\nUnlisted shares  |  Fair market value  |  100 000\nCash  |  150 000\nGross value of estate  |  7 969 720\nLess deductions:\nSA debts (including tax liabilities)  |  s4(b)  |  -  |  250 000\nDeathbed and funeral expense  |  s4(a)  |  -  |  60 000\nExecutor fees  |  s4(c)  |  -  |  85 000\nApartment and life insurance- bequeathed to spouse  |  s4(q) (2 300 000 + 519 720)  |  -  |  2 819 720\nNet value of estate  |  4 755 000\nLess: Abatement  |  -  |  3 500 000\nDutiable Amount of the Estate  |  1 255 000\nEstate duty  |  R1 774 720 x 20%  |  251 000\nAvailable\nMaximum"}]}, {"id": "Q2", "title": "Question 2 — Pure Aura (Pty) Ltd", "marks": 57, "scenario": "QUESTION 2  |  (57 marks: 91 minutes)\nPure Aura (Pty) Ltd (‘Pure Aura’ or ‘the company’) is a company which manufactures\nbeauty and skincare products. The company was founded by Phila Bhengu in 2010,\ntogether with his sisters, Linda and Grace Bhengu. Each of the three siblings holds an\nequal shareholding in the company. The company is a small business corporation as\ndefined, is registered as a Category B VAT vendor and has a December financial year-\nend.\n1. Lease Agreement\nIn 2024, Pure Aura required additional funding to support its expansion plans. In order to\nfree up cash resources, the company disposed of its factory building and subsequently\nentered into a lease agreement with the Western Cape Provincial Government for the use\nof property that would serve as its new factory premises. The building to be leased was\nnot as big as the factory building that Pure Aura previously owned. Pure Aura required\nmore space in the factory, to ensure that the production levels would not decrease\nbecause of the new space. As part of the negotiations with the Western Cape Provincial\nGovernment, Pure Aura requested that the lease agreement include a clause requiring\nthe company to undertake and finance expansions to the building to create the desired\nspace to suit the company’s production plans. The terms of the lease agreement were as\nfollows:\nCommencement date  |  1 November 2024\nDuration of lease  |  15 years\nLease payments  |  (a)  |  R27 000 per month\nLease payment increase  |  10% per annum\nValue of expansion to leased (b)  |  Not exceeding R1 500 000\nproperty\nNotes:\n(a) During the lease negotiations, representatives of the Western Cape Provincial\nGovernment indicated that if Pure Aura agreed to pay the lease amount annually\nin advance on 1 November each year, the monthly rental would be reduced from\nR33 000 to R27 000. Pure Aura accepted this arrangement and has paid all 12\nmonths in advance, since the commencement of the lease.\n(b) Pure Aura hired a construction company to work on the expansion of the building.\nThe expansion was completed on 1 February 2025, and Pure Aura was billed a\ntotal cost of R1.8 million (excluding VAT).\n2. Distribution Division\nPure Aura has a distribution division that is responsible for delivering trading stock to\nclients once orders are completed. The division operates a fleet of delivery trucks, all of\nwhich are owned by the company. These delivery trucks can only accommodate the driver\nand one passenger as they are mainly meant to carry goods. On 31 March 2025, one of\nthe trucks was hijacked as it was returning to the warehouse after delivering trading stock\nto clients. The delivery truck was acquired for R744 000 on 1 January 2021. The open\nmarket value of the truck was R552 000 on the day of the hijacking incident. The truck\nwas not recovered. However, it was insured, and the company lodged a claim with its\ninsurer, who paid out an amount of R650 000. On 30 June 2025, the same date the\ninsurance proceeds were received, Pure Aura purchased a new delivery truck for\nR1 150 000, financed partly from the insurance payout. The new delivery truck was\nimmediately brought into use.\nFortunately, neither of the employees in the truck was physically harmed during the\nincident. They were encouraged to talk to the company psychologist to deal with the\ntraumatic event and the impact it may have had on them.\n3. Pure Aura – Other Transactions\nThe tax accountant at Pure Aura was in the process of finalising the company’s normal\ntax computation for the 2025 year of assessment when his wife gave birth earlier than the\nexpected due date. As a result, he took paternity leave before completing the tax\ncalculation. The following transactions had not yet been accounted for in the company’s\ntax records:\n• As a result of the hijacking incident, the management of the company thought it\nwould be best to hire a company psychologist on a permanent basis to assist its\nemployees in managing personal and work-related challenges. The psychologist\nwas appointed on 1 May 2025 and is paid a monthly cash salary of R75 000.\n• The marketing director of the company has been granted the right of use of a\ncompany-owned Hyundai i30. The vehicle was acquired by Pure Aura on 1 March\n2024 for R848 000, and such right of use was granted immediately after the vehicle\nwas purchased. The company is responsible for the repairs and maintenance of\nthe vehicle. On 1 April 2025, the marketing director suffered a heart attack and was\nbooked off work for three months following his surgery. Although he did not make\nuse of the vehicle during this period, the company continued to grant him the right\nof use of the vehicle.\n• Pure Aura (Pty) Ltd’s policy provides that the company matches the employees’\ncontributions to the pension fund on a 1:2 ratio, where the company pays twice the\nemployees’ own contributions. During the 2025 year of assessment, total\nemployee contributions to the pension fund amounted to R950 000.\n• The company pays annual performance bonuses to its employees, determined as\n10% of the company’s gross sales for the year. For the 2025 year of assessment,\nPure Aura’s Statement of Comprehensive Income indicated gross sales amounting\nto R11 546 230 (2024: R10 980 000) The bonuses are paid in January each year\nas that is when Pure Aura can accurately determine the gross sales that were\nmade in the prior year.\n• The company acquired a Nespresso coffee machine for the employees to enjoy\npremium coffee at the office. The machine was acquired on 1 June 2025 for a cost\nof R6 700.\n4. Agreement with Content Creators\nPure Aura has observed a growing trend among companies in the beauty industry where\nthe companies partner up with social media content creators. The management of Pure\nAura considered adopting a similar approach by gifting trading stock to selected\ninfluencers. The company selected 25 creators, and each creator was gifted a hamper\nwith products with an open market value of R9 000. There was no expectation for the\ncreators to post about the products on their social media platforms. The products in each\nhamper had cost the company R6 500. A concern was raised regarding the potential\nunintended tax consequences of this arrangement. The tax accountant was already on\npaternity leave when this transaction was concluded and was therefore not available to\naddress management’s concerns.\n5. New Product Launch\nIn October 2025, Pure Aura launched a new skincare product as part of its premium\nbeauty range. Shortly after the product’s release, a customer experienced a severe\nallergic reaction after using it and was hospitalised for several days. The customer\nreported the incident to Pure Aura on 30 November 2025, prompting the company to seek\nlegal advice. Following consultation with its legal advisors, Pure Aura agreed to settle the\nmatter out of court and paid the customer an amount of R150 000 in compensation on 15\nDecember 2025. As part of the settlement, the customer was made to sign a non-\ndisclosure agreement that prohibited her from sharing any details of the incident publicly.\nFollowing an internal investigation lodged by the company, it was discovered that there\nwere some steps in the quality control processes that were not fully adhered to as the\ncompany was in a rush to launch the new product. The company did not issue a media\nstatement regarding the matter and none of the products that had already been sold to\ncustomers were recalled. The only corrective measure implemented by Pure Aura was to\ndiscontinue the manufacturing of the new product. The management of Pure Aura\nintended to preserve the company’s public image and reputation by hiding the details of\nthe incident.\nAdditional information\n• You may assume that all amounts are inclusive of VAT unless otherwise stated\nor the context indicates otherwise.\n• Pure Aura only transacts with VAT vendors, unless otherwise stated or the\ncontext indicates otherwise, and is in possession of all valid tax invoices.\n• The Western Cape Provincial Government is not a registered VAT vendor.\n• SARS considers the manufacture of skincare and make-up products to be a\nprocess of manufacture.\n• Interpretation Note 47 read together with BGR 7 allows a write-off period of five\nyears for all qualifying assets.\n• Pure Aura wishes to minimize its taxation position by taking advantage of any and\nall elective taxation provisions in any relevant Acts.", "parts": [{"id": "2.1", "marks": 11, "required": "Discuss the normal tax consequences for Pure Aura (Pty) Ltd for the lease of the building for the 2025 year of assessment.\n(10 marks + 1 communication mark: logical argument)", "memo": "The lease payments made by Pure Aura will be allowed a s11(a) deduction as they have been incurred in the production of income and are not of a capital nature.\n2.1\nNovember 2025 payment\nThe amount paid in relation to the 2 months in the 2025 year of assessment will be deductible, R59 400 (R27 000 x 1.1 x 2)\nAn assessment needs to be made as to whether the deduction of the prepaid expenditure will be prohibited in terms of s23H:\nThe prepaid amount was R297 000 (R27 000 x 1.1 x 10) and this is greater than R100 000\nThe benefit of the payment will also not be enjoyed within six months after the end of the 2025 year of assessment as it relates to 10 months into the following year of\nassessment (i.e 2026 YOA).\nThe prepaid expenditure was not paid in respect of an unconditional liability to pay an amount imposed by legislation\nTherefore the deduction of the prepaid amount will be prohibited in terms of s23H in the 2025 year of assessment and will be deducted in the 2026 year of assessment\nNovember 2024 payment\nThe amount prepaid in the 2024 year of assessment was R270 000 (R27 000 x 10) and would have been prohibited as a deduction in the 2024 year of assessment. The amount\nwill be allowed as a s11(a) deduction in the 2025 year of assessment.\nLeased building\nPure Aura will not be permitted a s13(1) allowance on the leased building as they did not incur the cost of constructing the building.\nLeasehold improvement\nThe cost of the leasehold improvement will not be allowed a s11(g) deduction as the lessor will not include the amount in its gross income, the Western Cape Provincial\nGovernment is exempt from normal tax.\nPure Aura will be deemed to be the owner of the leasehold improvement in terms of s12N due to the following reasons:\nPure Aura holds a right of use of a building owned by the government and has incurred expenditure to effect an improvement on the building. Furthermore, the building will be\nused in the production of income, as it will be used to manufacture products that will be sold for profit.\nThe company will therefore be able to claim a s13(1) allowance on the leasehold improvement as the expansion will be used in the process of manufacture.\nThe allowance will be 5% of the cost incurred, R90 000 (R1 800 000 x 5%)\nX1: Communication skills - logical argument\nAvailable\nMaximum"}, {"id": "2.2", "marks": 17, "required": "Discuss all the tax implications for Pure Aura (Pty) Ltd for its 2025 year of assessment in relation to the note \"Distribution Division\".\n(16 marks + 1 mark: integrative thinking)", "memo": "2.2 VAT\nStolen Truck\nSupply\nThere will be a deemed supply for the proceeds that were received from the insurance company for the loss of the delivery truck, in terms of s8(8).\nSection 8(8) will apply because although this was a total reinstatement of a vehicle, it was not input denied under s16(3) as it was not a motor car as defined.\nTime of supply\nThe time of supply will be the date of receipt of the insurance proceeds, 30 June 2025.\nValue of supply\nThe value of supply is the amount received from the insurer, R650 000 resulting in output VAT of R84 783 (R650 000 x 15/115)\nPure Aura would also have been able to claim VAT input on the insurance premiums paid\nNew Truck\nPure Aura will be allowed to claim input on the purchase of the new delivery truck as it is not a motor car as defined.\nR1 150 000 x 15/115 = R150 000\nNormal Tax\nOld Truck\nAs Pure Aura is a small business corporation as defined, the allowance claimed on the vehicles would have been in terms of s12E(1A), 50:30:20\nTherefore, the delivery truck would have been fully written off for tax purposes and there would be no further allowances to claim in the 2025 year of assessment.\nThere would be a recoupment on the disposal of the delivery truck. The selling price is thus considered to be the proceeds received from the insurer, R565 217 (R650 000 x\n100/115).\nThe tax value of the vehicle is nil as all the allowances on the vehicle have been fully claimed.\nThus the recoupment on the vehicle is R565 217  |  R565 217 - R0\nThe capital gains tax effects on the disposal would be as follows:\nProceeds  |  (R565 217 - R565 217)  |  0\nBase Cost  |  (R646 957 - R646 957)  |  0\nCapital Gain  |  0\nPara 65 would apply to this disposal as the delivery truck was disposed of by way of theft (hijacking), proceeds accrued to the company (insurance proceeds were received from\nthe insurer) and they are equal to or exceed the base cost of the truck. The proceeds were used to partly finance the acquisition of a replacement delivery truck, which was brought\ninto use immediately.\nOnly 50% of the recoupment will be included in Pure Aura's taxable income for the 2025 year of assessment, in line with the write off of the replacement vehicle.\nR565 217 x 50% = R282 609\nNew Truck\nThe replacement truck will be allowed a s12E(1A) allowance of 50% in the 2025 year of assessment.\nR1 150 000 x 100/115 x 50% = R500 000\nY1: Integrative thinking\nAvailable\nMaximum"}, {"id": "2.3", "marks": 17, "required": "Calculate, with brief reasons, the VAT and normal tax consequences of the other transactions in point 3 for Pure Aura (Pty) Ltd for the year of assessment ended 31 December 2025.", "memo": "2.3 VAT\nDescription  |  Reason/Working  |  Input  |  Output\nSalary of in-house psychologist  |  No VAT - not in furtherance of enterprise\nNo s18(3) deemed supply - no value fringe benefit\nROU of motor car  |  s18(3) - deemed output\nDV - R737 391  |  (R848 000 x 100/115)\n(R737 391 x 0.3% x 12 x 15/115)  |  3 463\nNo reduction for the 3 months that the director did not use the vehicle as he\nstill had the right of use in this period (para 7(4) of Seventh Sch)\nNo VAT adjustment on acquisition of the vehicle as motor car as defined,\ntherefore input denied\nEmployer contributions to pension fund  |  financial service - exempt\nPayment of bonuses  |  No VAT - not in furtherance of enterprise\nNespresson machine  |  Input VAT denied - entertainment\nNormal Tax\nSalary of psychologist  |  s11(a)  |  -  |  600 000\nVAT on fringe benefit (ROU of motor vehicle)  |  s11(a) - amount from required 2.3  |  -  |  3 463\nAllowance on vehicle  |  s12E(1A)  |  R848 000 x 30%  |  -  |  254 400\nEmployer contributions to pension fund  |  s11(l)  |  R950 000 x 2  |  -  |  1 900 000\nBonuses  |  s7B - deducted when actually paid  |  R10 980 000 x 10%  |  -  |  1 098 000\nNespresso machine  |  s11e  |  cost R6 700  |  -  |  6 700\nsmall asset, therefore fully deductible in 2025 YOA\nAvailable\nMaximum"}, {"id": "2.4", "marks": 7, "required": "Draft a memo advising the management of Pure Aura (Pty) Ltd on the tax implications for Pure Aura (Pty) Ltd of the agreement with the social media content creators for its year ended 31 December 2025.\n(6 marks + 1 communication mark: logical argument, format and structure)", "memo": "2.4 To:  |  Management of Pure Aura\nFrom:  |  Tax II Student\nRe:  |  Tax Consequences of Agreement with Content Creators\nDate:  |  Nov-25\nVAT\nThere is a s18(1) change in use for the trading stock that is given to the content creators.\nThe time of supply is the date when the trading stock is granted to the content creators\nThe value of supply is the value of the trading stock given away, R9 000 x 25 x 15/115 = R29 348\nNormal Tax\nThere will be a recoupment for the trading stock given away, as it has been disposed of in a manner that is not in the ordinary course of business (s22(8))\nThe amount of the recoupment will be the market value of the trading stock given away, R9 000 x 25 x 100/115 = R195 652\nThere is no s11(a) deduction as there was no expectation that the creators will advertise the products on their social media platforms\nDonations Tax\nThere is a donation to the content creators of the trading stock at the market value, R195 652 (R9 000 x 25 - R29 348)\nThere is no specific exemption, therefore the R10 000 general exemption is available for the company to apply against this donation\nThe donations tax payable is R37 130 ((R195 652 - R10 000) x 20%)\nX1: Communication skills – logical argument, format and structure\nAvailable\nMaximum"}, {"id": "2.5", "marks": 5, "required": "Explain to the management of Pure Aura (Pty) Ltd any ethical concerns you have in relation to management's response to the incident detailed in the note relating to the \"New Product Launch\".", "memo": "2.5 Ethical concerns\nThe conduct of the management of Pure Aura would need to be assessed against the ethical framework of Good for self and good for others.\nThe act of concealing the facts around the subquality product that has been sold to customers is not good for others as it exposes the customers to health issues.\nThis response could be viewed as good for the company as the company will avoid financial losses from product recalls or refunds.\nThe company would protect its reputation in the short term\nThis could also have dire consequences for the company if it were to come out that the company hid this information from the public, there could potentially be lawsuits lodged\nagainst the company and this could cause severe reputational damage for the company.\nFurthermore, King IV requires that those who are charged with governance need to act with integrity, be responsible, transparent and accountable.\nThe focus of the company should not only be on profit maximisation, but the other stakeholders also need to be considered.\nAny other valid point\nAvailable\nMaximum"}]}]}, {"id": "jan2026", "title": "January 2026 Supplementary Exam", "short": "Jan 2026", "marks": 113, "yoa": "2025", "memoNote": "Official UCT suggested solution (no per-line mark allocation shown). Question paper transcribed from the scanned PDF.", "tables": "MONETARY CHANGES - 2025\nApplicable in respect of years of assessment commencing on or after 1 March 2024 (i.e.\n2025 year of assessment) – unless specifically stated otherwise\nREBATES (section 6)\nPrimary rebate increases from R16 425 to R17 235;\nSecondary rebate increases from R9 000 to R9 444;\nTertiary rebate increases from R2 997 to R3 145\nMEDICAL REBATES (section 6A)\nBenefits to the taxpayer: R364;\nBenefits to the taxpayer and one dependant: R728;\nBenefits to each additional dependant: R246\nRESIDENTIAL ACCOMMODATION (paragraph 9 of the Seventh Schedule)\nSymbol B of R91 250 increases to R95 750.\nRATES OF NORMAL TAX\n•  |  In respect of the taxable income (excluding any retirement fund lump sum\nbenefit, retirement fund lump sum withdrawal benefit or severance benefit) of natural\npersons, estates and special trusts\nTaxable Income (R)  |  Rate of Tax\n0 – 237 100  |  18% of taxable income\n237 101 – 370 500  |  42 678 + 26% of taxable income above 237 100\n370 501 – 512 800  |  77 362 + 31% of taxable income above 370 500\n512 801 – 673 000  |  121 475 + 36% of taxable income above 512 800\n673 001 – 857 900  |  179 147 + 39% of taxable income above 673 000\n857 901 – 1 817 000  |  251 258 + 41% of taxable income above 857 900\n1 817 001 and above  |  644 489 + 45% of taxable income above 1 817 000\n•  |  In respect of the taxable income of any company which qualifies as a small\nbusiness corporation as defined in section 12E of the Income Tax Act, in respect of\nany year of assessment ending any date between 1 April 2025 and 31 March 2026.\nTaxable Income (R)  |  Rate of Tax\n0 – 95 750  |  0% of taxable income\n95 751 – 365 000  |  7% of the amount above R95 750\n365 001 – 550 000  |  R18 848 + 21% of the amount above R365 000\n550 001 and above  |  R57 698 + 27% of the amount above R550 000\nTRAVEL ALLOWANCE\nWhere the value of the vehicle (R) -  |  Fixed  |  Fuel  |  Mainte\ncost  |  cost  |  nance\ncost\n(R p.a.)  |  (c/km  |  (c/km)\n)\ndoes not exceed R100 000  |  34 480  |  151.7  |  46.0\nexceeds R100 000 but does not exceed R200 000  |  61 770  |  169.4  |  57.6\nexceeds R200 000 but does not exceed R300 000  |  89 119  |  184.0  |  63.5\nexceeds R300 000 but does not exceed R400 000  |  113 436  |  197.9  |  69.3\nexceeds R400 000 but does not exceed R500 000  |  137 752  |  211.8  |  81.5\nexceeds R500 000 but does not exceed R600 000  |  163 178  |  243.0  |  95.6\nexceeds R600 000 but does not exceed R700 000  |  188 653  |  247.1  |  107.3\nexceeds R700 000 but does not exceed R800 000  |  215 447  |  251.2  |  118.9\nexceeds R800 000  |  215 447  |  251.2  |  118.9\nAlternative fixed rate for certain reimbursive travel allowances: 484 cents per kilometer\n(previously 464 cents)\nSUBSISTENCE ALLOWANCE\n• Local travel:\no  |  Allowance for incidental costs only – R169 (previously R161) for each day.\no  |  Allowance for meals and incidental costs – R548 (previously R522) for each day.\n• Overseas travel:\nActual accommodation plus a prescribed amount based on the relevant country (which\namount will be provided in the IAC if it differs from the amount listed in the Regulation in\nthe SAICA Student Handbook).\nTRANSFER DUTY (Section 2(1)(b) of the Transfer Duty Act)\nIn respect of acquisition of property on or after 1 March 2020:\nValue of property (R)  |  Rate\n0 – 1 100 000  |  0%\n1 100 001 – 1 512 500  |  3% of the value above R1 100 000\n1 512 501 – 2 117 500  |  R12 375 + 6% of the value above R1 512 500\n2 117 501 – 2 722 500  |  R48 675 + 8% of the value above R2 117 500\n2 722 501 – 12 100 000  |  R97 075 + 11% of the value above R2 722 500\n12 100 001 and above  |  R1 128 600 + 13% of the value above R12 100 000", "questions": [{"id": "Q1", "title": "Question 1 — Brew & Bean (Pty) Ltd", "marks": 56, "scenario": "QUESTION 1  |  (56 MARKS; 89 MINUTES)\nBrew & Bean (Pty) Ltd ('Brew & Bean' or 'the company') is a South African manufacturer of coffee machines, accessories and coffee beans. The company was incorporated in South Africa in 2014 and has since grown to become one of the largest manufacturers and distributors of coffee machines, accessories and coffee beans. The company has a 30 June year-end and is a registered category C VAT vendor. Zaid Dawood and Ibrahim Mahmood are the co-founders of the company, who met while studying Business Science at UCT and turned their shared love of coffee into Brew & Bean.\n\nBefore incorporation of the company and while doing the research about the industry, the founders noticed that many aspiring baristas who wanted to start their own coffee businesses struggled to obtain financing to purchase commercial coffee machines or set up their businesses. To address this gap, Brew & Bean established a division to assist such start-ups by offering small business loans at affordable interest rates.\n\nRevenue Recognition (excluding VAT)\nBrew & Bean's revenue is made up of the following revenue streams for the current year of assessment:\nSales of coffee machines  |  R58 199 800\nSales of coffee machine accessories  |  R4 879 200\nSales of coffee beans  |  R1 734 000\nInterest income on loans offered  |  R5 437 000\nTotal  |  R70 250 000\nBrew & Bean sells its items for cash and on credit; however, it does not charge any interest income on the credit sales. The interest income earned relates solely to the loans given to small businesses. 75% of the sales made are on credit.\n\nThe accountant has started with the tax return for the 2025 year of assessment but needs some assistance with the transactions below:\n\nTrade receivables and Allowance for Doubtful Debts\nThe trade receivables balance as per the statement of financial position:\n  |  30 June 2025 (R)  |  30 June 2024 (R)\nTrade receivables  |  R34 919 880  |  R27 935 904\nAllowance for doubtful debts  |  R10 475 964  |  R8 380 771\nOf the total outstanding debts as at 30 June 2025, 30% was considered to be doubtful, of which 20% related to lifetime expected credit losses.\nThe bad debts per the statement of comprehensive income for 2025 is R10 354 666. This includes the movement in allowance for doubtful debts.\nIn the prior year of assessment, the company claimed a deduction of R2 346 616 relating to the allowance for doubtful debts.\n\nAssets\nNew multifunction printer\n• On 1 February 2025, the company purchased a new multifunction printer and scanner for R45 000, which was the open market value at that date. The printer was brought into use on the same day and was used in the administration department of the company. After several weeks of ongoing technical issues, the company decided to sell the printer. The printer was sold on 15 June 2025 for R30 000, which was the open market value at that date. The company decided not to replace the printer as it still had its old printer, which could be used.\n\nPurchase of factory building\n• During the current year of assessment, the company needed to purchase another factory as the company was growing. The factory was purchased on 1 July 2024 for R5 500 000 when the open market value was R5 300 000. The reason that the company was willing to pay more than the open market value was that the factory was in the same area as the other factory. The factory was purchased from Premium Global Brands (a non-VAT vendor), which claimed an allowance of 10%. The company paid the total cost in 4 equal monthly instalments starting on 1 July 2024. The factory was registered in the deeds office on 1 September 2024 and was brought into use on the same date. The factory was used entirely for the manufacture of goods, as the administration department was located in another building.\n\nTrading stock\nDemo models\n• A few of the coffee machines manufactured each year are used as demo models, where customers can come and test out the models before purchasing a new one. The demo models are used for that purpose for 6 months and sold thereafter. On 1 March 2025, one of the demo coffee machines was distributed to one of the shareholders, Zaid Dawood, as a dividend in specie. The coffee machine was manufactured at a total cost of R4 600 during the 2024 year of assessment and had an open market value of R20 500 at the date the dividend was declared.\n\nDonations made to the company\n• On 20 June 2025, a new local coffee bean supplier donated a batch of premium beans to the company to test whether it would be a new product that the company could sell. The open market value of the beans at the date of the donation was R150 000, and it had cost the supplier R70 000. None of the beans were sold by the end of the year of assessment and had an open market value of R145 000 at year-end. SARS was in agreement with the write-down.\n\nInsurance\nBrew & Bean insures all its business assets (including vehicles, coffee equipment, office equipment and inventory) under a comprehensive business insurance policy. The company pays a monthly premium of R65 000 which covers loss or damage to these assets.\nOn 10 November 2024, one of Brew & Bean's branded single-cab bakkies that was used for delivery was involved in an accident after dropping coffee beans off at a client. The delivery van had originally been purchased new on 1 October 2022 for R380 000.\nDue to the accident, the delivery van's left door was severely damaged and had to be replaced. The total cost to fix the vehicle amounted to R25 000, of which R18 000 related to the replacement door and R7 000 to spray painting and labour. While the van was at the mechanic, the company decided to install an upgraded tracking and security system at a cost of R15 000.\nThe insurance company paid out R20 000 as compensation for the accident.\n\nAdditional Information\n• All amounts include VAT where appropriate, unless stated otherwise or shown by the context.\n• All persons with whom Brew & Bean (Pty) Ltd transacts are VAT vendors unless stated otherwise, and all valid VAT invoices are on hand.\n• Zaid Dawood and Ibrahim Mahmood are not registered VAT vendors.\n• Interpretation Note 47, read together with BGR7, allows a four-year write-off period for all qualifying assets.\n• Brew & Bean (Pty) Ltd wishes to minimise its taxation position by taking advantage of any and all elective taxation provisions in any relevant Acts.\n• Brew & Bean (Pty) Ltd is not a Small Business Corporation as defined.\n• The manufacture of coffee machines, accessories and coffee beans is considered to be a process of manufacture.", "parts": [{"id": "1.1", "marks": 15, "required": "Calculate, with supporting reasons, the VAT and normal tax consequences of the new multifunction printer for Brew & Bean (Pty) Ltd for the 2025 year of assessment.", "memo": "1.1 Printer\nVAT\nThe sales of the coffee machine, accessories and coffe beans are taxable supplies.\nInterest income is a financial service and is therefore exempt from VAT.\nIt follows that the printer is for making both taxable supplies and exempt supplies, and therefore the input claimed on the acquisition of the printer must be apportioned\n[(58 199 800+4 879 200+1 734 000)/70 250 000] x 100  |  92,26%\nAs the taxable supplies are less than 95%, input tax needs to be apportioned\nInput VAT at acquisition\n45 000 x 15/115 x 92,26%  |  (5 415)\nOutput VAT on disposal at 100%\n30 000 x 15/115  |  3 913\nAs the output tax was charged at 100% but not the full input tax was claimed, there would be a s16(3)(h) adjustment\nSection 16(3)(h) adjustment  |  Lesser of the cost or OMV\n15/115 x 30 000 x 7,74%  |  (303)\nNormal tax\nCurrent year capital allowance - s11(e) as printer is not used directly in a process of manufacture\n((45000) - 5415)/4 x 4.5/12  |  (3 711)\nRecoupment/scrapping allowance\nProceeds limited to cost  |  (30 000 x 100/115)  |  26 086,96\nLess tax value:  |  35 570,79\nCost (45 000 - 5415)  |  39 585\nAllowances to date\n2025  |  (3 711)\nSection 16(3)(h) adjustment  |  (303)\nScrapping allowance  |  (9 484)\nCapital gains tax\nProceeds  |  26 087\nSelling price  |  26 087\nLess recoupment  |  -\nBase cost  |  26 087\nCost  |  39 585\nLess allowances:  |  Capital allowance  |  (3 711)\nScrapping allowance  |  (9 484)\nLess section s16(3)(h) adjustment  |  (303)\nCapital gain/loss  |  -\nAvailable marks\nLimited to"}, {"id": "1.2", "marks": 11, "required": "Discuss, with supporting calculations, the VAT and normal tax consequences of the factory building for Brew & Bean (Pty) Ltd for the 2025 year of assessment.\n(10 marks + 1 communication mark)", "memo": "1.2 Factory building\nVAT\nThe building was purchased from a non vendor therefore no output tax was charged, however it is a second hand good that is used 100% for taxable supplies and therefore input VAT can be claimed\nInput VAT will be claimed on the lower of consideration (R5 500 000) or OMV (R5 300 000) therefore claimed on the 5 300 000\nAs this is fixed property and second hand, the time of supply is earlier of payment or registration, deferred to registration (1 September 2024)\n1 September 2024 (date of registration)  |  (5 500 000/4 x 3 x 15/115)  |  (538 043)\n1 October 2024 (last payment)  |  (5 300 000 x 15/115) - 538 043  |  (153 261)\nNormal tax\nAs this building is used in the process of manufacture, we would claim s13(1)\nS13(1) is based on the cost less the actual VAT claimed plus transfer duty\nCost  |  5 500 000\nLess input tax  |  (691 304)\nPlus transfer duty (97 075+11% (5 500 000-2 722 500)  |  402 600\n5 211 296\nx 5%\n260 565\nCommunication mark\nAvailable marks\nLimited to"}, {"id": "1.3", "marks": 10, "required": "Calculate, with supporting reasons, the VAT and normal tax consequences for Brew & Bean (Pty) Ltd relating to the allowance for doubtful debts and the bad debts expense for the 2025 year of assessment.", "memo": "Bad debts written off and allowance for doubtful debts\n1.3 VAT consequences\nIn terms of s22(1), since a part of the consideration becomes irrecoverable, Brew & Bean will account for an input tax on the bad debts written off.\nMovement in ADD  |  (R10 475 964 - R8 380 771)  |  2 095 193\nBad debts excluding movement in ADD  |  (R10 354 666 - 2 059 193)  |  8 259 473\nInput tax deduction on actual bad debts  |  (8 259 473 x 15/100)  |  (1 077 323)\nThere are no VAT consequences on the allowances for doubtful debts amounts, as the amounts are not yet irrecoverable.\nNormal tax consequences\nOn the allowance of doubtful debt Brew & Bean will be entitled to a s11(j) deduction provided that such allowance was included in income of the taxpayer as follows:\nSection 11 (j) deduction relating to lifetime expected credit losses  |  (R10 475 964 x 20% x 40%)  |  (838 077)\nSection 11 (j) deduction relating to other  |  (R10 475 964 x 80% x 25%)  |  (2 095 193)\nThe company would need to add back the prior year s11(j) deduction  |  2 346 616\nOn the actual bad debts written off the company will be entitled to a s11(i) deduction for the bad debts that have actually being written off during the 2025 YOA provided that the amounts written off have previously\nbeen included in income which would be R8 259 473\nAvailable marks\nLimited to"}, {"id": "1.4", "marks": 10, "required": "Discuss, with supporting calculations, the VAT and normal tax consequences of the trading stock for Brew & Bean (Pty) Ltd for the 2025 year of assessment.\n(9 marks + 1 communication mark)", "memo": "1.4 Demo models\nVAT\nThe coffee machine was initially manufactured for the purposes of taxable supplies but was subsequently applied wholly for a purpose other than that initially intended (applied as a dividend in specie). This triggers a\ns18(1) change in use adjustment and the coffee machine is deemed to be supplied in terms of a taxable supply by Brew & Bean in the course of their enterprise.\nThe time of the supply is the date of the change of use on 1 March 2025\nThe value of the supply is the open market value of R20 500 which results in Output Tax of (R20 500 x 15/115 = 2 674)\nNormal tax\nGiven that the coffee machine is an asset that was manufactured by Brew&Bean and is similar to coffee machines manufactured for sale. The demo model also constitutes trading stock as on sale of this asset, the\nproceeds would usually be included in gross income in terms of para jA of the definition.\nWhen the demo model is disposed of in the form of a dividend in specie, this will trigger a s22(8) recoupment at market value (R20 500 - R2 674)\nDonations made to the company\nVAT\nThe company cannot claim any input VAT as no output was charged/no amount paid for the goods\nNormal tax\nIt is SARS practice to allow a deduction equivalent to the market value of the coffee beans on the date of donation of R150 000.\nThe stock will be included in closing stock at its market value at year end of R145 000 (i.e. the lower of the deemed cost of 150 000 and market value at year end) as SARS is in agreement with this write down.\nCommunication mark\nAvailable marks\nLimited to"}, {"id": "1.5", "marks": 10, "required": "Discuss, with supporting calculations, the VAT and normal tax consequences of the insurance note for Brew & Bean (Pty) Ltd for the 2025 year of assessment.\nIn answering this required, you do not need to deal with the capital allowances on the vehicle.\n(9 marks + 1 communication mark)", "memo": "Insurance\n1.5 VAT\nThe company will be eligible to claim input VAT (25 000 + 15 000 x 15/115 = R5217) on the costs incurred to repair the van and install the tracker\nThe company will be eligible to claim input VAT on insurance premiums paid each month (65 000 x 15/115 x 12 = 101 739)\nInsurance proceeds are a deemed supply, on which Brew & Bean will be obliged to pay output VAT (20 000 x 15/115 = 2 609)\nNormal tax\nThe insurance premiums would be deductible in terms of section 11(a) (R65 000 x 100/115 x 12) R678 261\nDamages and compensation\nIn order for an amount to be deductible in terms of s11(d), there must be damage to a subsidiary part of a whole and the intention must be to repair the\nasset.\nThe car was damaged and the door of the car was replaced which is a subsidiary part of the whole and therefore can be deducted under s11(d)\nHowever, s23 (c) prohibits the deduction of these costs to the extent that they are recoverable from the insurer.\nThe installation of the tracking system was not for damage and therefore is an improvement and not a repair.\nIt follows that only (25 000 - 20 000 = 5 000) will be deductible in terms of s11(d)\nCommunication mark\nAvailable marks\nLimited to"}]}, {"id": "Q2", "title": "Question 2 — Chiedza Bombe", "marks": 57, "scenario": "QUESTION 2  |  (57 MARKS; 91 MINUTES)\nChiedza Bombe CA(SA) is a 34-year-old who is the regional general manager at VanHuys Pty (Ltd) ('VanHuys'). She has been working there for 10 years. Chiedza is married to Ifeoma Bombe out of community of property. They have three adopted children, Maziko (16), Mzati (12) and Luke (6). Chiedza, Ifeoma and their children are all residents for South African tax purposes.\n\nVanHuys is a hotel company with multiple hotels in and around the Western Cape. The company's mission is to provide accommodation for any traveller. The company's hotel room offerings range from budget-friendly rooms to high-end suites, so anyone, regardless of budget, can enjoy the Western Cape to the fullest. The company is a category B VAT vendor with a financial year end of 31 December.\n\nVanHuys hired a new financial accountant who has recently graduated from the University of Cape Town. She has put together the following draft calculation of Chiedza's remuneration:\nNote  |  Description/Working  |  R\n1  |  Salary less medical aid contributions (R55 000 – R5 500) x 12  |  594 000\n1  |  Medical aid contributions by employer 10% x R660 000  |  66 000\n2  |  Right of use of motor vehicle (R480 000 x 85%) x 3.25% x 11 15/30  |  154 490\n3  |  Subsistence allowance R15 000 – (R1 000 x 4) – (R500 x 4)  |  9 000\n3  |  Flight tickets  |  7 000\n4  |  Right of use of laptop R20 000 x 15%  |  3 000\n5  |  Right of use of accommodation (R1 250 000 – R95 750) x 19/100 x 12/12  |  219 308\n6  |  Loan from KDB bank (5% – 3%) x R200 000 x 3/12  |  1 000\n  |  Remuneration  |  1 077 798\n\nNotes\n1. Chiedza earns a salary of R55 000 a month.\nVanHuys deducts 10% of her salary to pay for her medical aid and matches this contribution. After seeing some videos of professional skateboarder Tony Hawk, Luke decided he wanted to try doing an alpha flip (a type of skateboarding trick) himself. He attempted the trick but unfortunately broke his arm. Chiedza and Ifeoma quickly rushed him to the hospital. The medical costs amounted to R25 000. Chiedza's medical aid covered 60% of the cost, and VanHuys paid for the balance.\n\n2. Chiedza manages multiple hotels in the area and must travel between hotels often for work. VanHuys bought a VW Tiguan (with a maintenance plan) on 1 March 2023 for R480 000 and immediately granted Chiedza the right to use this car. She has had the right to use this car for the entire 2025 year of assessment.\nChiedza fell ill and was put on bed rest from 1 June to 15 June. She did not use the car during those days. Chiedza drove for a total of 46 000 kilometres for the year, 75% of this related to business travel. She incurred the following costs throughout the year: insurance of R20 000, licensing fees of R500 and fuel of R50 000.\n\n3. On 1 August 2024, Chiedza attended a hotel managers' convention in Durban. She spent 5 days and 4 nights there. VanHuys paid for her return flight, which cost R7 000. They also paid Chiedza an allowance of R15 000 to cover her accommodation, meals and incidental costs. VanHuys required that she provide proof of her expenditure after the trip, but she did not need to refund any unused amounts. Chiedza stayed with her aunt while in Durban and spent R500 per day on meals and incidentals. An average hotel room in the area would have cost R1 000 a night.\n\n4. VanHuys bought a MacBook Air that cost R20 000 on 1 March 2024 and gave Chiedza the right to use it. Chiedza will have the right to use the laptop for 5 years, which is its estimated useful life. Chiedza will use the laptop for both work and private purposes, but mainly for private purposes.\n\n5. Chiedza has an elderly grandmother who was granted the right to live in a deluxe suite owned by VanHuys for free on 1 March 2024 for the full year of assessment. The deluxe suite has an open-plan kitchen, one bedroom, a luxurious bathroom, and unobstructed views of the city. The room is fully furnished, and electricity is provided.\n\n6. VanHuys entered into an agreement with KDB Bank that allowed its employees to take out loans at an interest rate of 5%. In addition to negotiating this special rate, VanHuys will also be paying 2% of the interest on any of the loans extended to its employees. On 25 November 2024, Chiedza received an email from an Irish lawyer informing her that she had a distant great aunt who had recently passed away. This aunt had left her castle in the countryside of Carricklea, Ireland, to Chiedza. However, before the property could be transferred into her name, Chiedza would have to pay the lawyer R200 000. Overjoyed, Chiedza immediately applied for a loan from KDB bank. A loan of R200 000 was granted to her at the special interest rate on 1 December 2024. The market value of this property was R3 500 000 (correctly translated) on 1 January 2025 when it was registered in Chiedza's name. Chiedza's great aunt was not, and had never been, a resident of South Africa for tax purposes. The total loan was still outstanding at the end of the year of assessment.\n\nPageswithChi\nDuring the lockdown in 2020, Chiedza and Ifeoma reignited their love for reading. Chiedza read over 50 books in 3 months. She decided to start sharing her monthly reads on her TikTok account, PageswithChi, and quickly amassed a large following of other avid readers. In her free time, she is a \"BookTok\" influencer (a TikTok community where readers share and discuss books). She films videos sharing what she is currently reading and looking forward to reading, and will occasionally post content sponsored by brands.\n\nTo further improve the quality of her videos, on 1 September 2024, Chiedza decided to purchase a Sony Alpha A7 camera for R25 000.\n\nChiedza received gifts from various brands totalling a market value of R40 000. These gifts were given to her without there being any obligation to create content. After seeing how engaging her audience is, a local book shop, Books4Bargain, approached Chiedza to film five promotional videos for them. They gave her a script and a minimum length for the videos. Chiedza was paid R1 000 per video and also received a gift voucher of R6 000 that she could spend at Books4Bargain.\n\nOne of Chiedza's videos went viral and drove considerable traffic to Books4Bargain's website. Books4Bargain was so impressed with her work that they are considering contracting her on a more regular basis. They would like her to produce 8 TikTok videos each month for their company account. Chiedza will be given a brief on what to include in each video. She will also have to film the videos in Books4Bargain stores. Chiedza would have to submit each video to the Books4Bargain soc
