ial media manager for approval.\n\nTo celebrate their 15th wedding anniversary, Chiedza and Ifeoma decided to take a one-week trip to the Maldives. They are both adventurous and took full advantage of all the activities available on the island. While jet skiing, Chiedza got into an accident and broke her spine. Unfortunately, after a six-hour surgery, Chiedza succumbed to her injury and passed away on 28 February 2025.\n\nOn this date, Chiedza had the following assets:\nAsset  |  Notes  |  Cost  |  Market value on 28 February 2025\nRondebosch home  |  1  |  2 500 000  |  4 000 000\nShares in DateLine Ltd  |  2  |  200 000  |  480 000\nKrugerrands (gold and platinum coins)  |  3  |  60 000  |  450 000\nCarricklea property  |  3  |  3 500 000  |  3 600 000\n\nNotes\n1. This 400m² house was Chiedza and her family's primary residence. She bought the house on 1 March 2018. Chiedza's will included that the house would be left to her spouse, Ifeoma.\n2. DateLine is a company listed in both the UK and South Africa. Chiedza held 5% of the total shares. Chiedza's will stated that the shares should be sold, and the proceeds shared equally between the three children. These shares were sold by the executor of the estate for R370 000.\n3. Chiedza's will stated that the Krugerrands and Carricklea property will be left to her three children.\n4. The executor fees were R10 000.\n5. Ifeoma had taken out a domestic life policy after entering into their marriage. The policy on Chiedza's life paid out an amount of R3 000 000 to Ifeoma after her death. Ifeoma paid all the premiums relating to this policy, amounting to R900 000. Interest calculated on the premiums at 6% amounted to R146 550.\n\nAdditional information\n• All amounts are inclusive of VAT unless otherwise indicated.\n• Chiedza is not a VAT vendor.\n• Chiedza's remuneration proxy for the 2025 year of assessment is R1 250 000.\n• Chiedza had a normal tax liability correctly calculated of R250 000 for the 2025 year of assessment.\n• Interpretation Note 47, read together with BGR7, allows a four-year write-off period for all qualifying assets.\n• The official interest rate for the year of assessment is 6%.", "parts": [{"id": "2.1", "marks": 16, "required": "Review the draft remuneration calculation prepared by the financial accountant and identify all errors and/or omissions. Assume that all amounts are arithmetically correct. Present your answer in the following format:\n\nError/Omission  |  Correct treatment\ne.g. Incorrect salary amount  |  The accountant used R100 as the monthly salary instead of R200\n\nCalculations are not required.\n(15 marks + 1 mark: critical thinking)", "memo": "2.1 Error/Omission  |  Correct treatment\nChiedza's medical aid contribution is deducted from her  |  The remuneration inclusion should be the full R55 000 per month as that is\nsalary amount  |  the amount that has been received for her own benefit\nThe medical cost of R10 000 covered by the employer should be included\nMedical costs covered were omitted from the calcuation. as a fringe benefit.\nThe right of use was granted immediately after purchase so the\nDetermined value was reduced by 15%  |  determined value should not be reduced by 15%.\nChiedza still had the right to use the car, so the days should not be\nRight of use of car was apportioned for days.  |  apportioned (para 7(5))\nValue of private use should be included at 80% since Chiedza only used the\nValue of private use of the motor vehicle was included in full car 75% for business purposes.\nThere is no private benefit component as she is taking the trip for business\npurposes and thus this amount should not be included in her\nFlight cost paid was included as a taxable benefit.  |  remuneration.\nChiedza actually spent the night away, therefore the subsistence allowance\nSubsistence allowance was included in remuneration.  |  should not be included in remuneration.\nThe full cost of the laptop should be included in remuneration as Chiedza\nRight to use the laptop was included at 15%  |  will use the laptop over its useful life.\nThe C value in the residential accommodation valuation\nformula should not be 19 because the suite only has three\nrooms.  |  The value used should be 17 instead.\nThe low interest loan is calculated using the incorrect interest The rate used should be the difference between the officiall interest rate of\nrate  |  6% and the interest paid by Chiedza of 3%\nThe interest on the loan should be apportioned using days instead of\nThe low interest loan has been apportioned by months  |  90/365\nY5: Must have identified at least 2 errors\nAvailable marks\nMaximum marks"}, {"id": "2.2", "marks": 20, "required": "Starting with remuneration, calculate with brief reasons, Chiedza's taxable income for the 2025 year of assessment.\nYou may assume that the remuneration (correctly calculated) is R1 000 000.", "memo": "2.2 Item  |  Reason/ Workings  |  Amount\nRemuneration  |  Given  |  1 000 000\nRight of use of a motor vehicle  |  Correct amount included in remuneration\n480 000 x 3.25% x 12 x 80%  |  149 760  |  -149 760\nDetermined value  |  480 000\nValue of private use\n480 000 x 3.25% x 12  |  187 200\nBusiness use reduction 7th Schedule para 7(7)\n187 200 x 75%  |  -140 400\nPrivate use reduction 7th Schedule para 7(8)\nInsurance\n20 000 x 25%  |  -5 000\nLicencing\n500 x 25%  |  -125\nFuel\n(211,8c x 46 000km x 25% )/ 100  |  -24 357\nCash equivalent value  |  17 318  |  17 318\nSubsistence allowance  |  Would not have been included in remuneration\nAllowance received  |  15 000\nAccommodation  |  0\nMust use actual costs incurred for accommodation, no deemed cost reduction.\nMeals and incidentals\nActual: 500 x 5 = 2500\nDeemed: 548 x 5 = 2 740  |  -2 740\nTherefore, use deemed as it would be a higher reduction\n12 260  |  12 260\nSony Camera  |  s11(e)\n(25 000 / 4) x 6/12  |  -3 125\nGift from various brands  |  Gifts are capital in nature  |  0\nBooks4Bargain  |  Gross income definition includes amounts in cash or otherwise.\nCash received  |  5 000\nGift voucher  |  6 000\n11 000  |  11 000\nSubtotal 1  |  887 693\nDisposals on death  |  s9HA\nRondebosch home  |  Proceeds (use base cost as house is left to her spouse)  |  2 500 000\nBase cost  |  -2 500 000\nCapital gain/loss  |  0\nShares in DateLine  |  Proceeds  |  480 000\nBase cost  |  -200 000\nCapital gain/loss  |  280 000\nKrugerrands  |  Proceeds  |  450 000\nBase cost  |  -60 000\nCapital gain/loss  |  390 000\nNot personal use assets so capital gain is not disregarded.\nCarricklea castle  |  Proceeds  |  3 600 000\nBase cost (market value at inheritance plus lawyer costs) (3 500 000 + 200 0  |  -3 700 000\n-100 000\nLife insurance policy  |  Disregarded - para 55\nAggregate capital gain  |  570 000\nAnnual exclusion 300 000 ltd to actual gain  |  -300 000\nTaxable capital gain  |  270 000\n40% inclusion rate  |  108 000\nTaxable income  |  995 693\nAvailable marks\nMaximum marks"}, {"id": "2.3", "marks": 8, "required": "Calculate the estate duty payable by Chiedza's estate after her death.", "memo": "2.3 Item  |  Reason/Working  |  Amount\nProperty\nRondebosch house  |  Value is included at market value on death s5(g)  |  4 000 000\nDateLine shares  |  Value is the amount realised on liquidation of estate s5(a)  |  370 000\nKrugerrands  |  Value is included at market value on death s5(g)  |  450 000\nCarricklea property  |  Resident therefore non SA property included  |  3 600 000\nLife insurance policy  |  3 000 000 - 900 000 - 146 550  |  1 953 450\nValue of property  |  10 373 450\nReductions\nNormal tax liability  |  s4(b)  |  -250 000\nLoan owing to bank  |  s4(b)  |  -200 000\nProperty to spouse  |  s4(q) (house and life insurance)  |  -5 953 450\nProperty inherited from non-resident  |  s4(e)  |  -3 600 000\nExecutor fees  |  s4(c)  |  -10 000\nNet value of property  |  3 970 000\nAbatement  |  s4A(1)  |  -3 500 000\nDutiable amount  |  470 000\nEstate duty payable at 20%  |  94 000\nAvailable marks\nMaximum marks"}, {"id": "2.4", "marks": 6, "required": "For this question only, ignore Chiedza's death.\nDiscuss whether employees' tax should be withheld by Books4Bargain on amounts paid to Chiedza in the 2026 year of assessment. Assume that all legislation and case law applicable in the 2025 year of assessment will also apply in 2026.", "memo": "2.4 Employees tax must be withheld if the amount paid by Books4Bargain is remuneration.\nIf Chiedza is an independent contractor, the amounts paid to her would not be remuneration as defined.\nChiedza's work is subject to the supervision of the Books4Bargains social media manager.\nShe is also working mainly at Bargain4Books' premises.\nShe hasn't employed more than 3 employees who are not connected persons to her.\nThus, Chiedza is not an independent contractor and the amount received by her from Books4Bargain will be remuneration.\nBooks4Bargain will therefore have to withhold employees' tax on that amount.\nAvailable marks\nMaximum marks"}, {"id": "2.5", "marks": 7, "required": "Discuss the VAT effects for VanHuys (Pty) Ltd of the right of use of the motor vehicle given to Chiedza for the two-month VAT period ended 28 February 2025.\n(6 marks + 1 mark: integrated thinking)", "memo": "2.5 The provision of the right to use the motor vehicle is a deemed supply per s18(3) of the VAT Act.\nThe time of supply is the end of the month in which the benefit was granted, therefore the 31st of January and 28th of February 2025.\nIn calculating the consideration of this supply we must first find the determined value.\nThe determined value is R417 391 (R480 000 x 100/115).\nThe VW Tiguan is a motor car as defined and would have been input denied therefore a rate of 0.3% will be used in calculating the deemed consideration.\nChiedza does not bear any costs of maintenance or repair, therefore there will be no reduction in the consideration\nThus, consideration for each month would be R 1 252 (R417 391 x 0.3% )\nThis would result in output for the VAT period ened 28 February 2025 of R327 (R1252 x 15/115 x 2)\nX1: Must discuss at minimum the supply, time of supply, and value of supply.\nAvailable marks\nMaximum marks"}]}]}, {"id": "stacked", "title": "Stacked (Pty) Ltd — Exam Prep Scenario", "short": "Stacked", "marks": 66, "yoa": "2025", "unofficial": true, "memoNote": "Suggested solution from Studocu (has per-line marks). Not an official UCT memo, so it may contain errors. The marker is told to follow the law where the memo is clearly wrong.", "tables": "MONETARY CHANGES - 2025\nApplicable in respect of years of assessment commencing on or after 1 March 2024 (i.e.\n2025 year of assessment) – unless specifically stated otherwise\nREBATES (section 6)\nPrimary rebate increases from R16 425 to R17 235;\nSecondary rebate increases from R9 000 to R9 444;\nTertiary rebate increases from R2 997 to R3 145\nMEDICAL REBATES (section 6A)\nBenefits to the taxpayer: R364;\nBenefits to the taxpayer and one dependant: R728;\nBenefits to each additional dependant: R246\nRESIDENTIAL ACCOMMODATION (paragraph 9 of the Seventh Schedule)\nSymbol B of R91 250 increases to R95 750.\nRATES OF NORMAL TAX\n•  |  In respect of the taxable income (excluding any retirement fund lump sum\nbenefit, retirement fund lump sum withdrawal benefit or severance benefit) of natural\npersons, estates and special trusts\nTaxable Income (R)  |  Rate of Tax\n0 – 237 100  |  18% of taxable income\n237 101 – 370 500  |  42 678 + 26% of taxable income above 237 100\n370 501 – 512 800  |  77 362 + 31% of taxable income above 370 500\n512 801 – 673 000  |  121 475 + 36% of taxable income above 512 800\n673 001 – 857 900  |  179 147 + 39% of taxable income above 673 000\n857 901 – 1 817 000  |  251 258 + 41% of taxable income above 857 900\n1 817 001 and above  |  644 489 + 45% of taxable income above 1 817 000\n•  |  In respect of the taxable income of any company which qualifies as a small\nbusiness corporation as defined in section 12E of the Income Tax Act, in respect of\nany year of assessment ending any date between 1 April 2025 and 31 March 2026.\nTaxable Income (R)  |  Rate of Tax\n0 – 95 750  |  0% of taxable income\n95 751 – 365 000  |  7% of the amount above R95 750\n365 001 – 550 000  |  R18 848 + 21% of the amount above R365 000\n550 001 and above  |  R57 698 + 27% of the amount above R550 000\nTRAVEL ALLOWANCE\nWhere the value of the vehicle (R) -  |  Fixed  |  Fuel  |  Mainte\ncost  |  cost  |  nance\ncost\n(R p.a.)  |  (c/km  |  (c/km)\n)\ndoes not exceed R100 000  |  34 480  |  151.7  |  46.0\nexceeds R100 000 but does not exceed R200 000  |  61 770  |  169.4  |  57.6\nexceeds R200 000 but does not exceed R300 000  |  89 119  |  184.0  |  63.5\nexceeds R300 000 but does not exceed R400 000  |  113 436  |  197.9  |  69.3\nexceeds R400 000 but does not exceed R500 000  |  137 752  |  211.8  |  81.5\nexceeds R500 000 but does not exceed R600 000  |  163 178  |  243.0  |  95.6\nexceeds R600 000 but does not exceed R700 000  |  188 653  |  247.1  |  107.3\nexceeds R700 000 but does not exceed R800 000  |  215 447  |  251.2  |  118.9\nexceeds R800 000  |  215 447  |  251.2  |  118.9\nAlternative fixed rate for certain reimbursive travel allowances: 484 cents per kilometer\n(previously 464 cents)\nSUBSISTENCE ALLOWANCE\n• Local travel:\no  |  Allowance for incidental costs only – R169 (previously R161) for each day.\no  |  Allowance for meals and incidental costs – R548 (previously R522) for each day.\n• Overseas travel:\nActual accommodation plus a prescribed amount based on the relevant country (which\namount will be provided in the IAC if it differs from the amount listed in the Regulation in\nthe SAICA Student Handbook).\nTRANSFER DUTY (Section 2(1)(b) of the Transfer Duty Act)\nIn respect of acquisition of property on or after 1 March 2020:\nValue of property (R)  |  Rate\n0 – 1 100 000  |  0%\n1 100 001 – 1 512 500  |  3% of the value above R1 100 000\n1 512 501 – 2 117 500  |  R12 375 + 6% of the value above R1 512 500\n2 117 501 – 2 722 500  |  R48 675 + 8% of the value above R2 117 500\n2 722 501 – 12 100 000  |  R97 075 + 11% of the value above R2 722 500\n12 100 001 and above  |  R1 128 600 + 13% of the value above R12 100 000", "questions": [{"id": "Q1", "title": "Question 1 Part A — Stacked, Katherine Kaley & Olivia Battle", "marks": 66, "scenario": "STACKED  |  (66 MARKS, 99 MINUTES)\nStacked (Pty) Ltd (‘Stacked’ or ‘the company’) is Cape Town’s first authentic café and\ncrêperie1. It offers the most soft, buttery and delicious pancakes that are infinitely versatile as\na sweet or savory option; for breakfast, lunch, dinner or dessert. Stacked is a registered\nCategory C VAT Vendor and only produces taxable supplies. The company has a 30\nSeptember financial year-end.\nStacked is wholly owned by French born, Ella Rose (‘Ella’), who has lived in Cape Town for\nover 20 years. She has been a tax resident of South Africa since her initial move. Ella is a\nformer international model who has channeled her tasteful style into this French styled\ncrêperie that she also manages.\nElla goes through very rigorous recruitment processes in the hiring of all staff. This process\nensures that all staff are well suited for the café and have the necessary interpersonal skills\nand commitment required of the hospitality industry. All employees are well compensated in\nreturn for their services rendered with personalised salary structures depending on their\nspecific needs and services rendered.\nAll amounts exclude VAT, unless stated otherwise or shown by the context.\nWaiters\nStacked’s waiting staff consists of 30 employees who each work 6 hour shifts, 5 days a week.\nWaiters receive a standard R20 for each hour worked. Waiters also receive generous cash\ntips directly from customers that often make up most of their take home pay.\nOn a monthly basis, in terms of Stacked’s general company policy, an employee of the month\nis selected from their waiting staff. On 31 October 2024, Steward Watson (‘Steward’) was\nselected as the employee of the month. As the winning employee, he was offered one of\nStacked’s pancake gift set hampers, consisting of pancake mix, and a range of syrups, sauces\nand other pancake toppings. The hampers were regularly sold to Stacked’s customers for\nR450 which is the open market value. The cost to the company is R250 (including VAT) to\nprepare and assemble.\nKatherine Kaley\nKatherine Kaley (‘Katherine’) is a 47-year old South African resident and is the head chef at\nStacked. Katherine was employed when Stacked first opened its doors and has worked her\nway up to her current position.\nKatherine is in a committed long-term relationship with Olivia Battle, her best friend and\npartner. Katherine and Olivia live together in their home in Zonnebloem, Cape Town. Katherine\nand Olivia had bought their home for R1 800 000 in June 2012, which they own together in\nequal share. The couple has no children.\nKatherine earns a salary of R45 000 per month, of which she contributes 12% to the\ncompany’s provident fund. She also makes contributions to a retirement fund annuity (‘RAF’)\nof R500 per month. Katherine does not provide any proof of the RAF contributions to Stacked.\nIn addition, Katherine received a performance-linked bonus of R80 000 on 31 October 2024\nwhich was approved by the management of Stacked at the company’s 2024 financial year-\nend.\n1 A small restaurant that specializes in pancakes\nOther information relating to Katherine’s income and expenditure for the 2025 year of\nassessment is outlined below:\n1. During October 2024, Katherine was required to attend a five-day training course in\nParis, France. Katherine and her partner decided to make a holiday of this trip and so\nextended it by another 10 days. They both flew directly to Paris on an Emirates flight,\nwhich cost Stacked R13 500 for each of them. Due to the delay in booking the flights,\nStacked paid a premium of 20% on the price charged for the cheapest seat on the\nsame plane. In addition to the cost of the flight, stacked made the following payments:\n• R10 000 for five nights of hotel accommodation for Katherine only;\n• An additional allowance of R1 000 per day for five days to cover meals and\nother incidental costs.\nKatherine and her partner had to pay all remaining expenses out of Katherine’s\nallowance. They stayed in a B & B for the remaining 10 days at a cost of R1 200 per\nday and they incurred an average of R800 per day each on meals, drinks and other\nincidental costs while in Paris2.\n2. Every second year, Katherine receives an allowance of R1 500 to purchase a\ntraditional chef’s uniform that she is required to wear while at work. She does not have\nmuch flexibility as to the design of the uniform, as the uniform must consist of a hat, a\ndouble-breasted jacket, pants and an apron, all of which are sold together in one\npackage. Katherine is however given the option of purchasing a black or white uniform\nin a fit that suits her body type. She purchases standard iron-on Stacked logos\nseparately and irons them onto the individual pieces. Katherine received her most\nrecent uniform allowance on 1 June 2024.\n3. Katherine had purchased an annuity, at a cost of R650 000, on 1 October 2016 from\nRCS Investments (Pty) Ltd. In terms of the purchase agreement, Katherine was\nentitled to a monthly receipt of R12 000 over a 10-year period from the end of the\nmonth in which she had purchased the annuity. On 1 October 2024, Katherine\ncommuted this annuity to free up cash for her holiday to France. She received R180\n000 on commutation.\nOlivia.Battle\nOlivia Battle (‘Olivia’) was one of the founders and the CEO of Tutor Me 2 (Pty) Ltd (‘Tutor Me\n2’), a South African based company. On 31 December 2024, Olivia retired after reaching the\ncompany’s mandatory retirement age of 55. When Olivia and her sister incorporated the\ncompany, during 2005, they each purchased 50 000 equity shares at R1 each.\nIn terms of Olivia’s employment package,\n• Tutor Me 2 will continue to pay the monthly medical aid scheme contributions for Olivia,\nher partner and one other dependent of her choosing after her retirement.\n• Furthermore, in the event of Olivia’s death, the company will continue to pay these\ncontributions, on behalf of the living dependents.\nThe medical aid contributions for the 2025-year of assessment amounted to R3 500 per month\nfor the main member and an additional R1 300 for each additional dependent.\n2 A B &B is an establishment offering lodging and breakfast\nAs her mother’s primary caregiver, Olivia had selected her mother, Muriel, as the additional\ndependent on her medical aid. Muriel has been deaf since birth and had recently found out\nthat she was a candidate for a cochlear implant. In June 2024, she underwent surgery for this,\nfor which Olivia received an invoice addressed to her for qualifying medical expenses for an\namount of R350 000. This amount was not recoverable from the medial aid scheme. By the\nend of the 2025 year of assessment, Olivia had only paid half of the amount due.\nSadly, Olivia passed away on 31 January 2025 from an unexpected and severe allergic\nreaction to a bee sting. Olivia’s last will and testament provided as follows:\n• The interest in her home in Zonnebloem was to be bequeathed to Katherine. The\nmarket value of the full property was R3,75 million on the date of Olivia’s death.\n• The proceeds of a life insurance policy of R2 million were to go to Katherine. Olivia\nand Katherine had made contributions of R300 000 (inclusive of interest at 6%) each\ntowards this policy.\n• Olivia’s shares in Tutor Me 2 were bequeathed to her sister, Sammy, who was also\nthe co-founder of the company. Olivia’s shares had a market value of R580 000 on the\ndate of death and R590 000 on the date that Olivia’s estate was wound up.\n• A tax free saving account with a market value of R1 340 000 was bequeathed to Muriel.\nOlivia has made contributions to this account of R450 000 during her lifetime.\n• Olivia’s car was left to her niece, Kylie. The car had a market value of\nR250 000 on the date of Olivia’s death but was sold by Kylie for R200 000 soon\nthereafter. Olivia had originally purchased the car for R400 000 five years prior to her\ndeath.\nOlivia’s taxable income before taking the above information into account was R1,25 million.\nAdditional information:\n• You may assume that Euro/Rand exchange rate has been R17 throughout the 2025\nyear of assessment.\n• All persons with whom Stacked has transacted are VAT vendors unless otherwise\nindicated and all valid supporting documents required in terms of section 20 of the VAT\nAct were on hand.\n• Assume that the current tax legislation has always applied.", "parts": [{"id": "1.1", "marks": 11, "required": "Discuss, with supporting calculations, the tax consequences for both Steward Watson and Stacked (Pty) Ltd of the hamper awarded to the employee of the month for the 2025 year of assessment.\n(10 marks + 1 communication mark: clarity of expression)", "memo": "1,1 Steward Watson\nNormal Tax\nThe hamper received is a taxable benefit in terms of para 2(a) of the 7th schedule as it is an asset received for\nless than actual value  |  1\nGiven that the hamper is also Stacked's trading stock, it is valued at the lower of cost or market value.  |  1\nSteward will therefore have a para(i) inclusion of R250 in his gross income  |  1\nVAT\nAn enterprise as defined in the VAT act excludes employees who earn remunerations\nThis implies that Steward cannot be a VAT vendor and is not allowed to charge output VAT on services\nrendered to the company\nIt follows that there are no VAT consequences for Steward on the hamper awarded to him  |  1\nStacked (Pty) Ltd\nVAT\nStacked would be able to claim input VAT of (250 x 15/115 = 33) on purchase of the hampers/inputs  |  2\nWhen Stacked awards fringe benefits, generally it would be a deemed supply on which output VAT is\npayable in terms of s18(3)  |  1\nThe awarding of the hamper is however not a deemed supply as it is a supply of entertainment.  |  1\nIt follows that no output VAT is payable  |  0,5\nNormal Tax\nThe cost of the hamper excluding VAT (R250 X100/115) R217,39) will be deductible in terms of s11(a)\nwhen prepared and assembled.  |  1\nWhen the hamper is given to Steward, it would be classified as a disposal other than in the ordinary course of\nbusiness. The open market value of R450 will be recouped in terms of s22(8)  |  1\nGiven the awarding of the taxable benefit to an employee is a disposal of trading stock in the course of trade,\nthe proviso to s22(8) applies and the R450 is then deductible in terms of s11(a)  |  1\nIn terms of s22(8) the market value is recouped but in this case the open market value is equal to the market value as\nno output tax was paid\nCommunication  |  1\nAvailable 12,5\nMaximum  |  11"}, {"id": "1.2", "marks": 6, "required": "Discuss the normal tax consequences of the tips for the waiters and Stacked (Pty) Ltd.\n(5 marks + 1 communication mark: clarity of expression)", "memo": "The Tips are received by Waiters from customers for services rendered, the requirements of para (c) must\n1,2 therefore be considered  |  1\nIn order for an amount to be deemed to be received in respect of services rendered and included in the\nrecipient gross income by virtue of para (c ), there must be a causal relationship between the amount\nreceived and the waiter service.  |  1\nTipping is a well established practice in South Africa and both the customer and waiter are aware of this and\nthe fact that the manner in which the waiter/recipient renders the service has a direct impact on whether a tip is\nreceived as well as the amount thereof.  |  1\nThe tips received by waiters will be included in their gross income by virtue of para (c ) and the waiters will\nbe subject to normal tax thereon  |  1\nWhile tips may constitute remuneration as defined, Stacked will not be liable to withhold employees tax\nthereon as it is not an employer in the context of the receipt of the tips.  |  2\nCommunication  |  1\nAvailable  |  7\nMaximum  |  6"}, {"id": "1.3", "marks": 20, "required": "Calculate, with reasons, the total employees' tax that was withheld from Katherine Kaley for the year of assessment ended 28 February 2025.", "memo": "1,3 Employees Tax withheld by Stacked\nSalary - gross income para(c)  |  (45 000 x 12)  |  540 000  |  1\nBonus  |  Variable remuneration - s7B  |  80 000  |  1\n-  |  1\nHotel accommodation is a taxable benefit but has no value as Katherine is away from her usual\nplace of residence for the purposes of performing her duties of employment\nInternational Flights:\nThe Benefit granted to Olivia is deemed to be a fringe benefit (Free or Cheap service) granted to\nKatherine. The flight is zero-rated as per s11(2)(a)(ii).  |  13 500  |  1\nKatherine's international flight is not a free or cheap service as there is no private benefit  |  -  |  1\nThe subsistence allowance is not included in remuneration as Katherine has spent time away and\nused the allowance in the month it was received and is therefore excluded from the definition of\nremuneration  |  -  |  1\n>Katherine is required to wear the clearly distinguishable uniform that is purchased with the\nuniform allowance.  |  1\n>The uniform allowance is exempt in terms of s10(1)(nA) and is thus not income as defined  |  1\n> The uniform allowance is therefore not included in remuneration  |  0,5\nRemuneration  |  633 500\nActual Contribution:  |  12% x 540 000 = 64 800  |  0,5\nThe RAF contributions are not taken into account for employees tax purposes as Katherine does not\nprovide proof of these contributions to Stacked  |  0,5\nLimited to the lower of:\n> 350 000  |  0,5\n> 27.5% of remuneration =  |  174 213  |  0,5\n-  |  64 800  |  0,5\nBalance of Remuneration  |  568 700\nTax per tax tables  |  121 475 + 36% x (568 700 - 512 800)  |  141 599  |  1\nPrimary Rebate  |  -  |  17 235  |  1\nEmployees tax withheld by Stacked  |  124 364\nEmployees tax withheld by RCS investments\nMonthly Annuity receipts  |  (12 000 x 7)  |  84 000  |  1\nAnnuity receipt on commutation  |  180 000  |  0,5\ns10A\nA: 650 000\nB: 12 000 x 12 x 10 = 1 440 000\nC: 84 000\n650 000/ 1 440 000 x 84 000  |  -  |  37 917  |  1,5\nD: 650 000/1 440 000 x 12 000 x 8 x 12 = 520 000\n(650 000 - 520 000)  |  -  |  130 000  |  2\nBalance of remuneration  |  96 083\nTax per tables  |  18% x 96083  |  17 295  |  1\nPrimary Rebate  |  -  |  17 235  |  1\nEmployees tax withheld by RCS  |  60\nTotal employees tax withheld from Katherine  |  124 424\nAvailable  |  20\nMaximum  |  20"}, {"id": "1.4", "marks": 11, "required": "Calculate the taxable capital gain that would be included in Olivia Battle's taxable income at the date of her death.", "memo": "Olivia is deemed to have disposed of all of her assets (subject to certain exceptions) at market value at the date of\n1.4. her death  |  1\nPrimary residence\nProceeds (1 800 000/2)  |  900 000  |  1\nBase Cost (1 800 000/2)  |  -  |  900 000  |  1\nCapital Gain  |  -\nDeemed disposal to spouse for proceeds equivalent to Base Cost - s9HA\nS9HA does not apply to long term insurance policies  |  1\nShares\nProceeds  |  580 000\nBase Cost  |  -  |  50 000\n530 000  |  1\nTax free savings account\nProceeds  |  1 340 000\nBase cost  |  -  |  450 000\n890 000  |  1\nCapital gain on tax free savings account is disregarded in terms of s12T  |  1\nCar\nProceeds  |  250000\nBase Cost  |  -400000\n-  |  150 000  |  1\nCapital loss on the car is disregarded as it is a personal use asset  |  1\nTotals Capital Gain  |  530 000\nAnnual Exclusion  |  -  |  300 000  |  1\n230 000\n230 000 x 40%  |  92 000  |  1\nAvailable  |  11\nMaximum  |  11"}, {"id": "1.5", "marks": 11, "required": "Calculate, with reasons, the rebates that will be available to Olivia Battle in the determination of her normal tax for the 2025 year of assessment.", "memo": "1,5 Primary Rebate  |  17235 x 11/12  |  -  |  15 799  |  1\ns6A medical tax credit  |  (728 + 246) x 10 + (728 x 1)  |  -10468  |  1\nNo value placed on medical aid contributions made by Stacked on behalf of Olivia after her retirement  |  1\nNo value is placed on medical aid contributions made by Stacked on behalf of Olivia dependents after her death  |  1\nIf no value is placed on the medical aid fringe benefit, it means that it is not a \"deemed contribution\" for the taxpayer\nand therefore no s6A rebate for those months when no value\ns6B\nOlivia's mothers disability does not affect Olivia's s6B rebate as this rebate would only be affected by a disability of\nthe taxpayer, spouse or child.  |  1\nMedical aid contributions  |  (3 500 x 10) + ((1300 x 2) x 11)  |  63 600  |  2\nDeemed contribution is only what was included as a taxable benefit in Olivia's taxable income\nLess: 4 x s6A rebate  |  (4 x 10468)  |  -  |  41 872  |  1\n21 728\nAdd qualifying medical expenditure (350 000/2)  |  175 000  |  1\nLess 7.5% of taxable income  |  (1 250 000 + 63 600 +92 000) *7.5%  |  -  |  105 420  |  2\n91 308\n25%  |  1\n-  |  22 827\nAvailable  |  12\nMaximum  |  11"}, {"id": "1.6", "marks": 7, "required": "Calculate the Estate Duty that would be payable to SARS due to Olivia Battle's death.\nIn answering this question, you may assume that the normal tax payable by Olivia at the date of her death was R420 000.", "memo": "1.6. Primary residence  |  (3 750 000/2)  |  1 875 000  |  1\nLife Insurance Proceeds  |  (2 000 000 - 300 000)  |  1 700 000  |  1\nUnlisted shares  |  580 000  |  1\nTax free investment  |  1 340 000  |  0,5\nCar  |  250 000  |  1\nGross Value of the Estate  |  5 745 000\ns4(q) property bequeathed to spouse ( 1 875 000+1 700 000)  |  -  |  3 575 000  |  1\ns4(b) debts due by the deceased  |  (420 000 + 175 000)  |  -  |  595 000  |  2\nNet value of the estate  |  1 575 000\ns4A abatement  |  3 500 000 limited to  |  -  |  1 575 000  |  1\nDutiable amount  |  0\nEstate Duty  |  20%  |  0\nAvailable  |  8,5\nMaximum  |  7"}]}]}, {"id": "nov2024", "title": "November 2024 Final Exam", "short": "Nov 2024", "marks": 113, "yoa": "2024", "memoNote": "Official UCT suggested solution with per-line mark allocation.", "tables": "MONETARY CHANGES - 2024\nApplicable in respect of years of assessment commencing on or after 1 March 2023 (i.e.\n2024 year of assessment) – unless specifically stated otherwise\nREBATES (section 6)\nPrimary rebate increases from R16 425 to R17 235;\nSecondary rebate increases from R9 000 to R9 444;\nTertiary rebate increases from R2 997 to R3 145\nMEDICAL REBATES (section 6A)\nBenefits to the taxpayer: R364;\nBenefits to the taxpayer and one dependant: R728;\nBenefits to each additional dependant: R246\nRESIDENTIAL ACCOMMODATION (paragraph 9 of the Seventh Schedule)\nSymbol B of R87 300 increases to R95 750.\nRATES OF NORMAL TAX\n In respect of the taxable income (excluding any retirement fund lump sum benefit,\nretirement fund lump sum withdrawal benefit or severance benefit) of natural persons,\nestates and special trusts\nTaxable Income (R)  |  Rate of Tax\n0 – 237 100  |  18% of taxable income\n237 100 – 370 500  |  42 678 + 26% of taxable income above 237 100\n370 501 – 512 800  |  77 362 + 31% of taxable income above 370 500\n512 801 – 673 000  |  121 475 + 36% of taxable income above 512 800\n673 001 – 857 900  |  179 147 + 39% of taxable income above 673 000\n857 901 – 1 817 000  |  251 258 + 41% of taxable income above 857 900\n1 817 001 and above  |  644 489 + 45% of taxable income above 1 817 000\n In respect of the taxable income of any company which qualifies as a small business\ncorporation as defined in section 12E of the Income Tax Act, in respect of any year of\nassessment ending any date between 1 April 2023 and 31 March 2024.\nTaxable Income (R)  |  Rate of Tax\n0 – 95 750  |  0% of taxable income\n95 751 – 365 000  |  7% of the amount above R95 750\n365 001 – 550 000  |  R18 848 + 21% of the amount above R365 000\n550 001 and above  |  R57 698 + 27% of the amount above R550 000\nTRAVEL ALLOWANCE\nWhere the value of the vehicle (R) -  |  Fixed cost  |  Fuel  |  Maintenanc\ncost  |  e cost\n(R p.a.)  |  (c/km)\n(c/km)\ndoes not exceed R100 000  |  33 760  |  141.5  |  43.8\nexceeds R100 000 but does not exceed R200 000  |  60 329  |  158.0  |  54.8\nexceeds R200 000 but does not exceed R300 000  |  86 958  |  171.7  |  60.4\nexceeds R300 000 but does not exceed R400 000  |  110 554  |  184.6  |  65.9\nexceeds R400 000 but does not exceed R500 000  |  134 150  |  197.6  |  77.5\nexceeds R500 000 but does not exceed R600 000  |  158 856  |  226.6  |  91.0\nexceeds R600 000 but does not exceed R700 000  |  183 611  |  230.5  |  102.1\nexceeds R700 000 but does not exceed R800 000  |  209 685  |  234.3  |  113.1\nexceeds R800 000  |  209 685  |  234.3  |  113.1\nAlternative fixed rate for certain reimbursive travel allowances: 464 cents per kilometer\n(previously 418 cents)\nSUBSISTENCE ALLOWANCE\n Local travel:\no  |  Allowance for incidental costs only – R161 (previously R152) for each day.\no  |  Allowance for meals and incidental costs – R522 (previously R493) for each day.\n Overseas travel:\no  |  Actual accommodation plus a prescribed amount based on the relevant country\n(which amount will be provided in the ITC if it differs from the amount listed in the\nRegulation in the SAICA Student Handbook).\nTRANSFER DUTY (Section 2(1)(b) of the Transfer Duty Act)\nIn respect of acquisition of property on or after 1 March 2020:\nValue of property (R)  |  Rate\n0 – 1 100 000  |  0%\n1 100 001 – 1 512 500  |  3% of the value above R1 100 000\n1 512 501 – 2 117 500  |  R12 375 + 6% of the value above R1 512 500\n2 117 501 – 2 722 500  |  R48 675 + 8% of the value above R2 117 500\n2 722 501 – 12 100 000  |  R97 075 + 11% of the value above R2 722 500\n12 100 001 and above  |  R1 128 600 + 13% of the value above R12 100 000", "questions": [{"id": "Q1A", "title": "Question 1 Part A — ClutterClear Solutions (Pty) Ltd", "marks": 44, "scenario": "QUESTION 1  |  (72 MARKS; 115 MINUTES)\nThis question consists of two parts\nPart A\nClutterClear Solutions (Pty) Ltd (‘ClutterClear’ or ‘the company’) is a professional home organisation\ncompany that specialises in decluttering and optimising spaces for both residential and commercial\nclients. It is a South African company and a registered category B VAT vendor. The company was\nfounded in 2015 by two friends, Amanda Ngidi (age 45) and Tshifhiwa Malange (age 47), who both\nhave a passion for creating functional, aesthetically pleasing environments. Amanda and Tshifhiwa\neach hold 50% of the shares in the company.\nThe company offers a range of services including personalised consultations, hands-on organising\nand the sale of customised storage solutions. With a growing client base and a reputation for\ntransforming untidy spaces into orderly, stress-free environments, the company has expanded its\noperations nationally.\nThe company has a financial year ending 31 December and has already calculated its taxable income\nfor the current year of assessment to be R263 000 and its taxable supplies to be R550 000. However,\nit has a number of outstanding transactions detailed below for finalisation and advice thereon which\nhave not yet been taken into account in the calculation of the taxable income and taxable supplies\nabove.\nRecall and rebranding\nDuring the current year of assessment, the company launched a new line of branded storage\ncontainers. However, due to a labeling error, the containers were branded with incorrect weight\ncapacity limits. This mistake posed a risk to customers, as the containers could be overloaded and\npotentially be broken. To mitigate the risk, the company decided to recall the faulty containers and\nreplace them with correctly labeled ones. The recall and rebranding came at a significant cost of\nR1 300 000 to the company during the current year of assessment, which included costs such as\nprinting new labels, shipping the recalled containers back to the warehouse, disposal of the faulty\ncontainers and replacing the faulty containers.\nTheft of motor vehicle\nOn 1 August 2024, one of the delivery vehicles was stolen while parked outside after making a\ndelivery. It was a single-cab delivery vehicle that was purchased on 1 July 2022. It was purchased\nnew at a cost of R362 900 when the open market value was R360 000. The single-cab bakkie was\ninsured and the insurance paid out an amount of R365 000. While this amount was used to purchase\na new double-cab light delivery vehicle, the company had to pay in extra as the cost of the double-\ncab light delivery vehicle was R400 000 (which was equal to the open market value). The new bakkie\nwas bought and brought into use on 1 September 2024.\nServices provided to shareholders\nAmanda and Tshifhiwa have never used the services of the company in their own homes as they\nwere always able to keep their own homes organised and decluttered. However, Amanda has moved\nhomes and does not have time to do all the organisation herself. She has used the services of the\ncompany. Tshifhiwa has said that the company will do it at no charge. However, Amanda wants to\npay to avoid any negative tax consequences. She paid R10 000 for the service, when it would usually\nbe charged R50 000, due to the size of her house and the number of rooms she wants organised.\nThe service was provided in August 2024.\nExpansion into other countries\nClutterClear has received an enquiry from a potential client in Namibia who is not a resident of South\nAfrica to provide consulting services on their home in Namibia. The company is considering this option\nand if it works out, it will also consider expanding its business internationally to more clients and more\ncountries. This will be accomplished by exporting its line of storage containers to various countries\nand offering virtual home organisation consultations to clients located outside of South Africa.\nBefore it enters into this transaction with the client in Namibia, the company must assess the tax\nconsequences of the transaction.\nThe company is deciding whether one of its employees will go over to Namibia and provide the service\nor to provide the services virtually from South Africa by doing a Zoom call where they can see the\nclients home and advise over Zoom.\nAdditional Information\n All amounts include VAT where appropriate, unless stated otherwise or shown by the context.\n All persons with whom ClutterClear Solutions (Pty) Ltd transacts with are VAT vendors unless\nstated otherwise and all valid VAT invoices are on hand.\n Amanda Ngidi and Tshifhiwa Malange are not registered VAT vendors\n Interpretation Note 47, read together with BGR7, allows a four-year write-off period for all\nqualifying assets.\n ClutterClear Solutions (Pty) Ltd wishes to minimize its taxation position by taking advantage\nof any and all elective taxation provisions in any relevant Acts.\n ClutterClear Solutions (Pty) Ltd is not a Small Business Corporation as defined.\n ClutterClear Solutions (Pty) Ltd does not carry on a process of manufacture.", "parts": [{"id": "1.1", "marks": 8, "required": "Write a memorandum to the financial director of ClutterClear Solutions (Pty) Ltd discussing whether the recall and rebranding expenses will be deductible for ClutterClear Solutions (Pty) Ltd for its year of assessment ending 31 December 2024.\n(7 marks + 1 communication mark: layout and structure)", "memo": "To: The Financial Director, ClutterClear\nSolutions (Pty) Ltd\nFrom: A Tax Consultant\nRe: Deductibility of recall and rebranding\n1.1 expenses\nIn order for the amount to be deductible, it must meet s11(a) read together with s23(g)  |  1\nThe onus is on the taxpayer Clutter Clear (Pty) Ltd to prove the recall and rebranding expenses is deductible  |  1\nThe issues are whether this amount paid is in the production of income and not of a capital nature  |  1\nExpenditure is in the production of income if it is an inevitable concomitant or if the action that gave rise to the expenditure is closely connected to the operations of the business  |  1\nThe action that gave rise to the expenditure is the labelling error of a product and the operations of the business is the selling of containers so it is closely connected  |  1\nTherefore it is in the production of income\nExpenditure is capital in nature where it creates an enduring benefit or adds to the income earning structure of the business.  |  1\nOne could argue that by incurring these costs now, you are protecting the company's reputation which would have an enduring benefit/once off expense.\nAlt: Company could argue that these expenses are part of the operating expenses therefore revenue in nature  |  1\nTherefore capital in nature and does not meet s11(a) and can't be deducted  |  1\nAlt: Therefore revenue in nature and does meet s11(a) and can be deducted\nCommunication mark  |  1\nAvailable  |  9\nLimited  |  8"}, {"id": "1.2", "marks": 15, "required": "Calculate, with supporting reasons, the normal tax effects of the single cab delivery vehicle and the double cab light delivery vehicle for the year of assessment ending 31 December 2024.", "memo": "1.2 Current year capital allowance\ns11(e) - the bakkie was used by the company for its trade\nFor the 2024 year of assessment, the capital allowance would be based on the lower of cost or market value\nThe single - cab bakkie is not a motor car as defined and therefore on acquisition the company would have claimed input tax of R47 334,78 (362 900 x 15/115)  |  1\nCost  |  (362 900 - 47 334,78)  |  315 565,22  |  0,5\nMarket value  |  (360 000 - 47 334,78)  |  312 665,22  |  0,5\nCapital allowance for the current year will be 312 665,22/4 x 7/12  |  45 597,01  |  1\nRecoupment/scrapping allowance\nProceeds (365 000 x 100/115)  |  317 391\nLimited to the cost that allowances  |  1\nwere based on  |  312 665\nLess: Tax value  |  149 819\nCost that allowances were based on  |  312 665  |  0,5\n2022\n(312665,22/4 * 6/12)  |  39 083  |  0,5\n2023\n(312665,22/4)  |  78 166  |  0,5\n2024  |  45 597  |  0,5\nRecoupment  |  162 846\nCGT  |  Proceeds as defined  |  154 545\nProceeds (365 000 x 100/115)  |  317 391  |  0,5\nLess recoupment  |  162 846  |  0,5\nBase cost as defined  |  152 718,75\nActual cost  |  315 565,22  |  1\nLess allowances:  |  162 846  |  0,5\nCapital gain  |  1 826,08\nAs this was an involuntary disposal, para 65 could apply. The bakkie was stolen, proceeds of R365 000 were received from the insurance by way of compensation, the proceeds (as\nabove) exceed the base cost, an amount equal to the proceeds was used to buy a replacement asset, the replacement asset was bought within 12 months (one month) and brought\ninto use within three years (one month).  |  3\nTherefore the recoupment and capital gain will be deferred in line with the new bakkie.\nNew bakkie capital allowance\nThe double - cab bakkie is a motor car as defined and therefore on acquisition the company would not be able to claim input tax  |  1\nCapital allowance for the current year will be 400 000/4 x 4/12  |  33 333,33  |  1\nThe recoupment included in the current year would be (162 846 x 33 333,33/400 000)  |  13 570,54  |  1\nThe capital gain to be aggregated with other capital gains/losses would be (1 826,08 x 33 333/400 000)  |  152,17  |  1\nAvailable  |  15,5\nLimited  |  15"}, {"id": "1.3", "marks": 7, "required": "Discuss the VAT consequences for ClutterClear Solutions (Pty) Ltd for the service provided to Amanda on the organising of her home.", "memo": "1.3 Supply\nThe organisation services is a supply of goods/services by a vendor and therefore is a taxable supply.  |  1\nValue of supply\nThe supply is made to a connected person as Amanda owns 50% of the shares in the company (i.e more than 10%)  |  1\nThe services are provided at less than the market value as Amanda only paid R10 000 but the service would usually be R50 000  |  1\nAmanda is not a VAT vendor and therefore would not be able to claim any input tax  |  1\nTherefore connected person rule applies and VAT would be charged on the open market value of R50 000  |  1\nOutput tax would be R50 000 x 15/115 = R6 522  |  1\nTime of supply\nThe time of supply would be when the services are rendered which is August 2024.  |  1\nAvailable  |  7\nLimited  |  7"}, {"id": "1.4", "marks": 8, "required": "Discuss whether there will be normal tax and VAT consequences on the goods sold outside South Africa and the services provided outside South Africa for ClutterClear Solutions (Pty) Ltd.\nAdditionally, briefly explain to ClutterClear Solutions (Pty) Ltd whether there will be any difference on the VAT consequences if the company provides the services from South Africa or in Namibia.\nIn answering this question, you may assume that the 2024 legislation remains the same for the 2025 year of assessment. You can ignore any double tax agreements.\n(7 marks + 1 communication mark: logical argument)", "memo": "1.4 Normal tax\nClutterClear (Pty) Ltd is a South African resident and therefore taxed on its worldwide income.  |  1\nWhether the goods/services are sold/provided in South Africa or outside, the company will include it in its gross income.  |  1\nVAT\nThe sale of the storage containers and the consulting services is a supply of goods/services by a vendor and therefore is a taxable supply.  |  1\nThe sale of the storage containers however is an exported good and will be zero rated  |  1\nIf the company provides the consultation services in Namibia, this is services rendered physically outside South Africa and will be zero rated in terms of s11(2)(k)  |  1\nIf the consultation services are rendered in the Republic to the customers in Namibia (non- resident) and the services do not relate to land or movable property situated in South  |  1\nAfrica then it would be zero rated (this is subject to the provisos)\nTherefore in both cases, the services would be exported services and zero rated therefore no difference in the VAT consequences for either option  |  1\nCommunication mark  |  1\nAvailable  |  8\nLimited  |  8"}, {"id": "1.5", "marks": 6, "required": "While ClutterClear Solutions (Pty) Ltd is a registered category B VAT vendor, discuss whether they would be allowed to, and whether they would want to, deregister for VAT purposes.\n(5 marks + 1 communication mark: logical argument)", "memo": "1.5 ClutterClear Solutions has taxable supplies of R550 000 before the additional transactions  |  1\nIn adding the additional taxable supplies of the insurance proceeds and service provided to Amanda, the taxable supplies increase to R965 000 (R550 000 + R365 000 + R50 000)  |  1\nTherefore the total taxable supplies is less than R1m and ClutterClear could deregister as a VAT vendor  |  1\nHowever Clutter Clear should consider that there are very important business reasons as to why they should stay registered as a VAT vendor, such as:\n- Clients needing them to be VAT vendors so that they can claim input tax  |  1\n- If they are to start exporting, it means that they will pay output tax of zero percent but they would be able to claim input tax on their costs incurred on the goods and services that 1\nthey export\nAny other valid reason\nCommunication mark  |  1\nAvailable  |  6\nLimited  |  6"}]}, {"id": "Q1B", "title": "Question 1 Part B — Tshifhiwa Malange (ignore VAT)", "marks": 28, "scenario": "Part B\n(Ignore VAT)\nTshifhiwa Malange recently heard on the radio that it was “The Wills Week Campaign” in South\nAfrica where free will drafting services are offered to the public to ensure that individuals can\nsafeguard their estate and ensure that their assets are properly managed and distributed after\ndeath.\nTshifhiwa has been married to her husband out of community of property since 2002, and they have\ntwo children, aged 20 and 17, so she wanted to make sure that if anything happens to her, her\nfamily will be taken care of. She decided to make an appointment to draft her will and also get some\nadvice on any estate planning that she should consider.\nAfter meeting with the consultant, she decided to donate some of her assets to her family. On 1 July\n2024, Tshifhiwa made the following donations. Prior to this, she has never donated anything before.\n She donated her Toyota Corolla to her oldest child so that he had a car to get to university\nand not have to rely on her or her husband to drop him off. She had bought the car in 2019\nfor R350 000 and the car had a market value of R200 000 on the date of the donation.\n She donated an apartment situated in Zimbabwe to her children in equal shares. She had\ninherited the apartment from her late father (who was a resident of Zimbabwe) when he\npassed away in 2005. He had purchased the apartment in 2002 for R1 300 000. When she\ninherited it, the apartment had a market value of R1 500 000 (correctly translated) and at the\ndate that she donated it, the value had increased to R3 200 000.\n She donated her old laptop that she used for personal emails and watching series to a local\norphanage, a registered Public Benefit Organisation. She bought the laptop for R12 500 in\n2020 and at the date of the donation it was worth R8 000.\n She donated her collection of Kruger Rands worth R450 000 which she bought in 2014 for\nR340 000 to her mother.\nOn 15 October 2024, Tshifhiwa was involved in a fatal accident on her way home from work. The\nfollowing information relates to her estate:\n Amanda Ngidi had taken out an insurance policy on Tshifhiwa’s life so that, in the event of\nher death, she could buy out Tshifhiwa’s shares in ClutterClear (Pty) Ltd. The policy paid out\nR1 000 000 to Amanda. Amanda had made all the contributions of R300 000 (inclusive of\ninterest at 6% of R54 455) towards this policy and Tshifhiwa had never made any\ncontributions.\n The shares in ClutterClear (Pty) Ltd were to be sold to Amanda during the course of\nliquidation of the deceased estate. The shares had a market value of R1 800 000 at death\nand were sold to Amanda for R1 600 000.\n Tshifhiwa and her husband took out a domestic life policy after entering into their marriage.\nThe policy on her life paid out an amount of R3 000 000 to her husband after her death. Her\nhusband paid all the premiums relating to this policy, amounting to R500 000. Interest\ncalculated on the premiums at 6% amounted to R81 417.\n Her primary residence, that she and her family had been living in for the past few years\nwhich was in Claremont Cape Town, was left to her husband. Tshifhiwa bought the house in\n2012 for R2 500 000 and at the date of her death it was valued at R5 600 000.\n Her holiday home in Langebaan, Western Cape, was to be sold and the proceeds split\nequally between her two children. Tshifhiwa bought the house in 2017 for R3 200 000 and at\nthe date of her death it was valued at R4 200 000. The executor sold it for R2 500 000 in the\ncourse of liquidation of her estate.\n The executor of Tshifhiwa’s estate paid out the following expenses out of the cash in the\nestate:\no South African debts due\n Normal tax owing at the date of death – R437 550\n Donations tax owing at the date of death – R70 000\no Deathbed and Funeral expenses – R90 000\no Executor and Valuator fees – R170 000", "parts": [{"id": "1.6", "marks": 18, "required": "Discuss, with supporting calculations, the tax consequences of the items that Tshifhiwa Malange donated during the current year of assessment.\nIn answering this question, you do not have to include when the tax is payable. You can also assume that these are the only disposals she made in the current year.\n(17 marks + 1 communication mark: logical argument)", "memo": "Part B\n2 Car\nThe donation of the car is for the maintenance of her son and therefore would be exempt in terms of section 56(2)(c)  |  1\nThe car disposal results in a capital loss of R150 000 (200 000-350 000)  |  1\nHowever the disposal of the car is a disposal of a personal use asset and therefore disregarded for CGT  |  1\nApartment in Zimbabwe\nThe donation of the apartment in Zimbabwe is exempt from donations tax in terms of section 56(1)(g)(ii) as it was inherited from her father who is a non-resident  |  1\nThe disposal of the apartment will result in CGT as she is a resident and therefore taxed on her worldwide disposal of property  |  1\nThe proceeds will be the market value at the date of the donation which is R3 200 000.  |  0,5\nThe base cost will be the market value on the date that she inherited it which was R1 500 000.  |  0,5\nTherefore she has a capital gain of R1 700 000 on the apartment\nLaptop\nThe donation of the laptop is exempt in terms of section 56(1)(h) as it was donated to a PBO  |  1\nThe disposal of the laptop results in a capital loss of R4 500 (8 000 - 12 500)  |  1\nThe disposal of the laptop is disposed to a PBO therefore disregarded for CGT (para 62)/personal use asset  |  1\nAs she has made a donation to a PBO, she will get a deduction of the fair market value (R8 000) limited to 10% of her taxable income  |  1\nKruger Rands\nThe donation of the Kruger Rands is not specifically exempt and therefore will be included at the market value of R450 000  |  1\nShe will be able to use the general exemption of R100 000 against this donation  |  1\nShe will therefore pay donations tax of (450 000 - 100 000) x 20%  |  70 000  |  1\nThe proceeds on the disposal of the Kruger Rand will be R450 000  |  0,5\nThe base cost is the cost that she purchased it for of R340 000 plus an adjustment for the donations tax  |  0,5\nDonations tax adjustment  |  (450 000 - 340 000)/450 000 x 70 000  |  17 111  |  2\nTherefore she has a capital gain of R92 889\nAs she is an individual, she will get an annual exclusion of R300 000 which results in a net capital gain of (1 700 000 + 92 889 - 300 000)  |  1492889 1\nThis will be included in her taxable income at 40% (1 492 889 *40%)  |  597 156  |  1\nCommunication mark  |  1\nAvailable  |  19\nLimited  |  18"}, {"id": "1.7", "marks": 10, "required": "Calculate, with supporting reasons, the Estate Duty that would be payable to SARS due to Tshifhiwa Malange's death.\nIn answering this question, you can ignore capital gains tax consequences.", "memo": "2 Item  |  Reasons  |  R\nProperty\nExcluded - taken out by co-shareholder\nand none of the premiums were paid by\ndeceased and it was taken out to\npurchase the deceased shares in the\nInsurance policy (taken out by co-shareholder) company  |  0  |  1\nUnlisted shares in ClutterClear  |  Always at fair market value  |  1 800 000  |  1\nInsurance policy (deemed property)  |  (3 000 000 - 500 000 - 81417)  |  2 418 583  |  1\nPrimary residence  |  The value is the fair market value  |  5 600 000  |  1\nHoliday home  |  Sold therefore use selling price  |  2 500 000  |  1\nGross Value of Estate  |  12 318 583\nLess Deductions:\nNormal tax liability  |  s4(b)  |  -437 550  |  0,5\nDonations tax  |  s4(b)  |  -70 000  |  0,5\nDeathbed and funeral expenses  |  s4(a)  |  -90 000  |  0,5\nExecutor fees  |  S4(c)  |  -170 000  |  0,5\ns4(q)- the property accrues to the\nInsurance policy (deemed property) and  |  surviving spouse (2 418 583 + 5 600\nprimary residence  |  000)  |  -8 018 583  |  1\nNet Value of Estate  |  3 532 450\nLess: Abatement  |  -3 500 000  |  1\nDutiable Amount of the Estate  |  32 450\nEstate Duty  |  20% x 32 450  |  6 490  |  1\nAvailable  |  10\nLimited  |  10"}]}, {"id": "Q2", "title": "Question 2 — Saarah Williams / ModestChic Designs", "marks": 41, "scenario": "QUESTION 2  |  (41 MARKS; 65 MINUTES)\nSaarah Williams, aged 45, is a South African resident who has been employed as a departmental\nmanager at the University in Cape Town (UCT). Saarah started working for this department in 2007\nas an administrative assistant and has worked her way up to departmental manager. Saarah is\nmarried out of community of property to Steven Williams and they have three children.\nThe following information is relevant to Saarah’s employment at UCT for the 2024 year of assessment:\nDetails  |  Monthly amount\nSalary  |  R52 000\nAllowance\n One of the roles of being departmental manager is managing and R5 000\noverseeing all the administrative staff. Once a month, Saarah is\nresponsible for doing something special for the administrative staff\nto show that they are appreciated. This could include going for\nlunch or doing team-building activities on or off campus.\n In terms of her employment contract, she is required to organise\nthese activities and let the head of department know in advance\nwhat activity she is planning, provide a budget and then to account\nfor the activity after the activity has taken place.\n During the current year of assessment, Saarah spent a total of\nR57 500 on these activities, she provided the receipts to the head\nof department and refunded the amount that she did not spend.\nWatch\n In the current year, UCT gave all employees who have been\nworking at the university for more than 10 years an Apple watch.\nSaarah received one as she has been working at the university ?\nsince 2007. This was the first time that she had received a gift like\nthis.\n The watches were bought by UCT for the employees at a cost of\nR7 500 each. This amount is after UCT received a bulk discount\non purchase. The watch is usually sold for R8 500.\nMembership of medical aid fund\n All employees are required to be a part of the DiscoverMe Medical\nAid Fund unless they are on their spouse’s medical aid  |  R5 500\n Saarah’s contributions covered her, Steven and their children for\nthe year\n UCT matches employee contributions in a ratio of 1:1\nSanlam pension fund contributions\n Employees are required to belong to UCT’s pension fund  |  R4 500\n The university matches employees’ contributions in a ratio of 1:1\nRental of apartment\n Saarah’s house was damaged during a storm; her bedroom and\nher kids’ bedrooms were flooded and they had to move out for one\nmonth while it was being repaired.  |  ?\n To accommodate Saarah and her family, UCT rented a three-\nbedroom furnished apartment in Rondebosch for R18 000 for the\nmonth and allowed Saarah and her family to stay in the apartment\nrent free. The rent paid by the employer included the costs of water\nand electricity supplied to the apartment.\nFurther studies\n UCT allows employees, their spouses or their children to study for ?\nfree at the University\n Saarah’s oldest child started studying law at the university this\nyear. The tuition fee is usually R50 000 for first year.\nModestChic Designs\nSaarah has always had a passion for sewing and when she could not find affordable modest\nclothing in the shops, she decided to start sewing and making her own clothing. More and more\npeople started asking her where she buys her clothes and thereafter, family and friends encouraged\nher to start her own clothing line. She launched her business as a sole proprietor, ModestChic\nDesigns in 2022 and it has been growing since then. She is a registered category B VAT vendor.\nFor the current year of assessment, she had gross income and tax-deductible expenditure of\nR960 000 and R435 000 respectively, before taking the below into account:\n1. On 1 August 2022, she bought a sewing machine from her friend (who is a non-vendor) for\nR6 500 and brought it into use on that date. As she bought it from her friend, her friend sold\nit to her for less than its open market value of R8 000. The sewing machine was in good\ncondition and Saarah is still using the same sewing machine to date.\n2. Due to the demand of her clothes increasing, she was not able to do everything alone as she\nwas also employed on a full time basis at another job. She has hired one employee, to assist\nher with the administration such as taking orders, packing the orders and shipping the orders\nhowever she still does the actual sewing herself at night and on the weekends. She pays the\nemployee R7 500 per month.\n3. When she opened the business, she turned the guest room of her house into her sewing\nroom. She equipped the guest room with two desks, one she uses for designing and cutting\nher patterns and the other she uses for her sewing machine. She hired a carpenter to put in\nbuilt in cupboards where she can store the finished items before they get shipped. She has\nall her fabric and cutting tools in the room. She has an iron and ironing board to press seams\nand finish garments. She only uses this room for her sewing business. All this equipment\nhas already been taken into account in the tax-deductible expenditure above. This room\naccounts for 25% of her house. Luckily this room was not damaged in the storm and Saarah\ncould continue using it during the time they moved out of their home.\n4. She incurs the following expenses relating to her home and family:\n Instalment on her home mortgage (R14 230.33 per month of which R10 946.11\nrelates to interest).\n Water and electricity (R7 500 per month).\n Petrol expenses (R5 000 per month which is for dropping the kids at school, fetching\nthe kids from school, going to do shopping and outings on the weekends).\n Going out for family suppers once a week (R3 000 per month).\n Everything else relating to her home and family are paid by her husband.\nSaarah was recently chatting to a friend who told her that she should take advantage of certain\nexpenditure and “write it off” as tax deductions in her business to lower her taxable income. Her\nfriend said she should deduct all the expenses and disguise it as business expenses as SARS\nwould never know. Saarah does not know much about tax but to her, this did not sound right and so\nshe has approached you as a tax consultant to ask whether she is allowed to do this.\nGrowth of her business\nEffective 1 March 2024, Saarah resigned from her job at UCT to focus on growing ModestChic\nDesigns. She needed bigger premises from which to operate. She saw a property on Prop25 that\nwould be suitable. The rental for the property is R15 000 per month (excluding VAT). She has\nmoney saved up and the agent has agreed that she will get a discount of R500 per month\n(excluding VAT) if she pays upfront for the first year.\nShe entered into the lease agreement on 1 November 2024 for 10 years and paid the full amount\nfor one year of R174 000 on 1 November 2024. She will need to perform a few improvements to\nmake the property suitable for her and this has been approved by inclusion in the lease agreement.\nThe landlord and her have agreed on improvements of R150 000 (excluding VAT). The\nimprovements were completed on 1 December 2024 at a cost of R170 000.\nAdditional Information\n All amounts include VAT where appropriate, unless stated otherwise or shown by the context.\n All persons with whom Saarah Williams transacts with are VAT vendors unless stated\notherwise and all valid VAT invoices are on hand.\n Interpretation Note 47, read together with BGR7, allows a four-year write off period for all\nqualifying assets.\n Saarah wishes to minimize her taxation position by taking advantage of any and all elective\ntaxation provisions in any relevant Acts.\n Sewing of clothes is not considered a process of manufacture by SARS.\n Saarah’s remuneration proxy for the 2024 year of assessment is R560 000.", "parts": [{"id": "2.1", "marks": 7, "required": "Explain to Saarah Williams, using taxation legislation in the Income Tax Act No. 58 of 1962, whether the statement from her friend is true and whether or not she will be able to deduct those expenses.\n(6 marks + 1 communication mark: logical argument)", "memo": "2.1 In order for a taxpayer to get deductions, the taxpayer needs to be carrying on a trade. Those deductions need to meet s11(a) read together with s23 or a specific deduction  |  1\nSection 23(a)/(b) disallows the deduction of any costs incurred in relation to private expenses.  |  1\nSection 23(b) has a proviso that states if a part of the premises is specifically equipped for trade and regularly and exclusively used for trade then the taxpayer can get a deduction for  |  1\nthat part\nAs she has turned her guest room into her sewing room and it is equipped with everything she needs to carry on with her trade and she uses it every night and every weekend only for  |  1\nher trade, she can get a deduction for the 25% of some of her expenses\nInstallment on her home mortgage - only the interest part can be deducted (10 946.11 x 25% x 12)  |  R32 838.33  |  1\nThe other portion of the loan is not deductible as it is capital in nature  |  1\nWater and electricity - 25% can be deducted (7 500 x 12 x 25%)  |  R22 500  |  1\nThe statement by her friend is therefore not true and if Saarah goes ahead with deducting the expenses and disguising it as business expenses, she will be committing tax evasion\nwhich is illegal and unethical.  |  1\nCommunication mark  |  1\nAvailable  |  9\nLimited  |  7"}, {"id": "2.2", "marks": 22, "required": "Calculate, with reasons, Saarah Williams' taxable income for the 2024 year of assessment.", "memo": "2.2 Salary  |  Gross income - para(c)/special inclusio (52000 x 12)  |  624 000 1\nEntertainment allowance  |  Actual amount received (5000 x 12)  |  60 000\nAmount accounted for  |  (57 500)\nAmount refunded  |  (2 500)\n-  |  -  |  1\nShe was instructed by her employer, was required to provide proof and provided the proof  |  1\nWatch  |  Asset acquisition at less than actual value - gross income - para (i)\nBought specifically for employee therefore use cost  |  7 500  |  1\nLong service award reduction - she has worked for more than 15 years  |  (5 000)  |  1\n2 500  |  2 500\nMedical aid contributions  |  Gross income - para (i)  |  (5 500 x 12)  |  66 000 1\nPension fund contributions  |  Gross income - para (i)  |  (4 500 x 12)  |  54 000 1\nRight of use of residential accomodation Gross income - para (i)\nRented by the employer therefore use\nthe lower of:\n-Rent costs paid by employer  |  18 000  |  0,5\n-Formula  |  (A-B) x C/100 x D/12  |  7 351  |  7 351\nA: Remuneration proxy - given  |  560 000  |  0,5\nB:  |  95 750  |  0,5\nC:  |  19  |  0,5\nD:  |  1  |  0,5\nBursary - free or cheap services  |  Gross income - para (i)  |  50 000  |  1\nIncluded in her gross income as it is a benefit received by her relative due to her employement  |  1\nBursary exemption  |  Remuneration proxy (560 000) is less than R600 000 and university level 60 000 limited to inclusion  |  (50 000)  |  1,5\nGross income from side trade  |  960 000  |  0,5\nTax-deductible expenditure from side trade  |  (435 000)  |  0,5\nSewing machine - s11(e)  |  Input VAT - second hand goods rule (lower of cost or OMV)  |  0,5\n(6 500 x 15/115)  |  847,83  |  1\nR5 652 (R6 500 - 847.83) - small asset (less than R7 000) therefore fully deducted in 2023 YOA  |  -  |  1\nEmployee salary  |  s11(a)  |  (7500 x 12)  |  (90 000) 1\nDeductions from 2.1  |  (R32838,33+22500)  |  (55 338) 0,5\nTaxable income before s11F  |  1 133 512\nSection 11F\nActual contributions (4 500 x 2 x 12)  |  108 000  |  (108 000) 0,5\nLimited to the lower of:\n-350 000  |  0,5\n-27.5% of the higher of:  |  311 716\n-Taxable income  |  1 133 512  |  0,5\n-Remuneration  |  753 851  |  2,5\n(624 000 + 2 500 + 66 000 + 54 000 + 7 422 )\nTaxable income  |  1 133 512  |  0,5\nTherefore fully deducted\nTaxable income  |  1 025 512\nAvailable  |  22,5\nLimited  |  22"}, {"id": "2.3", "marks": 12, "required": "Discuss, with supporting calculations, the normal tax effects of Saarah Williams entering into the lease agreement for the new property for her year of assessment ending 28 February 2025.\nIn answering this question, you may assume that the 2024 legislation remains the same for the 2025 year of assessment.\n(11 marks + 1 communication mark: logical argument)", "memo": "2.3 Lease\nThe rental amount of R14 500 per month is deductible under section 11(a) as it is used for her trade and meets the requirements of s11(a)  |  1\nHowever it has been prepaid and therefore we need to consider section 23H  |  1\nThe rental was paid for 12 months on 1 November 2024, therefore the expenditure related to the 4 months from 1 November 2024 to 28 February 2025 (R58 000) can be deducted in\nthe 2025 year of assessment  |  1\nThe prepaid rental is for 8 months and for a total amount of R116 000 (R174 000 * 8/12)  |  1\nThis was not prepaid due to legislation, the prepaid rental is for greater than 6 months after year end and the prepaid rental is greater than R100 000  |  1\nTherefore the prepaid portion is deferred to the 2026 year of assessment and can't be deducted in the 2025 year of assessment.  |  1\nLeasehold improvement\nThe leasehold improvement can be deducted under s11(g) as it was actually incurred, in terms of an obligation (lease agreement), the property is used for the production of income  |  2\n(to operate her business from) and it will constitute income for the lessor\nEven though she spent R170 000, the deduction is limited to the amount in the contract of R150 000  |  1\nThe deduction will be written off from the date the improvements are completed (1 December 2024) for a period of 10 years.  |  1\nSection 11(g) for the current year: 150 000/(10 x 12 - 1) x 3  |  3 782  |  1\nThere will be no s13(1) allowance for the excess R20 000 as this property is not used in the process of manufacture  |  1\nCommunication mark  |  1\nAvailable  |  13\nLimited  |  12"}]}]}, {"id": "jan2025", "title": "January 2025 Supplementary Exam", "short": "Jan 2025", "marks": 113, "yoa": "2024", "memoNote": "Official UCT suggested solution with per-line mark allocation.", "tables": "MONETARY CHANGES - 2024\nApplicable in respect of years of assessment commencing on or after 1 March 2023 (i.e.\n2024 year of assessment) – unless specifically stated otherwise\nREBATES (section 6)\nPrimary rebate increases from R16 425 to R17 235;\nSecondary rebate increases from R9 000 to R9 444;\nTertiary rebate increases from R2 997 to R3 145\nMEDICAL REBATES (section 6A)\nBenefits to the taxpayer: R364;\nBenefits to the taxpayer and one dependant: R728;\nBenefits to each additional dependant: R246\nRESIDENTIAL ACCOMMODATION (paragraph 9 of the Seventh Schedule)\nSymbol B of R87 300 increases to R95 750.\nRATES OF NORMAL TAX\n In respect of the taxable income (excluding any retirement fund lump sum benefit,\nretirement fund lump sum withdrawal benefit or severance benefit) of natural persons,\nestates and special trusts\nTaxable Income (R)  |  Rate of Tax\n0 – 237 100  |  18% of taxable income\n237 100 – 370 500  |  42 678 + 26% of taxable income above 237 100\n370 501 – 512 800  |  77 362 + 31% of taxable income above 370 500\n512 801 – 673 000  |  121 475 + 36% of taxable income above 512 800\n673 001 – 857 900  |  179 147 + 39% of taxable income above 673 000\n857 901 – 1 817 000  |  251 258 + 41% of taxable income above 857 900\n1 817 001 and above  |  644 489 + 45% of taxable income above 1 817 000\n In respect of the taxable income of any company which qualifies as a small business\ncorporation as defined in section 12E of the Income Tax Act, in respect of any year of\nassessment ending any date between 1 April 2023 and 31 March 2024.\nTaxable Income (R)  |  Rate of Tax\n0 – 95 750  |  0% of taxable income\n95 751 – 365 000  |  7% of the amount above R95 750\n365 001 – 550 000  |  R18 848 + 21% of the amount above R365 000\n550 001 and above  |  R57 698 + 27% of the amount above R550 000\nTRAVEL ALLOWANCE\nWhere the value of the vehicle (R) -  |  Fixed cost  |  Fuel  |  Maintenanc\ncost  |  e cost\n(R p.a.)  |  (c/km)\n(c/km)\ndoes not exceed R100 000  |  33 760  |  141.5  |  43.8\nexceeds R100 000 but does not exceed R200 000  |  60 329  |  158.0  |  54.8\nexceeds R200 000 but does not exceed R300 000  |  86 958  |  171.7  |  60.4\nexceeds R300 000 but does not exceed R400 000  |  110 554  |  184.6  |  65.9\nexceeds R400 000 but does not exceed R500 000  |  134 150  |  197.6  |  77.5\nexceeds R500 000 but does not exceed R600 000  |  158 856  |  226.6  |  91.0\nexceeds R600 000 but does not exceed R700 000  |  183 611  |  230.5  |  102.1\nexceeds R700 000 but does not exceed R800 000  |  209 685  |  234.3  |  113.1\nexceeds R800 000  |  209 685  |  234.3  |  113.1\nAlternative fixed rate for certain reimbursive travel allowances: 464 cents per kilometer\n(previously 418 cents)\nSUBSISTENCE ALLOWANCE\n Local travel:\no  |  Allowance for incidental costs only – R161 (previously R152) for each day.\no  |  Allowance for meals and incidental costs – R522 (previously R493) for each day.\n Overseas travel:\no  |  Actual accommodation plus a prescribed amount based on the relevant country\n(which amount will be provided in the ITC if it differs from the amount listed in the\nRegulation in the SAICA Student Handbook).\nTRANSFER DUTY (Section 2(1)(b) of the Transfer Duty Act)\nIn respect of acquisition of property on or after 1 March 2020:\nValue of property (R)  |  Rate\n0 – 1 100 000  |  0%\n1 100 001 – 1 512 500  |  3% of the value above R1 100 000\n1 512 501 – 2 117 500  |  R12 375 + 6% of the value above R1 512 500\n2 117 501 – 2 722 500  |  R48 675 + 8% of the value above R2 117 500\n2 722 501 – 12 100 000  |  R97 075 + 11% of the value above R2 722 500\n12 100 001 and above  |  R1 128 600 + 13% of the value above R12 100 000", "questions": [{"id": "Q1", "title": "Question 1 — Cold Press Nation (Pty) Ltd", "marks": 50, "scenario": "QUESTION 1  |  (50 marks: 80 minutes)\nCold Press Nation (Pty) Ltd (“CPN” or “the company”) is a South African company which was\nfounded by Nate Belkin in 2013. Nate was born and bred in Elgin Valley, outside Cape Town. He\nhas always been intrigued with the process of creating his own juices from fresh fruit bought at\nsurrounding farms. Nate thought of capitalising on his juice-making endeavours and began by\nselling his juices at the surrounding farmers’ markets. In 2015, he incorporated and registered\nCold Press Nation (Pty) Ltd with a 31 July year-end and registered as a Category C VAT vendor.\nThe tax accountant of CPN is currently on maternity leave and transactions for the 2024 year of\nassessment have not been accounted for yet. The company hired a temporary employee to assist\nwith the tax returns for the 2024 year of assessment. The temporary employee thought it would\nbe best to use the Income Statement prepared by the tax accountant before she left as a starting\npoint for the tax expense calculation.\nNate was concerned about the competence of the temporary employee and these concerns were\nfurther heightened by the errors Nate identified upon his initial review of the normal tax calculation\nbelow. Nate has asked you to assist with a critical review of the work performed. All amounts are\nexclusive of VAT unless otherwise stated, or indicated by the context.\nDescription  |  Reason/Working  |  Note  |  2024\nR\nRevenue  |  General gross income definition  |  1  |  1 240 400\n(1 550 500 x 80% = R1 240 400)\nThe 20% is not included as this was\nnot received by or accrued to CPN by\nyear end.\nCost of goods sold  |  Section 11(a)  |  2  |  (468 500)\nOther income  |  The amount was received by CPN for  |  3  |  44 000\nits own benefit (R50 600 x 100 /115 =\nR44 000)\nContributions to pension fund Section 11(a)  |  4  |  (250 000)\nMarketing costs  |  Section 11(a)  |  5  |  (37 000)\nBad debts  |  This deduction is specifically prohibited  |  6  |  -\nDepreciation  |  The depreciation expense for financial  |  3, 7  |  (161 730)\nreporting purposes is the same as the\nwear and tear allowance for tax\npurposes\nDonations  |  Section 18A  |  2, 8,  |  (80 400)\nThe donations made by CPN during\nthe year are fully deductible\n(R5 400 + R25 000 + R50 000 =\nR80 400)\nTaxable Income  |  287 270\nIncome tax expense  |  R287 270 x 27% = R77 563  |  (77 563)\nPrimary rebate  |  All taxpayers are permitted the primary  |  (17 235)\nrebate in terms of s6(1)\nNormal Tax Liability  |  60 328\nNotes\n1. CPN recently launched a new initiative to offer credit options to its customers, with the hopes\nof attracting a broader audience and boost sales. In the 2024 year of assessment, revenue\nconsists of the following:\n• 20% credit sales (this amount was still outstanding at year end)\n• 80% cash sales\n2. Due to the perishable nature of CPN’s inventory, inventory is purchased in regular intervals to\navoid any wastage. A review of CPN’s general ledger shows the following balances as it\nrelates to inventory:\nR\nOpening balance on 1/08/2023  |  18 000\nRaw materials purchased during the 2024 year  |  460 000\nClosing balance on 31/07/2024  |  9 500\nCost of Sales  |  468 500\nThe inventory balance on 1 August 2023 and 31 July 2024 was determined based on a\nphysical stock count. No inventory was written down during the current year of assessment.\nAny unused fresh produce is donated to Feed the Nation Foundation (“FTN Foundation”) on\na weekly basis and a s18A certificate is received. FTN Foundation is a registered Public\nBenefit Organization that provides food assistance primarily to school children, with a primary\nfocus on those living in child-headed households. Trading stock with a total cost of R5 400\nand market value of R2 800 were donated to FTN Foundation during the 2024 year of\nassessment.\n3. The other income comprises proceeds from the disposal of a juicer owned by CPN. The juicer\nwas purchased new on 1 May 2021 at a cost of R65 000 (including VAT). CPN disposed of\nthe juicer on 30 September 2023 for R50 600 (including VAT), which was the open market\nvalue on that date.\nCPN replaced the juicer on 1 October 2023 with a second-hand
