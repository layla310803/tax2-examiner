industrial juicer, which was\nimmediately brought into use. This machine cost R150 000 and had an open market value of\nR135 000 on that same date. The second-hand industrial juicer had a market value of\nR120 000 on 31 July 2024. The supplier of the second-hand industrial juicer was not\nregistered for VAT.\nThe tax accountant included a note that para 66 of the 8th Schedule would be applicable to\nthis transaction.\n4. The company contributed R250 000 during the 2024 year of assessment to the employees’\npension fund.\n5. Cold Press Nation incurred a total cost of R37 000 for advertising its products in the current\nyear. This amount is slightly less than what the company incurred in the prior year and the\nreduction was largely due to the arrangement the company had with SolarFitness (refer to\npoint 8 below).\n6. The income statement reflected a bad debts expense of R26 000 and this amount includes\nthe movement in the allowance for doubtful debt.\nThe allowance for doubtful debts balance recognised in the Statement of Financial Position\nwas calculated as follows:\n2024  |  2023\nR  |  R\nLifetime expected credit losses  |  95 000  |  77 000\nOther allowances  |  18 000  |  50 000\nAllowance for doubtful debts  |  113 000  |  127 000\nThe s11(j) allowance for doubtful debts deduction for the 2023 year of assessment amounted\nto R43 300.\n7. The depreciation expense for CPN of R161 730 (correctly calculated) is made up of\ndepreciation on the following assets:\nAsset  |  Comment\nJuicer (disposed of on 30/09/2023)  |  Refer to note 3 above\nSecond-hand industrial juicer  |  Refer to note 3 above\nManufacturing plant  |  The building was purchased in 2022 for R2 500 000\n(including VAT). CPN uses 20% of the building for\nstorage of the completed products and 10% of the\nbuilding is used for administration. The rest of the\nspace is used for manufacturing.\n8. In addition to the donation CPN made to FTN Foundation (refer to point 2 above), the directors\nof the company resolved to make the following donations during the month of December 2023:\n• A cash donation of R25 000 was made to the Elgin Valley rugby team.\n• More trading stock was donated to SolarFitness (a local gym). SolarFitness organised\na marathon and the juices would be given to the runners when they crossed the finish\nline. The arrangement was that SolarFitness would have banners to advertise CPN in\nexchange for the juices. The trading stock had a cost of R50 000 and the market value\non the date of donation was R65 000.\n9. The 2023 Income Tax Return for CPN indicated that there were donations amounting to\nR3 600 which were not allowed as a deduction as this exceeded 10% of the taxable income.\nDuring the 2023 financial year, this amount was fully deducted for financial reporting purposes.\nAdditional information\n• Cold Press Nation (Pty) Ltd is not a small business corporation as defined.\n• All persons with whom Cold Press Nation (Pty) Ltd transacts are VAT vendors unless\nstated otherwise and all valid VAT invoices are on hand.\n• The Commissioner of SARS considers the juicing process to be a process of manufacture.\n• Cold Press Nation (Pty) Ltd wishes to minimize its taxation position by taking advantage\nof any and all elective taxation provisions in any relevant Acts.\n• Interpretation Note 47, read together with Binding General Rule7, allows a five-year write-\noff period for all qualifying assets.\n• The accounting policy of Cold Press Nation (Pty) Ltd indicates that juicing machines have\nan eight-year useful life and buildings have a fifteen-year useful life.", "parts": [{"id": "1.1", "marks": 8, "required": "Discuss, with supporting calculations, the VAT consequences for Cold Press Nation (Pty) Ltd for transactions in notes 3 and 4 for the 2024 year of assessment.", "memo": "1.1 Disposal of juicer\nThe disposal of the juicer is a taxable supply in terms of s7(1)  |  1\nThe time of supply is the earlier of invoice or payment,i.e. 30 September 2023  |  1\nThe amount of output VAT payable is R6 600 (R50 600 x 15/115)  |  1\nPurchase of replacement juicer\nThe juicer was a second hand good that was purchased from a non-vendor and it will be used for making taxable supplies, therefore the second hand goods rule would be applicable for\nthe juicer  |  1\nThe value of supply is the lower of consideration and open market value  |  1\nConsideration  |  R150 000\nOpen market value  |  R135 000\nTherefore the input VAT claimable is R17 609 (R135 000 x 15/115)  |  1\nThe time of supply is 1 October 2003, which is the date on which payment was made  |  1\nContribution to pension fund\nThere will be no VAT consequences on the contributions of Cold Press Nation to the pension fund as this is a financial service and is therefore an exempt supply  |  1\nAvailable  |  8\nMaximum  |  8"}, {"id": "1.2", "marks": 9, "required": "Discuss the donations tax consequences for all the donations made by Cold Press Nation (Pty) Ltd during the 2024 year of assessment.\n(8 marks + 1 communication mark: logical argument)", "memo": "1.2 Cold Press Nation will be subject to donations tax on the gratuitous dispositions that it made during the 2024 year of assessment, provided that none of the exemptions are applicable  |  1\nThe donation of the fresh produce was to a PBO and will therefore be exempt in terms of s56(1)(h)  |  1\nThe cash donation of R25 000 will be subject to donations tax  |  1\nThere is no specific exemption for the donations tax, however CPN can utilise the general exemption of R10 000  |  1\nThe donation of the trading stock to SolarFitness is not a donation as defined as there was no gratuitous disposal  |  1\nCPN will get advertising in return for the juices that were given to the local gym  |  1\nCPN will be subject to donations tax at 20% (R25 000 - R10 000) x 20% = R3 000  |  1\nDonations tax is payable at the end of the month following the month of the donation, 31 January 2024  |  1\nX1: Communication skills  |  1\nAvailable  |  9\nMaximum  |  9"}, {"id": "1.3", "marks": 33, "required": "Critically review the income tax expense calculation performed by the tax accountant of Cold Press Nation (Pty) Ltd for the year ended 31 July 2024.\nIn answering this question:\n• Indicate the line items that were treated correctly for income tax purposes and provide a brief reason therefor\n• Identify the errors in the calculation\n• Where there was an error, briefly discuss why this is an error AND provide the correct treatment\n• Where there was an omission, provide the correct treatment\nPresent your solution as:  Description  |  Error/Omission  |  Reason and/or working  |  Correct treatment\n(31 marks + 2 communication marks: layout and structure, logical argument)", "memo": "1.3 Description  |  Error/Omission  |  Reason/Working  |  Correct treatment\n100% of the revenue should be included in gorss income\nRevenue  |  Only including 80% of the revenue in the calculation  |  as CPN is unconditionally entitled to it  |  R1 550 500  |  2\nThere is no deduction for cost of sales. Need to treat\nCost of goods sold  |  Deducting cost of sales in terms of s11(a)  |  opening stock, purchases and closing stock separately  |  1\nOpening stock - s22(2)  |  -18000  |  0,5\nPurchases - s11(a)  |  -460000  |  0,5\nClosing stock - s22(1)  |  9500  |  0,5\nIncluding the proceeds from the disposal of a capital asset in The disposal of the juicer would have CGT effects as the\nOther income  |  gross income  |  proceeds are capital in nature  |  1\nRecoupment - s8(4)(a)\nSelling price (ltd to cost) R50 600 x 100/115 = R44 000\nLess Tax value R0\nRecoupment  |  The recoupment was omitted from the normal tax calculation Recoupment R44 000  |  1,5\npara 66 application R44 000 * 20%  |  8800  |  1\nCGT\nProceeds  |  0\nSelling price  |  44000  |  0,5\nRecoupment  |  -44000  |  0,5\nBase Cost  |  0\nCost  |  56522  |  0,5\nAllowances  |  56522  |  0,5\nCapital Gain  |  0\nThe deduction should have been allowed in terms of\nContributions to pension fund Deducting the contributions in terms of s11(a)  |  s11(l)  |  1\nThis was correctly treated as the marketing expense was\nactually incurred in the production of income and is not\nMarketing costs  |  of a capital nature  |  0,5\nBad debts expense  |  Stating that these are prohibited deductions  |  There is a specific deduction for bad debts - s11(i)  |  -40000  |  1\ns11(i) is only for the debts that actually went bad in the\ncurrent YOA, therefore need to remove the movement in\nthe allowance for doubtful debt\nR26 000 + R14 000 (R127 000 - R113 000) = R40 000  |  1,5\nAllowance for doubtful debts This was omitted from the calculation  |  Prior year deduction needs to be reversed - s11(j)  |  43300  |  1\nClosing balance to be determined as follows:\nLifetime losses R95 000 x 40% = R38 000  |  1\nOther losses R18 000 x 25% = R4 500  |  1\nR38 000 + R4 500 = R42 500  |  -42500\nStating that the wear and tear allowance is the same as the Juicer (disposed of) - s12C allowance\nDepreciation  |  accounting depreciation  |  R65 000 x 100/115 x 20% = R11 304  |  -11304  |  2\nSecond-hand industrial juicer - s12C\nBased on the lower of\nCost R150 000 - R17 609 = R132 391\nMarket value R135 000 - R17 609 = R117 391\nR117 391 x 20% = R23 478  |  -23478  |  2\nManufacturing plant - s13(1) as the building is used\nmainly in the process of manufacture (ie more than 50%)\nR2 500 000 x 100/115 x 5% = R108 696  |  -108696  |  2\nDonation  |  Omitting the recoupment of the trading stock donated  |  Donation of fresh produce - s22(8)(C)  |  5400  |  1\nDonation of juices - s22(8)  |  65000  |  1\nProviso to s22(8) as the trading stock was used for trade\npurposes - marketing  |  -65000  |  1\ns18A is only for the donations made to a PBO\nThe donation of trading stock to Feed the Nation\nFoundation will be at the lower of cost and market value,\nDonation  |  Deducting the donations that were not made to a PBO  |  R2 800  |  -2800  |  2\nThe R3 600 should be added to the current year donation\nNot including the donation expense carried forward from the to the PBO\nprior year  |  Total donations R2 800 + R3 600 = R6 400  |  1\nNot applying the limit to the s18A deduction  |  The donation is limited to 10% of taxable income  |  1\nThis will need to be recalculated based on the new\nIncome tax expense  |  taxable income after the corrections are made  |  0,5\nPrimary rebate  |  Including a primary rebate in the calculation  |  The primary rebate is only applicable for natural persons  |  1\nX1: Communication skills  |  2\nAvailable  |  33,5\nMaximum  |  33"}]}, {"id": "Q2", "title": "Question 2 — Lindela & Mhlengi Malange", "marks": 63, "scenario": "QUESTION 2  |  (63 marks: 100 minutes)\nLindela Malange is a 56-year-old South African resident. She has been employed as the finance\nmanager at Total Fitness (Pty) Ltd (“Total Fitness”, “the company”) since 2006. She is married to\nMhlengi Malange and they have two children. They have lived in Cape Town since they got married\nin 2004. Lindela and Mhlengi are married out of community of property.\nLindela’s employment package for the 2024 year of assessment consisted of the following:\n1. Lindela was paid a monthly cash salary of R68 000. Total Fitness requires all its employees\nto be members of the Total Fitness Pension Fund. Lindela contributes R6 700 per month\ntowards the pension fund and the policy of Total Fitness is that the contributions of employees\nwill be matched as follows:\n• 1:2 for employees who are at least 55 years old\n• 1:1 for all other employees\nLindela also contributes R2 500 per month towards the Moonlam Retirement Annuity Fund.\nTotal Fitness does not take these contributions into account when calculating employee’s tax.\n2. Total Fitness granted Lindela the exclusive right to use the Hyundai i20 company vehicle. This\nvehicle was acquired by Total Fitness on 28 February 2022 and Lindela was first granted the\nright of use of the vehicle on 1 March 2023. Total Fitness acquired the vehicle without a\nmaintenance plan for R369 900 when the open market value was R372 000. The vehicle had\na market value of R340 500 on 1 March 2023.\nLindela is responsible for all the fuel and maintenance costs related to the vehicle. Lindela’s\nlogbook for the 2024 year of assessment indicated the following travels:\nTravel from home to the office  |  4 500km\nTravel from office to other Total Fitness 22 000km\nbranches\nTotal km’s  |  26 500km\n3. Lindela is a fitness enthusiast, and she has been attending the annual Fitness and Wellness\nExpo’s for the past ten years. In the current year of assessment, the Fitness and Wellness\nExpo was held in Johannesburg and Lindela was required to attend. Total Fitness granted\nLindela an allowance of R1 200 per day for the five days that she was in Johannesburg for\nthe Expo. Her accommodation costs for the period she was in Johannesburg amounted to\nR3 200 and she paid this from the allowance she received from her employer.\nAssume she received the allowance in January 2025 and went away in January 2025\nTotal Fitness also incurred the following costs in relation to Lindela’s trip to Johannesburg:\n• South African Airways flight which cost R3 600\n• Uber vouchers which cost R850 for the trips from the hotel to the Expo\n• R1 500 of Lindela’s restaurant bills (R800 of these bills relate to food and drinks for\nclients)\n4. Lindela was a dependent on Mhlengi’s medical aid. However, Mhlengi got retrenched from\nhis job on 30 June 2023. Lindela started contributing R4 200 towards the Bonitas Medical Aid\nfrom 1 July 2023. Total Fitness does not contribute towards any medical aid for its employees.\nThe monthly contributions were deducted from Lindela’s salary. Mhlengi and their two children\nare dependents of Lindela’s medical aid.\n5. During the 2024 year of assessment, Total Fitness calculated Lindela’s annual bonus to be\nR100 000 and this was paid to her on 31 January 2024.\n6. One of Lindela’s children, Rachel is studying towards a Bachelor of Science in Physiotherapy\nat the University of Cape Town (UCT). Rachel has been awarded a bursary by Total Fitness\nto support her studies. The bursary covers tuition fees, books and other educational material,\ntotalling R65 000 for the 2024 academic year. This amount was paid by Total Fitness to UCT\nin January 2024.\n7. Lindela works on a hybrid system, where she is only required to be at the office twice a week.\nTotal Fitness granted Lindela the exclusive use of a laptop to enable Lindela to work from\nhome effectively. The laptop cost Total Fitness R10 500 and the open market value on the\ndate of acquisition was R12 000. Lindela has a personal laptop, therefore she uses the work\nlaptop primarily for Total Fitness business.\n8. Lindela obtained a loan of R150 000 from BestBank on 1 March 2023. Her intention was to\nuse these funds to renovate her family home in Cape Town. The terms of the loan indicated\nthat interest would be charged at 8% per annum, payable monthly. The capital repayments\nwould commence on 1 March 2026. Lindela requested assistance from Total Fitness with the\nloan and Total Fitness agreed to pay 6% of the interest and Lindela would pay the remaining\nbalance.\nInvestments\nAs Lindela approaches retirement, she is becoming increasingly concerned about her financial\nsecurity as she does not want to be a burden to her children when she retires. During the current\nyear of assessment, Lindela holds the following investments:\nAsset/Income  |  Note  |  Amount\nInterest from off-shore investment  |  (a)  |  R34 000\nTax-Free investment  |  (b)  |  R28 000\nMonthly rental from block of flats in Pinelands, Cape Town  |  (c)  |  R3 200\n(a) The foreign interest income has been correctly translated to Rands.\n(b) Lindela opened a Tax-Free Savings Account at TedBank and earned interest amounting to R28\n000 during the current year of assessment. Lindela made monthly contributions of R5 800\ntowards the account during the current year of assessment.\n(c) Lindela acquired a new block of flats from a property developer on 1 March 2022. She paid\nR2 700 000 for the flats when the market value was R2 750 000. The market value of the\napartments on 29 February 2024 was R2 980 000. The block of flats has eight units which Lindela\nhas been renting out since she acquired them. The monthly rental for the current year is R3 200\nper unit.\nLindela made a loss of R350 000 in the 2023 year of assessment from the rental of these units.\nNone of the units are occupied by her relatives.\nMhlengi Malange\nAfter being retrenched from his job, Mhlengi started operating his IT consultancy business as a sole\nproprietor. He employed his two brothers and one of his friend’s to work in his business.\nMhlengi was fortunate to land a contract with an accounting firm in terms of which he agreed his\nbusiness would render IT services to the firm. The firm provided him and his team an office on the\nfifth floor where they were required to be present from 8:30am to 5:30pm every Monday to Friday.\nThe firm pays Mhlengi a fee of R100 000 per month for the IT services.\nAdditional information\n• Total Fitness is a registered Category C VAT vendor\n• All amounts are inclusive of VAT unless otherwise stated or the context indicates otherwise.\n• Lindela Malange is not a registered VAT vendor\n• You may assume that the official rate remained unchanged at 7% throughout the 2024 year\nof assessment.\n• SARS allows a five-year write off period for all s11(e) qualifying assets.\n• Lindela Malange has a remuneration proxy of R741 200 for the 2024 year of assessment.", "parts": [{"id": "2.1", "marks": 22, "required": "Calculate the employee's tax that will be withheld by Total Fitness for Lindela Malange for the month of January 2024.", "memo": "2.1 Description  |  Reason/Working  |  Amount\npara (c) of gross income /para (a) of remuneration\nSalary  |  (R68 000 x 12 = R816 000)  |  816 000  |  1\npara (i) of GI/para (c) of remunreation\nEmployer contribution towards pension fund  |  (R6 700 x 2 x 12 = R160 800)  |  160 800  |  1\nRight of use of motor vehicle  |  para (i) of GI/para (cB) of remuneration\nDetermined Value - (R369 900 x 0.85) = R314 415  |  0,5\nR314 415 x 3.5% x 12 = R132 054  |  1\n22 000km/26 500km = 83% kms relate to business travel, therefore use 20% inclusion into remuneration  |  1\nR132 054 x 20% = R26 411  |  26 411  |  0,5\nRight of use of asset (laptop)  |  No inclusion into remuneration as the laptop is used mainly for work purposes  |  -  |  1\nInterest paid by employer  |  para (i) of GI/para (b) of remuneration\n6% + 2% > 7% (official rate), therefore this is a subsidy  |  0,5\nValue of fringe benefit: (R150 000 x 6% = R9 000)  |  9 000  |  0,5\nContributions towards medical aid  |  These contributions are not a fringe benefit as they are deducted from Lindela's salary  |  -  |  0,5\nRemuneration  |  1 012 211\ns11F  |  Contributions (R6 700 *12) + (R160 800) = R241 200  |  1\nLimited to the lower of :\nR350 000  |  0,5\n27,5% of Remuneration (R1 012 211) = R278 358  |  0,5\nThe contributions are fully deductible  |  -  |  241 200  |  0,5\nBalance of remuneration excluding annual amounts  |  771 011\nTax per tables  |  179 147 + 39% (771 011 - 673 000)  |  217 371  |  1\nPrimary rebate  |  -  |  17 235  |  0,5\nMedical aid rebate  |  (728 + 246 + 246)*8  |  -  |  9 760  |  1\nAdditional medical rebate  |  No s6B as Lindela is below the age of 65 years  |  -  |  0,5\nEmployees Tax (excluding annual amount) (T2)  |  190 376\nTax on normal amounts in January 2024  |  (R190 376 /12)  |  15 865  |  1\nAnnual Amounts\nCash Bonus  |  s7B - variable remuneration included when actually paid  |  100 000  |  1\nBursary  |  Fringe benefit granted to relative is deemed to be a fringe benefit received by employee (Lindela)  |  65 000  |  1\npara (i) of GI /para (b) of remuneration\nBursary exemption  |  s10(1)(q) is not available as Lindela's remuneration proxy for the 2024 YOA exceeds R600 000  |  -  |  1\nSubsistence allowance  |  No inclusion into remuneration as she actually went to the trip  |  -  |  1\nSouth African Airways flight  |  No inclusion into remuneration because it is not a fringe benefit - flight was for business purposes  |  0,5\nUber vouchers  |  No inclusion into remuneration - uber vouchers were for business purposes, therefore not a fringe benefit  |  0,5\nMeals  |  No value as enjoyed during business hours/ Lindela entertaining clients on behalf of Total Fitness  |  0,5\nBalance of remuneration including annual amounts  |  936 011\nTax per tables  |  (251 258 + 41% (936 011 - 857 900))  |  283 284  |  1\nPrimary rebate  |  -  |  17 235\nMedical aid rebate  |  (728 + 246 + 246)*8  |  -  |  9 760\nEmployees tax for the year (including annual amounts) (T1)  |  256 289\nTax on Bonus  |  R256 289 - R190 376 = R65 912  |  65 912  |  1\nEmployees Tax withheld in January 2024  |  R65 912 + R15 865 = R81 777  |  81 777  |  0,5\nAvailable  |  22\nMaximum  |  22"}, {"id": "2.2", "marks": 20, "required": "Discuss the tax consequences for Total Fitness for the transactions in Note 2 and 3 for the 2024 year of assessment.\n(19 marks + 1 communication mark: logical argument)", "memo": "2,2 Right of use of motor vehicle\nVAT\nThere is a deemed output in terms of s18(3) for the right of use of motor vehicle granted to Lindela by Total Fitness  |  1\nThe time of supply will be the end of the month during which the fringe benefit is included in remuneration  |  0,5\nThe value of supply is determined as the deemed consideration multiplied by the tax fraction (15/115)\nThe determined value of the vehicle is the cost of the vehicle, exclusive of VAT (R369 900 x 100/115 x 85% = R273 404)  |  1\nThe determined value is multiplied by 0.3% per month as the vehicle is a motor car as defined and therefore input denied  |  1\nThe deemed consideration is reduced by R85 per month because Lindela is responsible for all the maintenance costs relating to the vehicle.  |  1\n((R273 404 x 0.3%) - R85) x 12 x 15/115 = R1 151  |  1\nNormal Tax\nTotal Fitness will be able to get a s11(a) deduction for the deemed output on the fringe benefit (R1 151)  |  1\nTotal Fitness will also be entitled to a s11(e) allowance on the vehicle as it is the owner of the vehicle and the vehicle is being used for trade purposes.  |  0,5\nThe allowance will be based on the lower of cost and market value  |  0,5\nCost  |  R369 900\nMarket Value  |  R372 000\nR369 900/5 = R73 980  |  0,5\n(NO VAT removed as this was a motor car as defined and is therefore input denied)\nSubsistence Allowance\nVAT\nThere are no VAT consequences for the subsistence allowance as money is not a suppy of a good or service  |  1\nNormal Tax\nTotal Fitness would be entitled to a s11(a) for the allowance paid to Lindela, R6 000 (R1 200 * 5 )  |  1\nFlight\nVAT\nThe South African Airways flight is a standard rated supply and Total Fitness would be able to claim input  |  0,5\nThe value of the supply would be the consideration that Total Fitness paid for the flight R470 (R3 600 * 15/ 115)  |  1\nThe time of supply is the earlier of payment or invoice  |  0,5\nThere is no deemed output in terms of s18(3) because the flight is not a fringe benefit  |  0,5\nNormal Tax\nTotal Fitness would be entitled to a s11(a) deduction for the cost of the flight, R3 130 (R3 600 - R470)  |  1\nUber vouchers\nVAT\nThere are no VAT consequences for the uber vouchers as the transport of fare paying passengers is an exempt supply  |  1\nThere is no deemed output in terms of s18(3) because the uber voucher is not a fringe benefit  |  0,5\nNormal Tax\nTotal Fitness would be entitled to a s11(a) for the uber voucher of R850  |  0,5\nRestaurant bills\nVAT\nInput tax is not denied on the meals enjoyed by Lindela as she was required to spend at least one night away from her usual place of residence. Therefore Total Fitness will be able to claim\ninput only on the portion of the costs that relates to Lindela - s17(2)(a)(ii)  |  1\nR91 (R1 500 - R800) * 15/115  |  1\nThe restaurant bills that relate to the clients would be input denied in terms of s17(2)(a)  |  1\nThere is no deemed output in terms of s18(3) as the fringe benefit had no value (enjoyed during normal or extended working hours)  |  1\nNormal Tax\nTotal Fitness would be entitled to a s11(a) deduction for the restaurant bills paid for and the amount will be R1 409 (R1 500 - R91)  |  1\nX1: Communication skills  |  1\nAvailable  |  21,5\nMaximum  |  20"}, {"id": "2.3", "marks": 16, "required": "Discuss the normal tax consequences for Lindela Malange for ALL the investments (refer to Investments) that she holds in the 2024 year of assessment.\n(15 marks + 1 communication mark: logical argument)", "memo": "2.3 Offshore Investment\nLindela is a South African resident and is therefore taxed on her worldwide income  |  1\nThe foreign interest of R34 000 will be included in her gross income in terms of the general gross income definition  |  1\nThere is no exemption that is available for foreign interest  |  0,5\nTax-Free Investment\nThe interest of R28 000 from the tax-free investment will be included in Lindela's gross income  |  0,5\nShe will be able to claim a full exemption for the interest terms of s12T  |  1\nLindela made contributions in excess of R36 000 during the 2024 year of assessment, therefore she will be subject to normal tax on the excess contributions  |  1\n((R5 800 x 12) - R36 000) x 45% = R15 120  |  1\nBlock of flats\nLindela will include the rental income earned from the block of flats in her gross income during the current year of assessment R307 200 (3 200 *8*12)  |  1\nShe purchased the block of flats new and unused from the property developer  |  1\nShe owns eight units (i.e more than 5) and she uses them for trade purposes as she is renting them out  |  1\nLindela will be able to claim a s13sex allowance because all the requirements have been met  |  1\nThe units owned by Lindela may be considered low cost housing which would result in Lindela being able to claim an additional 5%\nEach unit has a cost of R337 500 (R2 700 000/8), which is less than R350 000  |  1\nThe rental charged by Lindela is R3 200, which is less than 1% of the cost of the apartment (increased by 10% as the building was acquired in the prior year)  |  1\n(R337 500 * 1,1 * 1% = R3 713)  |  1\nThe block of flats will therefore be considered low cost housing  |  1\nTherefore the s13sex allowance that can be claimed by Lindela will be as follows:\nR2 700 000 * 10% = R270 000  |  1\nX1: Communication skills  |  1\nAvailable  |  17\nMaximum  |  16"}, {"id": "2.4", "marks": 5, "required": "Advise Mhlengi Malange whether the accounting firm is required to withhold employee's tax in relation to the amounts paid to him by the firm.", "memo": "2.4 Employees tax can only be withheld if there is an employee, an employer and remuneration  |  1\nThe amount paid to Mhlengi is for the services him and his team have rendered to the accounting firm - para c of gross income definition and will be included in remuneration unless Mhlengi is\ncarrying on a trade independently  |  1\nMhlengi is under the control and supervision of the accounting firm, because him and his team are required to be at the business premises of the accounting firm from 8:30am to 5:30pm every\nweekday  |  1\nThey are also required to perform their duties at the premises of the accounting firm as they have been given an office from which perform their duties  |  1\nMhlengi does not employ at least 3 full time employees who are not connected persons to him because two of the three employees he has are his brothers (i.e connected persons to him)  |  1\nTherefore, Mhlengi is not carrying on a trade independently and the amount paid to him will be included in his remuneration  |  1\nMhlengi is an employee as defined and the accounting is an employer, therefore the accounting firm is required to withhold employees tax and pay it to SARS on behalf of Mhlengi  |  0,5\nAvailable  |  6,5\nMaximum  |  5"}]}]}, {"id": "nov2021", "title": "November 2021 Final Exam (ACC3004H)", "short": "Nov 2021", "marks": 120, "yoa": "2021", "unofficial": true, "memoNote": "Suggested solution from Studocu (filed as 'November 2020' but it matches this paper). Older legislation (2021 year of assessment): mark against the law and tables in this paper.", "tables": "MONETARY CHANGES\nApplicable in respect of years of assessment commencing on or after 1 March 2020 (i.e.\n2021 year of assessment) – unless specifically stated otherwise\nREBATES (section 6)\nPrimary rebate increases from R14 220 to R14 958;\nSecondary rebate increases from R7 794 to R8 199;\nTertiary rebate increases from R2 601 to R2 736;\nMEDICAL REBATES (section 6A)\nBenefits to the taxpayer: R319;\nBenefits to the taxpayer and one dependant: R638;\nBenefits to each additional dependant: R215  |  .\nRESIDENTIAL ACCOMMODATION (paragraph 9 of the Seventh Schedule)\nSymbol B of R79 000 increases to R83 100.\nRATES OF NORMAL TAX\n• In respect of the taxable income (excluding any retirement fund lump sum benefit,\nretirement fund lump sum withdrawal benefit or severance benefit) of natural persons,\nestates and special trusts\nTaxable Income (R)  |  Rate of Tax\n0 – 205 900  |  18% of taxable income\n205 901 – 321 600  |  37 062 + 26% of taxable income above 205 900\n321 601 – 445 100  |  67 144 + 31% of taxable income above 321 600\n445 101 – 584 200  |  105 429 + 36% of taxable income above 445 100\n584 201 – 744 800  |  155 505 + 39% of taxable income above 584 200\n744 801 – 1 577 300  |  218 139+ 41% of taxable income above 744 800\n1 577 301 and above  |  559 464 + 45% of taxable income above 1 577 300\nTRAVEL ALLOWANCE\nValue of the vehicle (R)  |  Fixed cost  |  Fuel cost  |  Maintenance\ncost\n(R p.a.)  |  (c/km)  |  (c/km)\n0 – 95 000  |  31 332  |  105,8  |  37,4\n95 001 - 190 000  |  55 894  |  118,1  |  46,8\n190 001 - 285 000  |  80 539  |  128,3  |  51,6\n285 001 - 380 000  |  102 211  |  138,0  |  56,4\n380 001 - 475 000  |  123 955  |  147,7  |  66,2\n475 001 - 570 000  |  146 753  |  169,4  |  77,8\n570 001 - 665 000  |  169 552  |  175,1  |  96,6\nmore than 665 000  |  169 552  |  175,1  |  96,9\nAlternative fixed rate for certain reimbursive travel allowances: 398 cents per kilometer\n(previously 361 cents)\nSUBSISTENCE ALLOWANCE\n• Local travel:\no  |  Allowance for incidental costs only – R139 (previously R134) for each day.\no  |  Allowance for meals and incidental costs – R452 (previously R435) for each day.\n• Overseas travel:\no  |  Actual accommodation plus a prescribed amount based on the relevant country\n(which amount will be provided in the assessment if it differs from the amount listed\nin the Regulation in the SAICA Student Handbook).\nTRANSFER DUTY (Section 2(1)(b) of the Transfer Duty Act)\nIn respect of acquisition of property on or after 1 March 2020:\nValue of property (R)  |  Rate\n0 – 1 000 000  |  0%\n1 000 000 – 1 375 000  |  3% of the value above R1 000 000\n1 375 000 – 1 925 000  |  R11 250 + 6% of the value above R1 375 000\n1 925 000 – 2 475 000  |  R44 250 + 8% of the value above R1 925 000\n2 475 000 – 11 000 000  |  R88 250 + 11% of the value above R2 475 000\n11 000 000 and above  |  R1 026 000 + 13% of the value above R11 000 000", "questions": [{"id": "Q1", "title": "Question 1 — CT Glass and Aluminium (Pty) Ltd", "marks": 65, "scenario": "QUESTION 1 (65 MARKS; 98 MINUTES)\nCT Glass and Aluminium (Pty) Ltd (‘CT Glass’ or ‘the company’) is a South African manufacturer of\naluminium and glass products. The company manufactures, supplies, and installs a wide range of\nproducts that include doors, windows, and shopfronts, amongst others. The company offers both\nstandard products as well as custom designs to suit customers’ needs. Since 2018, the company has\nbeen exporting standard windows and doors to other African countries.\nCT Glass was founded by the Abrahams siblings in 2011 and has since operated as a family-run\nbusiness. Each sibling has a 25% shareholding in the company, however, only the two brothers, Abdul\nand Yazied are involved in the operations of the company. Both brothers are Chartered Accountants\n(South Africa). CT Glass is a registered Category C VAT Vendor and has a 31 March financial year-\nend. The company is a small business corporation as defined in terms of s12E(4) of the Income Tax\nAct.\nThe company has requested your assistance with regards to various matters concerning its tax affairs\nas the financial manager is on maternity leave.\nAll amounts are inclusive of VAT where appropriate unless stated otherwise or shown by the\ncontext.\nTotal sales for the financial year-end amounted to R15 650 000 (including VAT); of these total sales\n35% was cash sales and the remainder related to credit sales. 25% of the total sales relates to\nwindows and doors that were exported to other African countries.\nAn extract from the Statement of Comprehensive Income for the year ending 31 March 2021:\nNotes  |  R\nDividend income  |  1  |  45 000\nPurchases  |  2  |  (6 655 000)\nSalaries  |  3  |  (1 380 000)\nBad debts expense  |  4  |  (450 000)\nLegal expenses  |  5  |  (34 500)\nCompensation paid  |  5  |  (145 000)\nDepreciation  |  6  |  (450 000)\nAn extract from the Statement of Financial Position as at 31 March 2021:\nNotes  |  R\nAllowance for doubtful debts  |  4  |  975 000\nInventory  |  2  |  2 250 000\nNotes\n1. Gross dividends of R45 000 were declared to CT Glass during the current year. R35 000\nrelates to dividends received from a JSE-listed South African company and R10 000 relates\nto dividends received from a foreign company where CT Glass owns 6% of the shares.\n2. The purchases relate to raw materials bought to be used in the manufacture of the glass and\naliminium products. While CT Glass tries its best to buy locally, due to a lack of local supply,\n20% of the raw materials were sourced from a Chinese supplier. CT Glass paid import duties\nof R240 000 (excluding VAT) on the customs duty value of imports of R1 330 000 during the\ncurrent year of assessment, which was not included in the purchases above. CT Glass only\nimports once a year. This year the imported goods were ordered on 1 July 2020, shipped on\n30 September 2020 with the terms Free-on-Board destination point, arrived in South Africa on\n23 November 2020, and were released for home consumption on 30 November 2020.\nClosing inventory per the statement of financial position at the end of the previous financial\nyear amounted to R3 440 000.\nOne of the shareholders who is not actively involved with the operations of the company is\nbusy with home renovations and took five windows and two doors out of the inventory to use\nin his home. The total cost of the windows and doors are R5 000 and would usually be sold\nfor its open market value of R8 000.\n3. The following additional employment costs have not been taken into account in the salaries\nfigure:\n• CT Glass contributed 5% of total salaries to the CT Glass Pension Fund for the benefit of\nits employees.\n• CT Glass pays a transport company SIZAS (Pty) Ltd to transport its employees from home\nto work and back home every day. CT Glass pays an amount of R10 000 per month for\nthis transportation service.\n4. The R450 000 relates to debts owed to the company (from sales) that have gone bad during\nthe year.\nThe IFRS 9 impairment allowance at the end of the previous year of assessment was\nR1 025 000 and the company had been allowed an income tax deduction of R348 500 in that\nyear in relation to doubtful debts.\nIn the current year of assessment, R500 000 of the allowance for doubtful debts relates to\nlifetime expected credit losses.\n5. During the current year of assessment, while an employee was using the grinding machine,\nthe blade of the grinder shattered at high speed, and he sustained deep wounds to his upper\nlip and left cheek. He was rushed to hospital and needed to have plastic surgery as part of his\ntreatment.\nThe employee requested CT Glass to pay for his medical costs however the company refused\nto pay the employee any compensation for his medical costs and argued that he was operating\nthe grinder at a speed above the maximum. The employee sued the company, and the\ncompany hired a lawyer to defend them. Upon investigation, it was found that the employee\nwas using the grinder correctly and it was not the employee’s fault. CT Glass paid the\ncompensation to the employee and the legal fees to its lawyer during February 2021.\n6. The depreciation expense relates to the following assets:\na. Machine A – grinding machine\nThis machine was purchased new on 15 June 2019 to be used in the manufacturing of the\nwindows and doors. It was purchased for R15 450 when the market value was R15 600.\nb. Vehicle\nCT Glass purchased a secondhand Toyota Hilux double cab bakkie on 15 January 2020\nfor R669 900 from a Toyota dealership and immediately brought it into use. The market\nvalue on the date of purchase was R665 000. The Toyota dealership bought the bakkie in\nDecember 2019 from a vendor for R650 000.\nOn 16 February 2021, on the way back from installing windows at a client, the bakkie was\ninvolved in an accident. The bakkie was written off and insurance proceeds of R650 000\nwere received for the bakkie.\nc. Building\nOn 1 June 2020, the company purchased a building in Bellville, Cape Town. The building\nwas purchased at a cost of R1 750 000 when the open market value was R1 700 000. The\nbuilding was purchased from Cats Creations who had used it to manufacture boxes and\nwho had been entitled to a 10% capital allowance on the building.\nThe amount was payable by CT Glass in two equal instalments on 1 June 2020 and\n1 August 2020.\nThe building was registered in the deed’s office on 1 July 2020.\nThe building is comprised of three floors. The first and second floor is used by CT Glass\nfor the manufacture of the products and the third floor is used as storage space and for\nthe administration offices.\nAll other assets have been fully written off for tax purposes.\nThe Tender1\nThe directors of CT Glass were informed there is a big project that will be starting in 2022 where\nwindows of certain government schools were going to be replaced. The directors decided to tender\nfor this project, but they knew it was very competitive. They knew someone who worked in the\ntendering department of the Government and paid them an amount of R150 000 in June 2021 to\nassist with winning the tender.\nAdditional Information\n• SARS considers the manufacture of aluminium products to be a process of manufacture.\n• Interpretation Note 47, read together with BGR7, allows a four-year write off period for all\nqualifying assets.\n• Assume, unless the contrary is stated, that CT Glass and Aluminium (Pty) Ltd will make use\nof all possible tax benefits and will therefore elect any option available to it in terms of the\nIncome Tax Act that will minimise its normal tax liability; or defer its normal tax liability.\n• All persons with whom CT Glass and Aluminium (Pty) Ltd has transacted are VAT vendors,\nexcept for Cats Creations.\n• Valid tax invoices are on hand for all transactions that have been entered into, where\nappropriate.\n1 Tendering usually refers to the process whereby government invites bids for large projects that must be submitted\nwithin a deadline", "parts": [{"id": "1.1", "marks": 10, "required": "Discuss, with reference to legislation and case law, the normal tax consequences for CT Glass and Aluminium (Pty) Ltd during the current year of assessment relating to:\n• The medical costs paid to the employee (9)\n• The related legal costs paid to the lawyer (10)\n(+ 1 communication mark: logical argument)", "memo": "1.1\nDamages and compensation\nThere is no specific deduction for damages and compensation therefore we would look to s11(a) read together with s23(g).\nThe onus is on the taxpapyer, CT Glass, to prove the amount is deductible.\nThe issue is whether the amount paid is in the production of income.\nAn amount is incurred in the production of income if it is an inevitable concomitant of the taxpayer's income-earning activities or we ask \"What\naction gave rise to the expenditure? Is this action so closely connected with the income earning activities of the taxpayer\"\nThe taxpayers income earning operations is the manufacturing of alimium products, it is highly likely that an accident of this nature could happen in\nthis trade OR the action that gave rise to the expenditure is the employee being injured while on the job, this action is closely connected with the\nincome earning operations of manufacturing of the products.\nTherefore the amount is in the production of income and deductible under s11(a).\nLegal expenses\nThere is a specific deduction - s11(c) that deals with legal expenses actually incurred on any claim, dispute or action at law occuring as a result of or\ndue to the ordinary operations of the taxpyer in the carrying on of his trade.\nThe deduction under s11(c) follows the nature of the underlying claim and is therefore not capital in nature.\nThe deduction for the compensation is allowed under s11(a) therefore the legal fees paid to the lawyer will be allowed under s11(c).\nCommunication - logical argument"}, {"id": "1.2", "marks": 16, "required": "Discuss, with supporting calculations, the VAT consequences, if any, for CT Glass and Aluminium (Pty) Ltd of:\n• The purchase of trading stock from the Chinese supplier (6)\n• The Toyota Hilux double cab bakkie (4)\n• The building in Bellville (5)\n(+ 1 communication mark: logical argument)", "memo": "1.2 Trading stock\nSupply\nThere is a supply in terms of section 7(1)(b) of the VAT Act as goods have been imported into South Africa.\nValue of supply\nAs the import is not from a BLNS country, the value of the supply in respect of goods imported is the customs duty value plus the customs duty\nlevied plus 10% of the customs duty value.\nTherefore the value of the supply is 1 330 000 + (10% x 1 330 000) + 240 000 = R1 703 000\nAnd the imposition of VAT is 15% of this amount, which is R255 450\nTime of supply\nThe time of supply is 30 November 2020 when it was released for home consumption.\nInput tax\nAs CT Glass is going to use the goods to make taxable supplies, an input tax deduction claim be claimed equivalent to the VAT paid on importation.\nVehicle\nCT glass purchased the vehicle for use to make taxable supplies and was charged output tax by the supplier.\nThe double-cab meets the definition of a motor car, and therefore input denied. CT Glass is therefore denied an input tax deduction.\nThe insurance proceeds were received as compensation for the bakkie which was input denied, therefore as it relates to a total reinstatement of\ngoods where input tax was originally denied, there will be no output tax.\nBuilding\nThe building was purchased from a non-vendor but it is second hand therefore the second hand goods rule applies\nThe value of supply is the lower of consideration and open market value\n15/115 x 1 700 000 = R221 739\nAs this is fixed property but the second hand goods rule applies, the time of supply is to the extent of payment, deferred to registration\nTherefore (1 750 000/2) x 15/115 = R114 130 can be claimed on 1 July 2020.\nThe balance (221 739 - 114 130)= R107 611 can be claimed on 1 August 2020.\nCommunication - logical argument"}, {"id": "1.3", "marks": 3, "required": "Discuss, with supporting calculations, the VAT consequences, if any, for the Toyota dealership of the Hilux double cab bakkie.", "memo": "1.3\nAs the vehicle was acquired by a motor car dealership for taxable supplies, input would not have been denied in terms of s17(2)(c ) and Toyota\ncould claim input on the acquisition of this second-hand good.\nInput tax of R84 783 (650 000 x 15/115) would be claimed\nThe dealership would charge VAT on the supply of the bakkie of R87 378 (15/115 x 669 900)"}, {"id": "1.4", "marks": 27, "required": "Calculate, with reasons, the taxable income of CT Glass and Aluminium (Pty) Ltd for the year ended 31 March 2021.", "memo": "1.4\nSales  |  Gross income - local sales  |  (15 650 000 x 100/115) * 75%  |  10 206 522\nCash and credit included - (earlier or receipt or accrual)\nGross income - export sales  |  (15 650 000 x 25%)  |  3 912 500\nExport sales are zero rated therefore no VAT removed\nDividends  |  Gross income - para (k)  |  45 000\nDividend exemption  |  s10(1)(k)  |  (35 000)\ns10B(3)(b) - owns less than 10% and company  |  (10 000 x 8/28)  |  (2 857)\nPurchases  |  s11(a)  |  (6 655 000)\nImport duties  |  s11(a)  |  (240 000)\nOpening stock  |  s22(1)  |  (3 440 000)\nClosing stock  |  s22(2)  |  2 250 000\nRecoupment  |  s22(8)  |  (8000 x 100/115)  |  6 957\ndisposal of trading stock other than in the ordinary course for a consideration less than market value\nSalaries  |  s11(a)  |  (1 380 000)\nPension fund contributions  |  s11(l)  |  (5% x 1 380 000)  |  (69 000)\nTransport expense  |  s11(a)  |  (10 000 x 12)  |  (120 000)\nAllowance for doubtful debts  |  s11(j) - opening balance  |  348 500\ns11(j) - closing balance  |  (500 000 x 100/115 x 40%)  |  (200 000)\n(975 000 - 500 000) x 100/115 x 25%  |  (118 750)\nBad debts  |  s11(i)  |  (450 000)\nLegal expenses  |  s11(c)  |  (34 500)\nCompensation  |  s11(a)  |  (145 000)\nCapital allowances\nMachine A - grinding machine\nUsed in the process of manufacture, therefore full write off in the 2020 YOA - s12E(1)  |  0\nDouble cab bakkie  |  s12E(1A)(b) -lower of cost or market value\n- motor car as defined therefore no input tax claimed\n(665 000 x 30%)  |  (199 500)\n-not used in a process of manufacture\nInsurance proceeds received  |  s8(4)(k)  |  Proceeds  |  650 000\nLess: Tax value  |  133 000\nCost  |  665 000\n2020:(50%)  |  (332 500)\n2021:(30%)  |  (199 500)\nRecoupment  |  517 000  |  517 000\nCapital gains tax  |  Proceeds  |  133 000\nInsurance proceeds  |  650 000\nLess: recoupment  |  (517 000)\nBase cost  |  137 900\nActual cost  |  669 900\nLess: allowances  |  (532 000)\nCapital loss  |  -4 900 Carried forward\nBuilding  |  s13(1)  |  (1 750 000 - 221 740 + 33 750 ) x 5%  |  (78 101)\nMainly used in a process of manufature\nTransfer duty (11 250 + 6%(1 750 000 - 1 375 000))\n33750\n4 118 771"}, {"id": "1.5", "marks": 9, "required": "Discuss, with reference to legislation and case law, the normal tax consequences for:\n• CT Glass and Aluminium (Pty) Ltd of the payment to the government employee.\n• The government employee of the receipt of the payment. (5)\nIn addition, discuss any ethical concerns that you have with the above transactions. (3)\n(+ 1 communication mark: logical argument)", "memo": "1.5 CT Glass\nEven though the payment to the government employee, would meet the requirements of s11(a), it is considered a bribe.\nThere is a prohibited deduction in terms of s23(o) that prevents the deduction of any payments resulting from a corrupt activity. The bribe is a\ncorrupt activity and therefore no deduction allowed.\nGovernment employee\nThere is a special inclusion gross income paragraph (c) that deals with services rendered.\nThe employee received the payment in return for making sure that CT Glass wins the tender, therefore there is a causal link.\nIn determining whether an amount is income it is irrelevant that it was derived from an illegal or immoral activity.\nThe employee intended to receive this money for their own benefit and therefore it will be included in their gross income.\nEthical considerations\nPayment of a bribe cannot be considered to be ethical behaviour as it is not 'right, proper and just' behaviour\nPaying a bribe is a criminal offence, the employee should not accept bribes, this is unethical and illegal.\nCorruption is a huge problem in South Africa and the directors of CT Glass should know better than to add to the corruption issue.\nThis is unethical leadership in the company as the directors are showing that they would do anything to win the tender.\nThe directors should have considered whether the payment of the bribe would have been 'good for themselves' and 'good for others'\nThere could have been other businesses who were more deserving of the tender and now won't get an opportunity\nAs the directors are Chartered accountants, the CPC would be applicable to them. The directors are contravening integrity and professional behaviour\nAny other valid point\nLogical argument\nACC3004H September Test"}]}, {"id": "Q2", "title": "Question 2 — Sibu Mpiti / Z Prop (Pty) Ltd", "marks": 55, "scenario": "QUESTION 2  |  (55 MARKS; 82 MINUTES)\nZ PROP (Pty) Ltd (‘Z PROP’ or ‘the Company’) is a real estate development and property company.\nIt develops, rents out and sells property units within the real estate sector of Cape Town. The company\nis a registered Category B VAT Vendor and has a February financial year-end.\nAn extract from the notes to the Statement of Comprehensive Income for the current year of\nassessment:\nRevenue:\nR\nSale of houses and apartments  |  21 892 410\nRental of houses and apartments  |  18 500 000\nRental of office space  |  15 540 000\nTotal revenue  |  55 932 410\nSibu Mpiti\nSibu Mpiti, was the CEO of the company up until her death; she was diagnosed with an illness in 2020\nand unfortunately passed away on 31 January 2021. At the date of her death, she was 40 years old.\nShe was born in Zimbabwe but moved to South Africa and became a South African tax resident in\n2008.\nSibu earned a cash salary of R144 000 per month. In addition to her salary, she received the following:\n• A travel allowance of R9 000 per month from the company. Sibu drove an Audi which she\nbought in 2017 for R775 000. For the current year of assessment, her logbook showed that\nshe drove a total of 15 760km of which 8 700km were for business purposes, travelled evenly\nthroughout the period while she was alive. While she paid for all the fuel and maintenance\ncosts, no record thereof was kept.\n• Sibu was also provided with the use of the company owned Macbook Pro laptop, which was\npurchased on 1 March 2020 for R35 000 (including VAT) and had an open market value of\nR35 500. It was given to Sibu on the day it was purchased. She used the Macbook Pro for\nbusiness 30% of the time and the remainder of the time she used it for private purposes. She\nreturned the laptop on 30 June 2020. The laptop was purchased for senior executives to use\nwhen needed.\nSibu was married to Alex out of community of property (without accrual) and had two young children,\nSiliziwe and Hopewell. In 2019, she tried to find a pre-school rugby class for her children but couldn’t\nfind one. She asked around and it became clear that many other people were looking for a similar\nrugby play programme for younger children, and she had spotted a very exciting gap in the child\ndevelopment sector.\nRugby Stars\nIn 2019, she therefore established “Rugby Stars” which she operates as a sole proprietorship. It is an\nafterschool rugby programme for children aged 2.5 years to 5 years. She had to hire coaches, pay\nrental for the use of fields or halls and she incurred other costs such as advertising and start-up costs.\nThe business’ assessed losses incurred have been outlined below:\n2019  |  (75 000)\n2020  |  60 000\n2021 *  |  (25 000)\n* This loss was due to Rugby Stars not operating most of the year due to lockdown restrictions\n* Rugby Stars ceased operations upon her death\nSibu made the following donations during the current year of assessment:\n• Sibu has always loved dogs but was never able to own one as she is allergic. She therefore\ndonates R50 000 per year to the SPCA, a registered PBO and she received a valid s18A\ncertificate on 16 June 2020 when she made the donation.\n• In July 2020, she donated her luxury handbags worth R90 000 to her sister which cost her\nR120 000.\n• She paid her mother, aged 70, a monthly maintenance payment of R10 000. The value of this\nannuity is R93 372.\n• She donated her home in Constantia to her two children in equal shares on 31 December\n2020. She had purchased the house for R5 500 000 on 1 January 2011 and had lived in it\nsince then. Due to the Covid-19 national lockdown, she had worked from home from 1 April\n2020 to 30 November 2020 and had turned her spare room into her office which she\nexclusively and regularly used for her employment trade. She asked a tax consultant and they\nconfirmed that she would be able to claim deductions for the home office. Her office made up\n7% of her home and the deduction she could claim for the current year of assessment was\nR19 600. The market value of the house on 31 December 2020 was R8 000 000.\nAt the date of death, her executor found the following in her will:\n• The proceeds of her life insurance of R7 500 000 will go to her husband and two children. 50%\nto her husband and 25% to each child. Sibu paid total premiums of R600 000 (inclusive of\ninterest at 6%) in respect of this policy over her lifetime. This policy was not taken out under\nany registered ante- or post nuptial contract.\n• Shares that she owned were to be sold and the proceeds were to be left to her mother. She\nowned shares in the following companies at the date of her death:\nPurchase price  |  Market value on 31  |  Proceeds on sale by\nJanuary 2021  |  executor\nZ Prop (Pty) Ltd  |  R20 000  |  R45 000  |  R46 000\nBIC Ltd – listed on the R45 000  |  R56 000  |  R55 000\nJSE\n• An apartment in Zimbabwe was to be left to her children in equal shares. She had inherited\nthe apartment from her father when he passed away and he was resident in Zimbabwe. At the\ndate of her father’s death, the market value was R1 500 000 (correctly converted to Rands).\nThe market value of the apartment at the date of her death was R3 500 000 (correctly\nconverted to Rands).\n• The executors in Sibu’s estate paid out the following expenses out of cash in the estate:\no Deathbed and funeral expenses  |  R90 000\no Administration expenses  |  R75 000\n• Cash in her bank accounts totaled R1 250 000 and was to be left to her children in equal\nshares after any expenses were paid.\nAdditional Information\n• Sibu Mpiti is not a VAT vendor\n• Employees’ tax correctly calculated for Sibu Mpiti for the current year of assessment is\nR585 197\n• Interpretation Note 47, read together with BGR7, allows a four year write off period for all\nqualifying assets", "parts": [{"id": "2.1", "marks": 7, "required": "Calculate, with reasons, the donations tax payable by Sibu Mpiti.\nIn answering this question, indicate when the donations tax would have been due to SARS.", "memo": "2.1 Donations tax payable\nDonation to a PBO  |  Exempt - s56(1)(h)  |  -\nDonation of her handbags  |  90 000\nLess general exemption  |  (90 000)\nDonation to her mother  |  Exempt - s56(2)(c)  |  -\nDonation of her home to her children  |  8 000 000\nLess: general exemption (remaining)  |  (10 000)\nTotal value of donations  |  7 990 000\nDonations tax payable  |  x20%  |  1 598 000\nThe donations tax relating to the house would have been due by 31 January 2021 and therefore still been outstanding at her\ndeath."}, {"id": "2.2", "marks": 11, "required": "Discuss, with supporting calculations, the capital gains tax consequences of the donations Sibu Mpiti has made during the current year of assessment.", "memo": "2.2 A donation is a disposal in terms of the eighth schedule and Sibu will therefore have CGT consequences on the donations.\nThe donation of the cash to the PBO and her mother does not have CGT consequences as money is not an asset in the 8th schedule.\nThe donation of her handbag is a personal use asset therefore the capital loss of (90000-120 000=R30 000) is disregarded\nDonation of her home\nThe proceeds are equal to the market value at the date of the donation which is  |  8 000 000\nThe base cost is the cost that she purchased it for of R5 500 000 plus the donations tax adjustment.  |  5 500 000\nThe donations tax adjustment is R789 164.\n(Y= ((8000000-5500000)/8000000) x ((8000000-10000)x20%))  |  499 375\nThis results in a capital gain of\nCapital gain  |  2 000 625\nThe capital gain needs to be apportioned as she used a portion for trade for a few month\nResidential use  |  Trade use\nTrade use: 2 060 836 x 7% x 8/120  |  1 991 289  |  9 336,25\nResidential use: 2 000 625 - 9 414\nPrimary residence exclusion  |  (2 000 000)  |  -\nCapital gain  |  -  |  9 336\nThis will be aggregated with her other capital gains and losses from other disposals during the year."}, {"id": "2.3", "marks": 21, "required": "Calculate with reasons Sibu Mpiti's normal tax payable to SARS for the 2021 year of assessment.", "memo": "2.3\nSalary  |  Gross income - para (c)  |  (144 000 x 11)  |  1 584 000\nTravel allowance  |  Actual allowance received  |  99 000\nReduced by the deemed method\nThe actual method is not available as she didn't keep a record and the simplified method cannot be used as\nthis is not a reimbursive allowance\nFixed cost  |  (169 552/15 760 x 337/365) x 100  |  993,31\nFuel cost  |  175,10\nMaintenance cost  |  96,90\nTotal deemed cost  |  1 265,31\nReduction  |  (1265,31/100 x 8700)  |  (110 082)  |  -\nlimited to allowance\nLaptop fringe benefit  |  Gross income - para (i)  |  (35 000 x 15% x 122/365)  |  1 755\nNo value doesn't apply as not mainly used for business\nHome office expenditure  |  s11(a)  |  (19 600)\nCapital gains tax consequences\nDeemed disposals on death\nLife insurance - disregarded para 55 of the 8th schedule  |  -\nShares  |  Proceeds - MV  |  101 000\nBase cost  |  (65 000)\nCapital gain  |  36 000\nApartment  |  Proceeds - MV  |  3 500 000\nBase cost  |  (1 500 000)\n2 000 000\nTotal capital gains  |  (0+ 9336 + 36 000 + 2 000 000)  |  2 045 336\nLess annual exclusion on death  |  (300 000)\nNet capital gain  |  1 745 336\nx40%  |  698 135\nTaxable income before assessed loss:  |  2 264 289\nLess: assessed loss from Rugby Stars  |  (25 000)\n-Her taxable income before the assessed loss exceeds the maximum marginal rate of tax\n-This is not a suspect trade and she has only made losses two out of five years and therefore s20A\nis not applicable and her assessed loss can be set off\nTaxable income before 18A  |  2 239 289\nS18A donation  |  Actual  |  50 000  |  -50 000\nLimited to 10% x taxable income  |  223 929\nTaxable income  |  2 189 289\nTax per the tables  |  (559 464 + 45% (2 965 555 - 1 577 300)  |  834 859\nLess: primary rebate  |  (14 958 x 11/12)  |  (13 712)\nNormal tax  |  821 148\nLess: employees tax  |  (585 197)\nNormal tax payable  |  235 951"}, {"id": "2.4", "marks": 6, "required": "Discuss the tax consequences for Z Prop (Pty) Ltd relating to the Macbook Pro laptop for the current year of assessment.\n(5 marks + 1 communication mark: logical argument)", "memo": "2.4\nVAT\nSince the laptop was purchased for the executives to use and the company makes both taxable and exempt supplies and\ntherefore input tax would need to be apportioned\nApportionement ratio = (21 892 410 + 15 540 000)/55 932 410 x 100 =67%\nTherefore input tax of (35 000 x 15/115 x 67%) = R3058 could be claimed on acquisition\ns18(3) deemed output on the fringe benefit requires apportionment and since she is involved in the company as a whole (to the\nextent used for taxable supplies)\nOutput tax = 1 755 x 15/115 x 67%  |  153,371739\nNormal tax\nThe company would be able to claim a s11(e) wear and tear allowance as the laptop is a moveable asset used in trade\ns11(e) is based on the lower of cost or market value (excluding actual VAT)/4\ns11(e) = (35 000-3058)/4\nThe company would be able to claim a s11(a) on the irrecoverable VAT on this fringe benefit\nCommunication mark - logical argument"}, {"id": "2.5", "marks": 10, "required": "Calculate, with reasons, the estate duty payable due to Sibu Mpiti's death.", "memo": "2.5 Estate Duty Payable\nLife Insurance Policy Proceeds (Bequeathed to spouse and children) -s3(3)(a)  |  7 500 000\nNot under an ante or post nuptial contract therefore deemed property\nUnlisted shares - valued at market value  |  45 000\nListed shares - valued at\nprice sold by executor  |  55 000\nApartment in Zimbabwe  |  3 500 000\nCash in bank accounts  |  1 250 000\nLess: allowable deductions\nProperty left to surviving spouse - s4(q)  |  (3 750 000)\n(7 500 000 x 50%)\nProperty outside the Republic, inherited from a person not resident - s4(e)  |  (3 500 000)\nDeathbed and funeral expenses - s4(a)  |  (90 000)\nAdministration expenses - s4(c)  |  (75 000)\nDebts due - s4(b)\nNormal tax  |  (235 951)\nDonations tax - relating to her house  |  (1 598 000)\nNet value of estate  |  3 101 049\nLess: Abatement  |  (3 500 000 limited to value of estate)  |  (3 101 049)\nDutiable amount of the estate  |  -"}]}]}, {"id": "rockit", "title": "Rockit Backpackers Ltd — VAT Scenario", "short": "Rockit", "marks": 41, "yoa": "2025", "unofficial": true, "memoNote": "Memo generated with NotebookLM from your Tax 2 notebook. It is not an official solution, so check anything that looks off.", "tables": "MONETARY CHANGES - 2025\nApplicable in respect of years of assessment commencing on or after 1 March 2024 (i.e.\n2025 year of assessment) – unless specifically stated otherwise\nREBATES (section 6)\nPrimary rebate increases from R16 425 to R17 235;\nSecondary rebate increases from R9 000 to R9 444;\nTertiary rebate increases from R2 997 to R3 145\nMEDICAL REBATES (section 6A)\nBenefits to the taxpayer: R364;\nBenefits to the taxpayer and one dependant: R728;\nBenefits to each additional dependant: R246\nRESIDENTIAL ACCOMMODATION (paragraph 9 of the Seventh Schedule)\nSymbol B of R91 250 increases to R95 750.\nRATES OF NORMAL TAX\n•  |  In respect of the taxable income (excluding any retirement fund lump sum\nbenefit, retirement fund lump sum withdrawal benefit or severance benefit) of natural\npersons, estates and special trusts\nTaxable Income (R)  |  Rate of Tax\n0 – 237 100  |  18% of taxable income\n237 101 – 370 500  |  42 678 + 26% of taxable income above 237 100\n370 501 – 512 800  |  77 362 + 31% of taxable income above 370 500\n512 801 – 673 000  |  121 475 + 36% of taxable income above 512 800\n673 001 – 857 900  |  179 147 + 39% of taxable income above 673 000\n857 901 – 1 817 000  |  251 258 + 41% of taxable income above 857 900\n1 817 001 and above  |  644 489 + 45% of taxable income above 1 817 000\n•  |  In respect of the taxable income of any company which qualifies as a small\nbusiness corporation as defined in section 12E of the Income Tax Act, in respect of\nany year of assessment ending any date between 1 April 2025 and 31 March 2026.\nTaxable Income (R)  |  Rate of Tax\n0 – 95 750  |  0% of taxable income\n95 751 – 365 000  |  7% of the amount above R95 750\n365 001 – 550 000  |  R18 848 + 21% of the amount above R365 000\n550 001 and above  |  R57 698 + 27% of the amount above R550 000\nTRAVEL ALLOWANCE\nWhere the value of the vehicle (R) -  |  Fixed  |  Fuel  |  Mainte\ncost  |  cost  |  nance\ncost\n(R p.a.)  |  (c/km  |  (c/km)\n)\ndoes not exceed R100 000  |  34 480  |  151.7  |  46.0\nexceeds R100 000 but does not exceed R200 000  |  61 770  |  169.4  |  57.6\nexceeds R200 000 but does not exceed R300 000  |  89 119  |  184.0  |  63.5\nexceeds R300 000 but does not exceed R400 000  |  113 436  |  197.9  |  69.3\nexceeds R400 000 but does not exceed R500 000  |  137 752  |  211.8  |  81.5\nexceeds R500 000 but does not exceed R600 000  |  163 178  |  243.0  |  95.6\nexceeds R600 000 but does not exceed R700 000  |  188 653  |  247.1  |  107.3\nexceeds R700 000 but does not exceed R800 000  |  215 447  |  251.2  |  118.9\nexceeds R800 000  |  215 447  |  251.2  |  118.9\nAlternative fixed rate for certain reimbursive travel allowances: 484 cents per kilometer\n(previously 464 cents)\nSUBSISTENCE ALLOWANCE\n• Local travel:\no  |  Allowance for incidental costs only – R169 (previously R161) for each day.\no  |  Allowance for meals and incidental costs – R548 (previously R522) for each day.\n• Overseas travel:\nActual accommodation plus a prescribed amount based on the relevant country (which\namount will be provided in the IAC if it differs from the amount listed in the Regulation in\nthe SAICA Student Handbook).\nTRANSFER DUTY (Section 2(1)(b) of the Transfer Duty Act)\nIn respect of acquisition of property on or after 1 March 2020:\nValue of property (R)  |  Rate\n0 – 1 100 000  |  0%\n1 100 001 – 1 512 500  |  3% of the value above R1 100 000\n1 512 501 – 2 117 500  |  R12 375 + 6% of the value above R1 512 500\n2 117 501 – 2 722 500  |  R48 675 + 8% of the value above R2 117 500\n2 722 501 – 12 100 000  |  R97 075 + 11% of the value above R2 722 500\n12 100 001 and above  |  R1 128 600 + 13% of the value above R12 100 000", "questions": [{"id": "Q1", "title": "Rockit Backpackers Ltd (VAT)", "marks": 41, "scenario": "Rockit Backpackers  |  (41 MARKS, 62 MINUTES)\nRockit Backpackers Ltd (‘Rockit’) is a category C Value-Added Tax vendor, and carries on\nthe business of selling amateur and professional backpacks and climbing equipment. Rockit\nalso recently won ‘Adventure Consultant of the Year’ for its work in providing top athletes\nwith preparation consultation before they embark on technical mountain climbing journeys. In\naddition the company also provides transportation services to various hiking groups and\nclimbers to the various adventure hotspots of the Western Cape area. Rockit provides this\nservice with its company-owned mini-bus.\nRockit is currently preparing its one-month VAT 201 return for the period ended 31 October\n2024, which is also its year-end. The company’s financial manager was recently invited to\njoin an executive team on a once-in-a-lifetime trip to the base camp of Everest and was\ntherefore unable to complete the VAT 201 return. As a result, Rockit has asked you assist\nwith the preparation of the VAT 201 return and to assist them with certain VAT issues they\nare unfamiliar with.\nAll amounts include VAT where appropriate, unless stated otherwise. Where applicable, VAT\ninvoices are on hand.\nThe following information has been provided to you:\n1. An extract from the Rockit Statement of Comprehensive Income for the one-month\nperiod ended 31 October 2024 reflects the following:\nNotes  |  R\nRevenue  |  a  |  5 380 000\nCost of Sales  |  b  |  2 840 000\na) Revenue includes the following:\nSale of Hiking equipment:  |  R2 020 000\nAthlete Consulting:  |  R2 015 000\nShuttle Service:  |  R1 345 000\nb) Cost of sales consists of the following:\nOpening Stock  |  R1 820 000\nPurchases during the month  |  R2 020 000\nClosing Stock  |  (R1 000 000)\nR2 840 000\n2. Purchase of Assets\nRockit purchased a high-pressure climitisation chamber for their athlete consulting\noffering to help prepare hikers/climbers for the high altitudes they will reach while\nthey are on a mountain climbing expedition. The invoice for the high-pressure\nchamber was received on 1 September 2024 for an amount of R430 000, but was\nonly delivered to the company’s premises on 1 October 2024.\n3. Administration expenses\nDuring October 2024, Rockit incurred administration expenses of R284 000. These\nexpenses included stationery, paper and Wifi charges, amongst others, and were\nused by administrative staff working in the hiking and athlete consulting division only.\n4. Vehicle purchases\nOctober was considered a month for capital investment. Rockit purchased two\nvehicles. One was a double-cab bakkie, which was used as a delivery vehicle for\nsales of its backpacks and climbing equipment. The second was a new 18-seater\nVolkswagen mini-bus kombi, which was used with in the transportation offering\nprovided by Rockit. The two vehicles cost R640 000 and R750 000 respectively.\n5. Rockit sold a computer to L-Way (Pty) Ltd (‘L-Way’) for R16 000. L-Way is a\nbackpack manufacturer and manufactures many of the products sold by Rockit. The\ncomputer will be used by L-Way to conduct all the administration activities of its\nbusiness. Rockit had used the computer for the administration of product sales\nexclusively. The market value on 20 October 2024, the date of sale and on which\npayment was received, was R18 000.\n6. Salaries and wages of R373 000 were paid to employees for the month of October.\n7. Rockit Ltd purchased leather tags from a non-vendor for R1 500. These tags were\nactually off-cuts from the non-vendor’s trade and were considered used. The open\nmarket value on the day the tags were bought was R1 000. Rockit, in turn, sold the\ntags to Cape Union Tart (Pty) Ltd (‘CUT’). CUT will use the leather in its\nmanufacturing process. The selling price was R2 000, when the open market value\nwas R2 250. The transaction in respect of the purchase and sale of these tags took\nplace on October 2024.\n8. One of the new assistant accountants at Rockit had completely forgotten his tax\nknowledge that he had acquired whilst at University and wanted to clarify the\nfollowing point with you regarding the November 2024 VAT period:\n“I was just wondering how I would deal with the following from a VAT perspective. I\nam busy calculating the sales for the month of November for both consulting as well\nas the transportation offerings of our company. It seems like there was a large\nvolume of credit sales for this month and most of them were with non-VAT vendors.\nSurely Rockit would not need to incur Output VAT on these sales as they have not\nbeen paid and the other party claimed no input. The value of sales on credit for\nconsultancy and transport was R1 100 000 and R385 000 respectively before making\nany VAT adjustments. Please would you consider clearing all this up. All this coffee\nmaking has made my brain fuzzy.”\nJournal Entries\nFurthermore, the financial manager processed the following journal entries. However, the\nnew assistant accountant is worried that these entries could be wrong and that he would\nbe blamed for the errors. He suspects some adjusting entries are necessary but due to\nthe stress he has asked you to help process these. The entries processed were:\nDR  |  CR\n1. Dr  |  Administration Costs  |  73 913,04\nDr  |  VAT Input  |  11 086,96\nCr  |  Bank  |  85 000\nThis relates to the admin expenses relating solely to the transportation division of the\ncompany.\n2. Dr  |  Entertainment expense  |  5 217,39\nDr  |  VAT Input  |  782,61\nCr  |  Bank  |  6 000\nThis payment relates to the costs incurred when a potential client was taken out for dinner.\n3. Dr  |  Petrol Expenses  |  434,78\nDr  |  VAT Input  |  65,22\nCr  |  Accounts Payable  |  500\nFuel costs incurred on petrol in delivery vehicle.", "parts": [{"id": "1", "marks": 3, "required": "Briefly explain when a person should register as a VAT vendor.", "memo": "Required 1: Vendor Registration Requirements\nMarking Point / Principle  |  Marks\nIn terms of section 23(1)(a) of the VAT Act, a person carrying on an enterprise is compulsorily liable to register as a VAT vendor at the end of any month where the total value of taxable supplies made in the 12 months ending at the end of that month has exceeded R1 million.  |  1\nAlternatively, in terms of section 23(1)(b), compulsory registration is required at the commencement of any month where there are reasonable grounds for believing that taxable supplies in the next 12 months will exceed R1 million in terms of a written contractual obligation.  |  1\nIn terms of section 23(3)(b), a person may voluntarily register if taxable supplies made have exceeded R50 000 in the preceding 12-month period (or are reasonably expected to exceed R50 000 within 12 months).  |  0,5\nA person liable to register compulsorily must apply within 21 days of becoming liable (section 23(2)).  |  0,5\nAvailable  |  3\nMaximum  |  3"}, {"id": "2", "marks": 2, "required": "Briefly explain the difference between direct and indirect taxes, giving an example of each.", "memo": "Required 2: Direct vs. Indirect Taxes\nMarking Point / Principle  |  Marks\nDirect taxes are levied directly on the income, profits or wealth of a person who bears the ultimate legal and economic burden.  |  0,5\nExample of a direct tax: normal income tax, capital gains tax, donations tax or estate duty.  |  0,5\nIndirect taxes are levied on transactions, goods or services; the vendor collects and pays them over, but the economic burden is passed on to the final consumer.  |  0,5\nExample of an indirect tax: VAT, customs duty, excise duty or transfer duty.  |  0,5\nAvailable  |  2\nMaximum  |  2"}, {"id": "3", "marks": 6, "required": "Discuss, with supporting calculations, what the VAT consequences would be for Rockit Backpackers Ltd relating to the purchase of the two vehicles in Note 4.\n(5 marks + 1 communication mark: logical argument)", "memo": "Required 3: VAT Consequences of Vehicle Purchases (Note 4)\nMarking Point / Principle  |  Marks\nDouble-cab bakkie (R640 000):\nIn terms of section 1 of the VAT Act, a \"motor car\" includes a double-cab light delivery vehicle.  |  1\nThe double-cab bakkie therefore falls within the definition of a motor car.  |  0,5\nIn terms of section 17(2)(c), input tax is denied on any motor car supplied to a vendor, unless acquired by a car dealer for resale, a car rental enterprise, etc.  |  1\nEven though the bakkie is used for deliveries of taxable sales, none of the exceptions apply; input tax is denied in full (input tax = R0).  |  0,5\n18-seater Volkswagen mini-bus kombi (R750 000):\nIn terms of section 1, a minibus constructed to carry 16 or more persons is excluded from the definition of \"motor car\".  |  1\nInput tax is therefore not denied under section 17(2)(c).  |  0,5\nHowever, in terms of section 17(1), input tax may only be claimed to the extent goods are acquired for making taxable supplies.  |  1\nIn terms of section 12(g), the transport by road of fare-paying passengers is an exempt supply.  |  1\nThe minibus is used exclusively in the passenger transportation offering (exempt), so no input tax can be claimed (input tax = R0).  |  0,5\nCommunication skill — logical argument  |  1\nAvailable  |  7\nMaximum  |  6"}, {"id": "4", "marks": 16, "required": "Calculate, with reasons, the net VAT payable/receivable by Rockit Backpackers Ltd for the VAT period ending 31 October 2024 relating to notes 1 – 7.\nYour solution must also include an explanation for any item mentioned in the scenario that you have specifically excluded from your calculation.\nPresent it as:  Description  |  Reasons  |  VAT input  |  VAT output", "memo": "Required 4: Net VAT Payable/Receivable for the Period Ended 31 October 2024 (Notes 1–7)\nDescription  |  Reasons  |  VAT input (R)  |  VAT output (R)  |  Marks\nNote 1(a): Sale of hiking equipment  |  Standard-rated supply of goods (s7(1)(a)). R2 020 000 × 15/115  |    |  263 478,26  |  1\nAthlete consulting fees  |  Standard-rated supply of services (s7(1)(a)). R2 015 000 × 15/115  |    |  262 826,09  |  1\nShuttle service revenue  |  Exempt supply, s12(g) transport of fare-paying passengers by road. No output tax.  |    |  0  |  1\nNote 1(b): Opening stock  |  Accounting balance, not a supply in this tax period; input claimed when purchased.  |  0  |    |  1\nPurchases during the month  |  Acquired wholly to make taxable supplies of hiking equipment (s17(1)), valid tax invoices held. R2 020 000 × 15/115  |  263 478,26  |    |  1\nClosing stock  |  Accounting adjustment, not a supply.  |  0  |    |  0,5\nNote 2: Climatisation chamber  |  Time of supply is the earlier of invoice or payment (s9(1)). Invoice received 1 September 2024, so input tax is claimed in the September 2024 period, not October.  |  0  |    |  1,5\nNote 3: Administration expenses  |  Used only by admin staff of the hiking and consulting divisions (taxable supplies), so no apportionment (s17(1)). R284 000 × 15/115  |  37 043,48  |    |  1,5\nNote 4: Double-cab bakkie  |  Motor car as defined, input tax denied s17(2)(c).  |  0  |    |  1\nNote 4: 18-seater mini-bus  |  Used only for exempt passenger transport (s12(g)); input denied by s17(1).  |  0  |    |  1\nNote 5: Sale of computer to L-Way  |  Taxable supply of an asset used in the enterprise (s7(1)(a)/s8(16)). L-Way could claim full input tax, so the s10(4) connected-person OMV rule would not apply even if connected; consideration R16 000 × 15/115  |    |  2 086,96  |  2\nNote 6: Salaries and wages  |  Services by employees are excluded from \"enterprise\" (proviso (iii)); outside the scope of VAT.  |  0  |    |  1\nNote 7: Purchase of leather tags  |  Second-hand goods from a non-vendor: notional input tax on the lower of consideration (R1 500) and OMV (R1 000) (s16(3)(a)(ii)). R1 000 × 15/115  |  130,43  |    |  1,5\nNote 7: Sale of tags to CUT  |  Standard-rated supply (s7(1)(a)) at consideration R2 000 × 15/115  |    |  260,87  |  1\nSubtotals  |    |  300 652,17  |  528 652,18\nNet VAT payable for October 2024  |  Output R528 652,18 less input R300 652,17  |    |  228 000,01  |  1\nAvailable  |  17\nMaximum  |  16"}, {"id": "5", "marks": 6, "required": "Discuss, with supporting calculations, what the VAT consequences would be for Rockit Backpackers Ltd during the November 2024 VAT period under review of the transactions detailed in Note 8.\n(5 marks + 1 communication mark: logical argument)", "memo": "Required 5: November 2024 Credit Sales (Note 8)\nMarking Point / Principle  |  Marks\nRockit is a category C vendor accounting on the invoice basis (s15(1)).  |  0,5\nIn terms of s9(1), the time of supply is the earlier of the date an invoice is issued or payment is received.  |  1\nThat the sales are on credit and unpaid is irrelevant: output tax must be declared in the period the invoice is issued.  |  1\nWhether the customers are vendors (and can claim input tax) is irrelevant to Rockit's liability for output tax (s7(1)(a)).  |  1\nConsultancy credit sales (R1 100 000) are standard-rated services.  |  0,5\nOutput tax in the November 2024 return: R1 100 000 × 15% = R165 000 (if exclusive) or R1 100 000 × 15/115 = R143 478 (if inclusive).  |  1\nTransport credit sales (R385 000) are passenger transport by road, an exempt supply (s12(g)).  |  0,5\nNo output tax on the transport sales.  |  0,5\nCommunication skill — logical argument  |  1\nAvailable  |  7\nMaximum  |  6"}, {"id": "6", "marks": 8, "required": "Provide, with reasons, the correcting journal entries, if necessary, for the three journal entries the assistant accountant of Rockit Backpackers Ltd asked you to review.\nYour solution must also include an explanation for any transactions that do not require a correcting journal entry.", "memo": "Required 6: Correcting Journal Entries\nMarking Point / Principle  |  Marks\nJournal 1 (admin costs, transport division): the costs relate solely to exempt passenger transport (s12(g)).  |  0,5\nInput tax may only be claimed for taxable supplies (s17(1)), so no input tax may be claimed.  |  1\nThe input tax claimed must be reversed to administration costs.  |  0,5\nCorrecting entry: Dr Administration costs R11 086,96; Cr VAT input R11 086,96  |  1\nJournal 2 (client dinner): food and beverages for a potential client is \"entertainment\" as defined (s1).  |  0,5\nInput tax on entertainment is denied by s17(2)(a); no exception applies.  |  1\nThe input tax claimed must be reversed to entertainment expense.  |  0,5\nCorrecting entry: Dr Entertainment expense R782,61; Cr VAT input R782,61  |  1\nJournal 3 (petrol): fuel subject to the fuel levy is zero-rated (s11(1)(h)).  |  1\nNo VAT was charged by the supplier on the petrol.  |  0,5\nInput tax of R65,22 was incorrectly claimed and must be reversed.  |  0,5\nCorrecting entry: Dr Petrol expenses R6
